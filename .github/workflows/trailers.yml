# Commit messages and PR text carry only the attribution this repo allows
# (CLAUDE.md, Workflow rules): "Co-Authored-By: ukubi-claude-<host>
# <noreply@bnei.dev>" or "ukubi-agent", "Agent-Session: <id>", and in a
# definition pod "Agent-Definition: <name>@<sha>". Refused: a Claude or Anthropic
# co-author or commit author/committer in any other form (a squash merge turns
# each author into a Co-authored-by line on main), a generated-with footer, a
# claude.ai or claude.com URL, a Claude-Session trailer and model names. The
# rules, and the stricter policy mountain uses, are in
# .github/scripts/check-trailers.py (ukubi-bridge keeps its own copy of the
# script, held in step by hand). History already on main is not scanned: only
# the PR's range.
name: trailers

on:
  pull_request:
    # edited: a title or body changed after the last push is scanned again.
    types: [opened, synchronize, reopened, edited]

# Read-only, like every workflow here (core/internal/buildguard
# TestWorkflowsWriteOnlyInReleaseJobs).
permissions:
  contents: read

jobs:
  trailers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Every commit of the PR range needs its history.
          fetch-depth: 0

      - name: Self-test the check
        run: python3 -I .github/scripts/check_trailers_test.py

      # The title and body reach the script as environment variables, never
      # interpolated into the shell text: they are the PR author's words.
      - name: Check commit messages, PR title and body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -I .github/scripts/check-trailers.py --policy agent --range "${BASE_SHA}..${HEAD_SHA}"
