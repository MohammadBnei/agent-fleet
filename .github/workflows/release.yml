name: Release It

# Adapted from dream-analyst's release.yml — same release-it +
# conventional-changelog shape, run from the repo root (this repo has one
# version/CHANGELOG for the whole fleet, not a per-package split). Bun
# instead of npm, matching the rest of this repo's JS runtime choice.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'k8s/*'
      - 'package.json'

# Concurrent releases: keep the newest, cancel the rest. The survivor releases
# from main's tip, so it carries the cancelled runs' commits with it — one tag
# covering the lot, rather than a queue of one-commit releases each rebuilding
# an image the next one obsoletes.
#
# Without a group at all, two runs compute the same version from the same latest
# tag, and the loser's push is rejected non-fast-forward after it has already
# bumped package.json and made a local tag — that release is simply lost.
#
# Cancelling is only safe because the push is atomic: see git.pushArgs in
# package.json. Everything before the push is local to the runner and dies with
# it; the push itself is the one window where a kill could split branch from tag.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: git config
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Run release-it
        run: git update-index --refresh && git diff-index --quiet HEAD || git reset --hard && bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
