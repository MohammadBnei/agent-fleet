name: Release It

# Adapted from dream-analyst's release.yml — same release-it +
# conventional-changelog shape, run from the repo root (this repo has one
# version/CHANGELOG for the whole fleet, not a per-package split). Bun
# instead of npm, matching the rest of this repo's JS runtime choice.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'package.json'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: git config
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Run release-it
        run: git update-index --refresh && git diff-index --quiet HEAD || git reset --hard && bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
