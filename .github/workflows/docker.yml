name: Build, Test and Deploy

# Tests, then the shared ukubi-ci workflows (v0.11.1, Forgejo Actions):
#
#  - release.yml cuts the version from Conventional Commits and pushes an
#    annotated tag on the tested commit. Nothing is committed to main (no
#    package.json bump, no CHANGELOG edit; CHANGELOG.md stays as history).
#  - image.yml builds core, migration and executor on the build-runner LXC
#    (`ukubi-build`, buildah), pushes <sha12> tags to Zot, and for core and
#    migration commits the pin to a file of its own on the `deploy` branch:
#    k8s/image-core.yaml (.image.tag) and k8s/image-migration.yaml
#    (.hooks.migrate.image.tag). ArgoCD has to layer both over k8s/core.yaml
#    (infra-bootstrap's agent-fleet-core registry entry) before they deploy.
#    executor has no pin: catalog.go floats on its `latest`, pushed here.
#  - provisioner, worker and sidecar only build (image-build.yml). Their pins
#    sit in k8s/provisioner/*.yaml, plain manifests that a standalone
#    Application syncs from main, and nothing may commit to main any more.
#    Pushing sha tags nobody pins would only push the pinned src-<hash> tags
#    out of Zot (it keeps 3 per repo). They move to image.yml once that
#    Application can read pins from the deploy branch.
#
# On a pull_request every image builds and nothing is pushed: image.yml's own
# guard decides that from the payload, so the uses: jobs carry no if:
# (Forgejo evaluates it inside the called jobs, where event_name is
# workflow_call).

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    # `paths` with negations rather than paths-ignore, because the last match
    # wins: definitions/ and packs/ are mostly .md, and a merge touching only
    # them must still cut a release.
    paths:
      - '**'
      - '!**.md'
      - '!k8s/*'
      - '!package.json'
      - 'definitions/**'
      - 'packs/**'
    tags-ignore:
      - '*'

# Read-only by default; the test jobs run PR code. Guarded by
# core/internal/buildguard (TestWorkflowsWriteOnlyInReleaseJobs).
permissions:
  contents: read

# Forgejo honours only the workflow-level group. A newer PR push cancels its
# older run; main runs queue and are never cancelled once a tag may be pushed.
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `bun run test`, not bare `bun test`: the script adds --isolate.
  # session.test.ts mock.module()s ./sidecarClient.js, which is
  # process-global and survives mock.restore().
  worker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        working-directory: worker
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: worker
        run: bun run typecheck
      - name: Run tests
        working-directory: worker
        run: bun run test

  # The dashboard ships inside core's image. `bun run build` is `tsc -b &&
  # vite build`; only `tsc -b` enforces noUnusedLocals.
  dashboard-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        working-directory: dashboard
        run: bun install --frozen-lockfile
      - name: Run tests
        working-directory: dashboard
        run: bun test
      - name: Build
        working-directory: dashboard
        run: bun run build

  # docs/adr/0068: the <fleet-agent> island, compiled into core's image.
  islands-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        working-directory: islands
        run: bun install --frozen-lockfile
      - name: Run tests
        working-directory: islands
        run: bun test src
      - name: Build
        working-directory: islands
        run: bun run build

  # A dry run on a PR (the would-be notes in the summary); a tag on main.
  release:
    needs: [worker-test, dashboard-test, islands-test]
    permissions:
      contents: write # release.yml pushes the release tag
    uses: MohammadBnei/ukubi-ci/.github/workflows/release.yml@9af316b5d779b2d5ef3f55b9f11e20b8bf3f6ce8 # v0.11.1

  # Repo-root context for every image: each Dockerfile COPYs go.work,
  # proto/gen/go or db/migrations as siblings of its own directory.
  core:
    needs: release
    uses: MohammadBnei/ukubi-ci/.github/workflows/image.yml@9af316b5d779b2d5ef3f55b9f11e20b8bf3f6ce8 # v0.11.1
    with:
      runs-on: '["ukubi-build"]'
      image: agent-fleet-core
      ref: ${{ needs.release.outputs.tag }}
      dockerfile: core/Dockerfile
      values-file: k8s/image-core.yaml
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write

  migration:
    needs: release
    uses: MohammadBnei/ukubi-ci/.github/workflows/image.yml@9af316b5d779b2d5ef3f55b9f11e20b8bf3f6ce8 # v0.11.1
    with:
      runs-on: '["ukubi-build"]'
      image: agent-fleet-migration
      ref: ${{ needs.release.outputs.tag }}
      dockerfile: migration/Dockerfile
      values-file: k8s/image-migration.yaml
      values-key: .hooks.migrate.image.tag
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write

  executor:
    needs: release
    uses: MohammadBnei/ukubi-ci/.github/workflows/image.yml@9af316b5d779b2d5ef3f55b9f11e20b8bf3f6ce8 # v0.11.1
    with:
      runs-on: '["ukubi-build"]'
      image: agent-fleet-executor
      ref: ${{ needs.release.outputs.tag }}
      dockerfile: executor/Dockerfile
      deploy: false
      extra-tags: latest
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write

  provisioner:
    uses: MohammadBnei/ukubi-ci/.github/workflows/image-build.yml@9af316b5d779b2d5ef3f55b9f11e20b8bf3f6ce8 # v0.11.1
    with:
      runs-on: '["ukubi-build"]'
      image: agent-fleet-provisioner
      dockerfile: provisioner/Dockerfile

  worker:
    uses: MohammadBnei/ukubi-ci/.github/workflows/image-build.yml@9af316b5d779b2d5ef3f55b9f11e20b8bf3f6ce8 # v0.11.1
    with:
      runs-on: '["ukubi-build"]'
      image: agent-fleet-worker
      dockerfile: worker/Dockerfile

  sidecar:
    uses: MohammadBnei/ukubi-ci/.github/workflows/image-build.yml@9af316b5d779b2d5ef3f55b9f11e20b8bf3f6ce8 # v0.11.1
    with:
      runs-on: '["ukubi-build"]'
      image: agent-fleet-sidecar
      dockerfile: sidecar/Dockerfile
