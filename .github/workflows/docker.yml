name: Build, Test and Deploy

# Adapted from dream-analyst's docker.yml — same Docker Hub build/push shape
# (the Trivy scan step is disabled below — SARIF output went nowhere), now
# matrixed across this repo's images (worker, core, provisioner, sidecar)
# instead of one, with a bun test run per Bun component ahead of the build,
# plus a deploy job (below) that bumps k8s/**/*.yaml's pinned image tags on
# every release so ArgoCD (core via a two-source Application, values pulled
# straight from this repo; provisioner via its own standalone plain-manifest
# Application, see k8s/provisioner/README.md) actually redeploys instead of
# silently building an image nobody picks up.
#
# DOCKERHUB_USERNAME/DOCKERHUB_TOKEN live in Infisical (agent-fleet-nygh
# project, per Mohammad's request to centralize CI secrets there instead of
# duplicating them as native GitHub secrets) — pulled in via a read-only,
# project-scoped Infisical service token. INFISICAL_TOKEN is the one
# necessary native GitHub secret: bootstrapping trust into Infisical needs
# some credential, and a repo secret is where every other workflow already
# keeps that kind of thing.

on:
  pull_request:
  push:
    tags:
      - '*'

env:
  PLATFORMS: linux/amd64
  INFISICAL_PROJECT_ID: ae771c2c-5115-452a-8f1c-1e03fa0e2b9a

jobs:
  # Precise CI on pull_request: only build/test the image(s) whose files
  # actually changed in this PR — nothing is pushed on a PR anyway
  # (`push: false` below), so this is pure CI-time cost, safe to skip.
  # On a real release (push: tags), this filtering is bypassed entirely —
  # every image always builds+pushes, full stop. A release tag has to
  # produce a complete, consistent set of images; skipping one because its
  # dir "didn't change since this PR's diff" would leave deploy's
  # k8s/*.yaml tag-bump pointing at a tag some image was never actually
  # pushed under.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Setting ANY permissions here resets every other permission to `none`
    # for this job's GITHUB_TOKEN (not just the ones listed) — contents:
    # read must be explicit or actions/checkout's own clone fails.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      worker: ${{ steps.filter.outputs.worker }}
      e2e-runner: ${{ steps.filter.outputs.e2e-runner }}
      migration: ${{ steps.filter.outputs.migration }}
      go-components: ${{ steps.components.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            worker:
              - 'worker/**'
            e2e-runner:
              - 'e2e-runner/**'
              - 'proto/**'
            migration:
              - 'migration/**'
              - 'db/migrations/**'
            proto:
              - 'proto/**'
            core:
              - 'core/**'
            provisioner:
              - 'provisioner/**'
            sidecar:
              - 'sidecar/**'
            executor:
              - 'executor/**'
      - name: Compute go-components matrix
        id: components
        uses: actions/github-script@v7
        with:
          script: |
            const proto = ${{ steps.filter.outputs.proto }};
            // Not named `core` — actions/github-script already injects its
            // own `core` (the @actions/core toolkit) into this scope;
            // shadowing it throws "Identifier 'core' has already been
            // declared".
            const coreChanged = ${{ steps.filter.outputs.core }};
            const provisioner = ${{ steps.filter.outputs.provisioner }};
            const sidecar = ${{ steps.filter.outputs.sidecar }};
            const executor = ${{ steps.filter.outputs.executor }};
            const components = [];
            if (proto || coreChanged) components.push('core');
            if (proto || provisioner) components.push('provisioner');
            if (proto || sidecar) components.push('sidecar');
            if (proto || executor) components.push('executor');
            return components;

  build-push:
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.worker == 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one image's test/build failure shouldn't hide the other's status
      matrix:
        component: [worker]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: bun install --frozen-lockfile

      - name: Run tests
        working-directory: ${{ matrix.component }}
        # bun test exits 1 with zero matching files — harmless today (only
        # worker/ has tests so far) but would hard-fail bot/'s matrix leg
        # otherwise. Drop this guard once every component has at least one.
        run: |
          if ls -- *.test.ts src/*.test.ts 2>/dev/null | grep -q .; then
            bun test
          else
            echo "no test files in ${{ matrix.component }}/ — skipping"
          fi

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get update && sudo apt-get install -y infisical

      - name: Load secrets from Infisical
        run: |
          set -euo pipefail
          # GitHub only auto-masks values that came from `secrets.*` in this
          # workflow — anything pulled from an external system (Infisical)
          # is invisible to that redaction engine until explicitly
          # registered with `::add-mask::`. Skipping that step is what
          # leaked DOCKERHUB_TOKEN in cleartext in a prior run (it showed up
          # in the *next* step's "env:" group header). --format=dotenv
          # (not dotenv-export, which prefixes "export " onto the key and
          # broke $GITHUB_ENV parsing — that's also why the job failed).
          while IFS='=' read -r key raw_value; do
            [ -z "$key" ] && continue
            value="${raw_value%\'}"
            value="${value#\'}"
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done < <(infisical export --domain=https://infisical.bnei.dev/api --token="${{ secrets.INFISICAL_TOKEN }}" --projectId="$INFISICAL_PROJECT_ID" --env=dev --format=dotenv | grep -E '^DOCKERHUB_')

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: package.json info
        id: info
        uses: jaywcjlove/github-action-package@v2.0.0

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name == 'push' }}
          load: true # single-platform build — was needed to make the image
                     # visible to the local docker daemon for the (now
                     # disabled) Trivy scan step; harmless to leave
          context: .
          file: ${{ matrix.component }}/Dockerfile
          tags: >-
            ${{ env.DOCKERHUB_USERNAME }}/agent-fleet-${{ matrix.component }}:${{ steps.info.outputs.version }},
            ${{ env.DOCKERHUB_USERNAME }}/agent-fleet-${{ matrix.component }}:latest
          cache-from: type=registry,ref=${{ env.DOCKERHUB_USERNAME }}/agent-fleet-${{ matrix.component }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKERHUB_USERNAME }}/agent-fleet-${{ matrix.component }}:buildcache,mode=max

      # Disabled — SARIF output was never consumed (no code scanning setup),
      # so this ran on every build/PR without anyone acting on the results.
      # - name: Scan Docker image
      #   uses: aquasecurity/trivy-action@master
      #   with:
      #     image-ref: ${{ env.DOCKERHUB_USERNAME }}/agent-fleet-${{ matrix.component }}:${{ steps.info.outputs.version }}
      #     format: 'sarif'
      #     output: 'trivy-results-${{ matrix.component }}.sarif'
      #     severity: 'CRITICAL,HIGH,MEDIUM'
      #     vuln-type: 'os,library'
      #     ignore-unfixed: true
      #     cache-dir: ${{ github.workspace }}/.cache/trivy

  # Separate job rather than folding into the matrix above: e2e-runner has
  # no package.json/tests, it's a plain image build — a few duplicated
  # steps here are cheaper than conditional-skip logic in the shared job.
  build-push-e2e-runner:
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.e2e-runner == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get update && sudo apt-get install -y infisical

      - name: Load secrets from Infisical
        run: |
          set -euo pipefail
          while IFS='=' read -r key raw_value; do
            [ -z "$key" ] && continue
            value="${raw_value%\'}"
            value="${value#\'}"
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done < <(infisical export --domain=https://infisical.bnei.dev/api --token="${{ secrets.INFISICAL_TOKEN }}" --projectId="$INFISICAL_PROJECT_ID" --env=dev --format=dotenv | grep -E '^DOCKERHUB_')

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # github.ref_name is "<PR#>/merge" on pull_request events — an invalid
      # Docker tag (contains a slash). No package.json here to read a
      # version from (unlike the matrix job's steps.info), so compute a safe
      # tag directly: the pushed tag name on a real release, "pr-<number>"
      # otherwise.
      - name: Compute image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name == 'push' }}
          context: .
          file: e2e-runner/Dockerfile
          tags: >-
            ${{ env.DOCKERHUB_USERNAME }}/agent-fleet-e2e-runner:${{ steps.tag.outputs.value }},
            ${{ env.DOCKERHUB_USERNAME }}/agent-fleet-e2e-runner:latest
          cache-from: type=registry,ref=${{ env.DOCKERHUB_USERNAME }}/agent-fleet-e2e-runner:buildcache
          cache-to: type=registry,ref=${{ env.DOCKERHUB_USERNAME }}/agent-fleet-e2e-runner:buildcache,mode=max

  # Same shape as build-push-e2e-runner: a plain Dockerfile with no
  # package.json/go.mod of its own (docs/adr/0030) — just db/migrations/
  # COPY'd into the official migrate/migrate image. Unlike e2e-runner's
  # deliberately floating :latest, this DOES need a real version tag: the
  # deploy job's blanket `tag: "..."` sed bumps k8s/core.yaml's
  # hooks.migrate.image.tag to match every release, so the image under
  # that exact tag must already be pushed by the time deploy runs (see its
  # `needs:` below).
  build-push-migration:
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.migration == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get update && sudo apt-get install -y infisical

      - name: Load secrets from Infisical
        run: |
          set -euo pipefail
          while IFS='=' read -r key raw_value; do
            [ -z "$key" ] && continue
            value="${raw_value%\'}"
            value="${value#\'}"
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done < <(infisical export --domain=https://infisical.bnei.dev/api --token="${{ secrets.INFISICAL_TOKEN }}" --projectId="$INFISICAL_PROJECT_ID" --env=dev --format=dotenv | grep -E '^DOCKERHUB_')

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # No package.json here to read a version from — same PR-safe
      # tag-computation pattern as build-push-e2e-runner.
      - name: Compute image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name == 'push' }}
          context: .
          file: migration/Dockerfile
          tags: >-
            ${{ env.DOCKERHUB_USERNAME }}/agent-fleet-migration:${{ steps.tag.outputs.value }},
            ${{ env.DOCKERHUB_USERNAME }}/agent-fleet-migration:latest
          cache-from: type=registry,ref=${{ env.DOCKERHUB_USERNAME }}/agent-fleet-migration:buildcache
          cache-to: type=registry,ref=${{ env.DOCKERHUB_USERNAME }}/agent-fleet-migration:buildcache,mode=max

  # Separate job rather than folding into build-push above: these are Go
  # modules (no package.json, no bun install/test) — a go.yml workflow
  # runs the real correctness gate (vet/test/lint/buf) on every push/PR;
  # this job's job is just the Docker packaging step, same division of
  # labor and same PR-safe tag computation as build-push-e2e-runner.
  build-push-go:
    needs: changes
    # On push (release), always the full set — go-components is only
    # computed on pull_request (see the changes job's own `if`), so
    # fall back to the complete list explicitly here rather than reading
    # an output that job never produced.
    if: always() && (github.event_name == 'push' || needs.changes.outputs.go-components != '[]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ github.event_name == 'push' && fromJSON('["core","provisioner","sidecar","executor"]') || fromJSON(needs.changes.outputs.go-components) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get update && sudo apt-get install -y infisical

      - name: Load secrets from Infisical
        run: |
          set -euo pipefail
          while IFS='=' read -r key raw_value; do
            [ -z "$key" ] && continue
            value="${raw_value%\'}"
            value="${value#\'}"
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done < <(infisical export --domain=https://infisical.bnei.dev/api --token="${{ secrets.INFISICAL_TOKEN }}" --projectId="$INFISICAL_PROJECT_ID" --env=dev --format=dotenv | grep -E '^DOCKERHUB_')

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # No package.json here to read a version from — same PR-safe
      # tag-computation pattern as build-push-e2e-runner.
      - name: Compute image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name == 'push' }}
          load: true
          # Repo-root context: each Dockerfile COPYs go.work + proto/gen/go
          # as siblings alongside its own module directory.
          context: .
          file: ${{ matrix.component }}/Dockerfile
          tags: >-
            ${{ env.DOCKERHUB_USERNAME }}/agent-fleet-${{ matrix.component }}:${{ steps.tag.outputs.value }},
            ${{ env.DOCKERHUB_USERNAME }}/agent-fleet-${{ matrix.component }}:latest
          cache-from: type=registry,ref=${{ env.DOCKERHUB_USERNAME }}/agent-fleet-${{ matrix.component }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKERHUB_USERNAME }}/agent-fleet-${{ matrix.component }}:buildcache,mode=max

  deploy:
    needs: [build-push, build-push-go, build-push-migration]
    # always() + an explicit needs.*.result check, not just
    # `if: github.event_name == 'push'` — confirmed live on the v1.1.0
    # release run: build-push and build-push-go both genuinely succeeded
    # (images for 1.1.0 exist on Docker Hub), but deploy was still skipped
    # with zero steps run. A job's implicit default condition is
    # success()-on-needs, and something in this matrix + upstream-skipped-
    # job (changes, gated to pull_request only) graph shape was tripping
    # that default even though the direct needs were all green. always()
    # bypasses the implicit check entirely, so the explicit result
    # comparisons below are what actually guards against deploying a tag
    # whose build genuinely failed. build-push-migration is included since
    # k8s/core.yaml's hooks.migrate.image.tag gets bumped below just like
    # image.tag — the migration image must already be pushed under that
    # tag by the time this runs (docs/adr/0030).
    if: >-
      always() && github.event_name == 'push' &&
      needs.build-push.result == 'success' &&
      needs.build-push-go.result == 'success' &&
      needs.build-push-migration.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bump pinned image tags
        run: |
          # Helm-values shape (k8s/core.yaml): image.tag / hooks.migrate.image.tag.
          # Blanket `tag: "..."` replace is safe here — every occurrence in
          # this file shape is genuinely an image tag, nothing else uses it.
          sed -i -E "s/^(\s*tag: \")[^\"]+(\")/\1${GITHUB_REF_NAME}\2/" k8s/*.yaml

          # Plain-manifest shape (k8s/provisioner/deployment.yaml): image
          # refs embed repo:tag as one combined string — only bump this
          # repo's own built images (core/provisioner/worker/sidecar),
          # never e2e-runner's deliberately floating :latest.
          sed -i -E "s#(mohammaddocker/agent-fleet-(core|provisioner|worker|sidecar)):[^[:space:]\"]+#\1:${GITHUB_REF_NAME}#g" k8s/provisioner/*.yaml

      # Pushing with the default GITHUB_TOKEN (via actions/checkout's
      # auto-configured credential) deliberately does NOT trigger other
      # workflow runs — this commit won't re-enter release.yml's push-to-main
      # trigger, avoiding the release-it self-triggering loop hit earlier.
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "agent-fleet-ci"
          git config user.email "noreply@bnei.dev"
          git add k8s/
          if git diff --cached --quiet; then
            echo "no tag changes to commit"
            exit 0
          fi
          git commit -m "chore(deploy): bump image tag to ${GITHUB_REF_NAME}"
          git push origin HEAD:main
