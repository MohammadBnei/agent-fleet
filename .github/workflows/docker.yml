name: Build, Test and Deploy

# Tests, then the shared ukubi-ci workflows (v0.11.1, Forgejo Actions):
#
#  - release.yml cuts the version from Conventional Commits and pushes an
#    annotated tag on the tested commit. Nothing is committed to main (no
#    package.json bump, no CHANGELOG edit; CHANGELOG.md stays as history).
#  - image.yml builds every image (core, migration, executor, provisioner,
#    worker, sidecar) on every release, on the build-runner LXC
#    (`ukubi-build`, buildah), pushes <sha12> tags to Zot, and for core and
#    migration commits the pin to a file of its own on the `deploy` branch:
#    k8s/image-core.yaml (.image.tag) and k8s/image-migration.yaml
#    (.hooks.migrate.image.tag). ArgoCD has to layer both over k8s/core.yaml
#    (infra-bootstrap's agent-fleet-core registry entry) before they deploy.
#    executor has no pin: catalog.go floats on its `latest`, pushed here.
#  - provisioner, worker and sidecar pin to k8s/image-<name>.yaml on the same
#    deploy branch (.images.<name>). k8s/provisioner/ stays plain manifests
#    that a standalone Application syncs from main; its Chart.yaml is only a
#    wrapper that swaps those pins into the manifests' image refs, so
#    infra-bootstrap's platform-provisioner Application can layer them as
#    Helm valueFiles from a `deploy` ref, as it does for core. Until it does,
#    the refs in k8s/provisioner/*.yaml deploy, and Zot keeps 3 tags per
#    repo: three releases evict those src-<hash> refs.
#
# No job here runs on a pull_request, so a PR never reaches ukubi-build (the
# CI/CD split): PRs run the tests in checks.yml on the podman runner, and
# main re-runs them (checks, below) before the release and the images.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # `paths` with negations rather than paths-ignore, because the last match
    # wins: definitions/ and packs/ are mostly .md, and a merge touching only
    # them must still cut a release.
    paths:
      - '**'
      - '!**.md'
      - '!k8s/*'
      - '!package.json'
      - 'definitions/**'
      - 'packs/**'
    tags-ignore:
      - '*'

# Read-only by default; the test jobs run PR code. Guarded by
# core/internal/buildguard (TestWorkflowsWriteOnlyInReleaseJobs).
permissions:
  contents: read

# Forgejo honours only the workflow-level group. Main runs queue and are never
# cancelled once a tag may be pushed.
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tests live in checks.yml, which also runs on every PR. No if: on a uses: job: Forgejo evaluates it inside
  # the called workflow, where event_name is workflow_call.
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  # A tag on main.
  release:
    needs: checks
    permissions:
      contents: write # release.yml pushes the release tag
    uses: MohammadBnei/ukubi-ci/.github/workflows/release.yml@9af316b5d779b2d5ef3f55b9f11e20b8bf3f6ce8 # v0.11.1

  # Repo-root context for every image: each Dockerfile COPYs go.work,
  # proto/gen/go or db/migrations as siblings of its own directory.
  core:
    needs: release
    uses: MohammadBnei/ukubi-ci/.github/workflows/image.yml@9af316b5d779b2d5ef3f55b9f11e20b8bf3f6ce8 # v0.11.1
    with:
      runs-on: '["ukubi-build"]'
      image: agent-fleet-core
      ref: ${{ needs.release.outputs.tag }}
      dockerfile: core/Dockerfile
      values-file: k8s/image-core.yaml
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write

  migration:
    needs: release
    uses: MohammadBnei/ukubi-ci/.github/workflows/image.yml@9af316b5d779b2d5ef3f55b9f11e20b8bf3f6ce8 # v0.11.1
    with:
      runs-on: '["ukubi-build"]'
      image: agent-fleet-migration
      ref: ${{ needs.release.outputs.tag }}
      dockerfile: migration/Dockerfile
      values-file: k8s/image-migration.yaml
      values-key: .hooks.migrate.image.tag
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write

  executor:
    needs: release
    uses: MohammadBnei/ukubi-ci/.github/workflows/image.yml@9af316b5d779b2d5ef3f55b9f11e20b8bf3f6ce8 # v0.11.1
    with:
      runs-on: '["ukubi-build"]'
      image: agent-fleet-executor
      ref: ${{ needs.release.outputs.tag }}
      dockerfile: executor/Dockerfile
      deploy: false
      extra-tags: latest
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write

  provisioner:
    needs: release
    uses: MohammadBnei/ukubi-ci/.github/workflows/image.yml@9af316b5d779b2d5ef3f55b9f11e20b8bf3f6ce8 # v0.11.1
    with:
      runs-on: '["ukubi-build"]'
      image: agent-fleet-provisioner
      ref: ${{ needs.release.outputs.tag }}
      dockerfile: provisioner/Dockerfile
      values-file: k8s/image-provisioner.yaml
      values-key: .images.provisioner
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write

  worker:
    needs: release
    uses: MohammadBnei/ukubi-ci/.github/workflows/image.yml@9af316b5d779b2d5ef3f55b9f11e20b8bf3f6ce8 # v0.11.1
    with:
      runs-on: '["ukubi-build"]'
      image: agent-fleet-worker
      ref: ${{ needs.release.outputs.tag }}
      dockerfile: worker/Dockerfile
      values-file: k8s/image-worker.yaml
      values-key: .images.worker
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write

  sidecar:
    needs: release
    uses: MohammadBnei/ukubi-ci/.github/workflows/image.yml@9af316b5d779b2d5ef3f55b9f11e20b8bf3f6ce8 # v0.11.1
    with:
      runs-on: '["ukubi-build"]'
      image: agent-fleet-sidecar
      ref: ${{ needs.release.outputs.tag }}
      dockerfile: sidecar/Dockerfile
      values-file: k8s/image-sidecar.yaml
      values-key: .images.sidecar
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
