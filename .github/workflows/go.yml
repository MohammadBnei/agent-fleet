name: Go and Proto

# Correctness gate for the Go side of the fleet (core, provisioner, sidecar)
# and the buf-managed proto schema they + worker's ts-proto codegen share —
# see docs/adr/0013, 0019, 0020. Kept separate from docker.yml: this checks
# code quality/correctness, docker.yml handles image packaging/push/deploy
# (same division dream-analyst's/this repo's existing workflows already
# draw between "tests" and "build+push").

on:
  pull_request:
  push:
    branches: [main]

env:
  BUF_VERSION: '1.72.0'
  PROTOC_GEN_GO_VERSION: 'v1.36.11'
  PROTOC_GEN_GO_GRPC_VERSION: 'v1.6.2'
  PROTOC_GEN_CONNECT_GO_VERSION: 'v1.20.0'

jobs:
  # Precise CI: only run a module's vet/lint/test against what actually
  # changed. proto/ changes count as a change for every consumer (Go
  # codegen + worker's ts-proto codegen both come from it). This job never
  # gates a push/deploy step (go.yml only checks correctness, doesn't
  # build/push images), so it's safe to apply on every trigger, unlike
  # docker.yml's equivalent (see that file's comment on why its filtering
  # is pull_request-only).
  changes:
    runs-on: ubuntu-latest
    # Setting ANY permissions here resets every other permission to `none`
    # for this job's GITHUB_TOKEN (not just the ones listed) — contents:
    # read must be explicit or actions/checkout's own clone fails.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      proto: ${{ steps.filter.outputs.proto }}
      go-modules: ${{ steps.modules.outputs.result }}
    steps:
      # fetch-depth: 0 (not the default shallow 1) — this job also runs on
      # push-to-main, where paths-filter needs to diff against the
      # previous commit; the default single-commit checkout wouldn't have
      # it. pull_request events don't need this (paths-filter uses the API
      # there) but it's harmless either way.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            proto:
              - 'proto/**'
            core:
              - 'core/**'
            provisioner:
              - 'provisioner/**'
            sidecar:
              - 'sidecar/**'
            executor:
              - 'executor/**'
      # A proto/ change affects every Go module's generated code, so it
      # counts as a change for all three, on top of each module's own filter.
      - name: Compute go-modules matrix
        id: modules
        uses: actions/github-script@v7
        with:
          script: |
            const proto = ${{ steps.filter.outputs.proto }};
            // Not named `core` — actions/github-script already injects its
            // own `core` (the @actions/core toolkit) into this scope;
            // shadowing it threw "Identifier 'core' has already been
            // declared" the first time this ran.
            const coreChanged = ${{ steps.filter.outputs.core }};
            const provisioner = ${{ steps.filter.outputs.provisioner }};
            const sidecar = ${{ steps.filter.outputs.sidecar }};
            const executor = ${{ steps.filter.outputs.executor }};
            const modules = [];
            if (proto || coreChanged) modules.push('core');
            if (proto || provisioner) modules.push('provisioner');
            if (proto || sidecar) modules.push('sidecar');
            if (proto || executor) modules.push('executor');
            return modules;

  buf:
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}

      - name: buf lint
        working-directory: proto
        run: buf lint

      # actions/checkout only creates a remote-tracking ref
      # (origin/main), never a local branch literally named "main" — buf's
      # git input needs `ref=`, not `branch=`, to resolve that. Skipped
      # gracefully on the PR that first introduces proto/ at all, since
      # there's genuinely nothing on main yet to compare against.
      - name: buf breaking (against main)
        if: github.event_name == 'pull_request'
        working-directory: proto
        run: |
          if git cat-file -e origin/main:proto 2>/dev/null; then
            buf breaking --against '../.git#ref=origin/main,subdir=proto'
          else
            echo "no proto/ on origin/main yet — nothing to break against"
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      # setup-go's own module/build cache (keyed on go.sum, enabled by
      # default) doesn't cover `go install`'d binaries under $GOBIN — cache
      # those separately, keyed on the pinned plugin versions above, so a
      # version bump invalidates the cache instead of silently reusing a
      # stale binary.
      - name: Cache protoc-gen-go / protoc-gen-go-grpc / protoc-gen-connect-go binaries
        id: protoc-gen-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: protoc-gen-${{ runner.os }}-${{ env.PROTOC_GEN_GO_VERSION }}-${{ env.PROTOC_GEN_GO_GRPC_VERSION }}-${{ env.PROTOC_GEN_CONNECT_GO_VERSION }}

      - name: Install protoc-gen-go / protoc-gen-go-grpc / protoc-gen-connect-go
        if: steps.protoc-gen-cache.outputs.cache-hit != 'true'
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@${{ env.PROTOC_GEN_GO_VERSION }}
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@${{ env.PROTOC_GEN_GO_GRPC_VERSION }}
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@${{ env.PROTOC_GEN_CONNECT_GO_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install ts-proto (worker's local TS plugin)
        working-directory: worker
        run: bun install --frozen-lockfile

      # protoc-gen-es (dashboard's local TS plugin, Connect-ES v2 — see
      # docs/adr/0015: no separate protoc-gen-connect-es needed, protoc-gen-es
      # alone generates both messages and service descriptors) — version
      # pinned via dashboard/package.json/bun.lock, no separate env var
      # needed, same convention as ts-proto above.
      - name: Install protoc-gen-es (dashboard's local TS plugin)
        working-directory: dashboard
        run: bun install --frozen-lockfile

      # thot/ is a third ts_proto target (docs/adr/0035) — buf.gen.yaml
      # resolves its plugin from thot/node_modules, so this install is as
      # load-bearing as worker's and dashboard's above. Missing it fails
      # `buf generate` with "no such file or directory", not a lint error.
      - name: Install ts-proto (thot's local TS plugin)
        working-directory: thot
        run: bun install --frozen-lockfile

      - name: buf generate
        working-directory: proto
        run: |
          export PATH="$HOME/go/bin:$PATH"
          buf generate

      - name: Check for drift and auto-commit
        run: |
          if ! git diff --quiet -- proto/gen worker/src/gen dashboard/src/gen; then
            echo "Generated files are out of sync with proto definitions"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Auto-committing regenerated proto files"
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add proto/gen worker/src/gen dashboard/src/gen
              git commit -m "chore: regenerate proto files after schema changes"
              git push
            else
              echo "Not a PR - failing the check"
              exit 1
            fi
          else
            echo "Generated files are up to date"
          fi

  go:
    needs: changes
    if: needs.changes.outputs.go-modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.go-modules) }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentfleet
          POSTGRES_PASSWORD: agentfleet
          POSTGRES_DB: agentfleetdb
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: ${{ matrix.module }}
          # Pinned, not `latest` — go.mod declares go 1.26.5 (this repo's
          # local toolchain), and golangci-lint refuses to analyze a
          # module targeting a newer Go than it was itself built with.
          # v2.9.0+ is the first line built with go1.26; v2.12.2 matches
          # what's verified working locally (`golangci-lint version`).
          # golangci-lint-action v7+ is required for golangci-lint v2.x
          # (v6 only supports v1.x).
          version: v2.12.2

      - name: go test
        working-directory: ${{ matrix.module }}
        run: go test ./... -race -cover

      - name: go test (integration, real Postgres)
        working-directory: ${{ matrix.module }}
        env:
          AGENTFLEET_DB_HOST: localhost
          AGENTFLEET_DB_PORT: '5432'
          AGENTFLEET_DB_NAME: agentfleetdb
          AGENTFLEET_DB_USER: agentfleet
          AGENTFLEET_DB_PASSWORD: agentfleet
        run: go test -tags=integration ./...
