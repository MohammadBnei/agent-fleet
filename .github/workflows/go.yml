name: Go and Proto

# Correctness gate for the Go side of the fleet (core, provisioner, sidecar)
# and the buf-managed proto schema they share —
# see docs/adr/0013, 0019, 0020. Kept separate from docker.yml: this checks
# code quality/correctness, docker.yml handles image packaging/push/deploy
# (same division dream-analyst's/this repo's existing workflows already
# draw between "tests" and "build+push").

# A pull request runs the fast gate here (only the modules its diff touches, a
# warm cache). A push to main runs the FULL gate, called from docker.yml: every
# module, a cold cache, full -race and the integration tests. docker.yml's
# release needs it, so nothing is tagged, built or pinned before it passes.
# There is no push trigger of its own: that would run the gate twice on main.
on:
  workflow_call:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# A newer PR push cancels the older run; docker.yml's call on main never
# cancels. Read from the PR payload, not event_name, which Forgejo reports as
# workflow_call inside a called workflow.
concurrency:
  group: go-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.pull_request && true || false }}

# Read-only by default. Every job here runs code from the PR (tests, bun
# install scripts, buf plugins), and a PR may be an agent's: a write token in
# a PR job can push to any branch, main included. A job that genuinely needs
# more asks for it explicitly — none does today.
permissions:
  contents: read

env:
  BUF_VERSION: '1.72.0'
  PROTOC_GEN_GO_VERSION: 'v1.36.12'
  PROTOC_GEN_GO_GRPC_VERSION: 'v1.6.2'
  PROTOC_GEN_CONNECT_GO_VERSION: 'v1.21.0'

jobs:
  # Fast gate on a pull request, full gate on main. A pull request runs only the
  # modules its diff touches (base..HEAD); a proto/ change counts for every Go
  # module. Anything else (a push to main, a dispatch) runs every module and buf.
  # Plain git rather than paths-filter + github-script, which talk to
  # GitHub's API.
  changes:
    runs-on: k8s-ubuntu-latest
    outputs:
      proto: ${{ steps.modules.outputs.proto }}
      go-modules: ${{ steps.modules.outputs.result }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Compute go-modules matrix
        id: modules
        env:
          REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The ref decides, in shell (an if: mixing ! and && mis-evaluates in a
          # called workflow): only a pull request is filtered. The cat-file check
          # is the fallback should a pull request's base be unknown.
          if [[ "$REF" != refs/pull/* ]] || [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo 'proto=true' >> "$GITHUB_OUTPUT"
            echo 'result=["core","provisioner","sidecar","executor"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          hit() { grep -qE "$1" <<<"$files"; }
          proto=false; hit '^proto/' && proto=true
          # go.work (toolchain/workspace bump) and this workflow change every
          # module's build, so they select all four without enabling buf.
          all=false; hit '^(go\.work|go\.work\.sum|\.github/workflows/go\.yml|\.github/scripts/go-test\.sh)$' && all=true
          echo "proto=$proto" >> "$GITHUB_OUTPUT"
          # core: dbtest.NewPool applies db/migrations/ (docs/adr/0030);
          # definitions/ is validated by core's repo_test.go (docs/adr/0062);
          # core/internal/buildguard reads every Dockerfile and workflow and
          # every module's logguard copy.
          # provisioner: its k8s tests read k8s/core.yaml and k8s/provisioner/.
          m=()
          { $proto || $all || hit '^(core/|db/migrations/|definitions/|[^/]+/Dockerfile$|\.github/workflows/|[^/]+/internal/logguard/)'; } && m+=('"core"')
          { $proto || $all || hit '^(provisioner/|k8s/)'; } && m+=('"provisioner"')
          { $proto || $all || hit '^sidecar/'; } && m+=('"sidecar"')
          { $proto || $all || hit '^executor/'; } && m+=('"executor"')
          echo "result=[$(IFS=,; echo "${m[*]}")]" >> "$GITHUB_OUTPUT"

  buf:
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: k8s-ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The PR's merge commit (checkout's default), not its branch tip:
          # breaking and drift are judged on what would land, and a fork's
          # head_ref names no branch here. fetch-depth 0 for origin/main.
          fetch-depth: 0

      # A pinned release, checked by sha256 (BUF_VERSION and this sha move
      # together, from the release's sha256.txt). Not buf-setup-action: it
      # looks the release up through GitHub's API, unauthenticated from
      # Forgejo, and the runners' shared address hits the rate limit.
      - name: Install buf
        env:
          SHA: 8720830e26a733da55bb89bcd3cb44849c0965fc0c44fb5d691cccdc64dca5af
        run: |
          set -euo pipefail
          curl -sSfLo "$RUNNER_TEMP/buf" "https://github.com/bufbuild/buf/releases/download/v$BUF_VERSION/buf-Linux-x86_64"
          echo "$SHA  $RUNNER_TEMP/buf" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/buf"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: buf lint
        working-directory: proto
        run: buf lint

      # actions/checkout only creates a remote-tracking ref
      # (origin/main), never a local branch literally named "main" — buf's
      # git input needs `ref=`, not `branch=`, to resolve that. Skipped
      # gracefully on the PR that first introduces proto/ at all, since
      # there's genuinely nothing on main yet to compare against.
      # Only a pull request has something to break against: on main the head is main.
      - name: buf breaking (against main)
        if: startsWith(github.ref, 'refs/pull/')
        working-directory: proto
        run: |
          # A deliberate removal opts out by saying so in a commit message,
          # rather than by weakening the check for everyone. `BREAKING CHANGE:`
          # is not a new convention invented here — docker.yml's release-it already reads
          # it (conventional-commits) to drive the version bump, so the same
          # footer that makes this pass also shows up in the changelog and the
          # release. No blanket `|| true`, and the skip is visible in the log.
          if git log --format='%B' origin/main..HEAD | grep -q '^BREAKING CHANGE:'; then
            echo "::notice::skipping buf breaking — a commit declares BREAKING CHANGE:"
            git log --format='%s' origin/main..HEAD | sed 's/^/  /'
            exit 0
          fi
          if git cat-file -e origin/main:proto 2>/dev/null; then
            buf breaking --against '../.git#ref=origin/main,subdir=proto'
          else
            echo "no proto/ on origin/main yet — nothing to break against"
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          # Own cache key per consumer: a shared key is saved by whichever job
          # finishes first and every other job restores that partial cache.
          cache: false

      # setup-go's own cache doesn't cover `go install`'d binaries under $GOBIN.
      # Same model as the go job: a pull request restores and saves; main never
      # restores (it would run binaries a PR could have planted), it runs cold
      # and only saves. Keyed on the pinned plugin versions.
      - name: Cache keys
        id: cachekeys
        env:
          REF: ${{ github.ref }}
          EPOCH: ${{ vars.CACHE_EPOCH || 'e1' }}
        run: |
          set -euo pipefail
          pr=false
          if [[ "$REF" == refs/pull/* ]]; then pr=true; fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "key=${EPOCH}-protoc-gen-${RUNNER_OS}-${PROTOC_GEN_GO_VERSION}-${PROTOC_GEN_GO_GRPC_VERSION}-${PROTOC_GEN_CONNECT_GO_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Restore protoc-gen binaries
        id: protoc-gen-cache
        if: steps.cachekeys.outputs.pr == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/go/bin
          # Never an exact hit (the run id is new): restore-keys picks the newest
          # entry, whose binaries match the pinned versions in the key.
          key: ${{ steps.cachekeys.outputs.key }}-${{ github.run_id }}
          restore-keys: ${{ steps.cachekeys.outputs.key }}-

      - name: Install protoc-gen-go / protoc-gen-go-grpc / protoc-gen-connect-go
        if: steps.protoc-gen-cache.outputs.cache-matched-key == ''
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@${{ env.PROTOC_GEN_GO_VERSION }}
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@${{ env.PROTOC_GEN_GO_GRPC_VERSION }}
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@${{ env.PROTOC_GEN_CONNECT_GO_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          no-cache: true
          bun-version: 1.4.2

      # An "Install ts-proto (worker's local TS plugin)" step used to sit here.
      # Deleted with worker/src/gen in docs/adr/0048 — the worker never
      # imported the generated types, so this step existed only to regenerate
      # 8,692 lines that CI then auto-committed back onto the PR.

      # protoc-gen-es (dashboard's local TS plugin, Connect-ES v2 — see
      # docs/adr/0015: no separate protoc-gen-connect-es needed, protoc-gen-es
      # alone generates both messages and service descriptors) — version
      # pinned via dashboard/package.json/bun.lock, no separate env var
      # needed, pinned via dashboard/package.json + bun.lock.
      - name: Install protoc-gen-es (dashboard's local TS plugin)
        working-directory: dashboard
        run: bun install --frozen-lockfile

      - name: buf generate
        working-directory: proto
        run: |
          export PATH="$HOME/go/bin:$PATH"
          buf generate

      # Fails, never auto-commits. Committing back needed contents: write on a
      # job that runs the PR's own plugins (bun install, buf generate), which
      # is exactly the token the default-branch ruleset must not hand a PR.
      - name: Check for drift
        run: |
          if ! git diff --quiet -- proto/gen dashboard/src/gen; then
            echo "::error::Generated files are out of sync with proto/. Regenerate and commit:"
            echo "  (cd dashboard && bun install --frozen-lockfile) && (cd proto && buf generate)"
            git diff --stat -- proto/gen dashboard/src/gen
            exit 1
          fi
          echo "Generated files are up to date"

      # Only when nothing was restored: the binaries are pinned by version, so a
      # restored entry needs no refresh. On main nothing restores, so it saves.
      - name: Save protoc-gen binaries
        if: success() && steps.protoc-gen-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/go/bin
          key: ${{ steps.cachekeys.outputs.key }}-${{ github.run_id }}

  go:
    needs: changes
    if: needs.changes.outputs.go-modules != '[]'
    runs-on: k8s-ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.go-modules) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          # No setup-go cache: the split below is explicit (see "Cache keys").
          cache: false

      # Cache model (owner decision 2026-11-22): a pull request restores and
      # saves; push, dispatch and schedule never restore (a PR job can forge
      # the cache write key, so a restored entry is untrusted on main), they
      # run cold and only save. Decided here in shell, not in an if:.
      # CACHE_EPOCH is a user-level Forgejo variable; bump it to purge every cache.
      - name: Cache keys
        id: cachekeys
        env:
          REF: ${{ github.ref }}
          EPOCH: ${{ vars.CACHE_EPOCH || 'e1' }}
          MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail
          pr=false
          if [[ "$REF" == refs/pull/* ]]; then pr=true; fi
          # The module's go.sum plus the workspace's two shared sums.
          h=$(cat "$MODULE/go.sum" go.work.sum proto/gen/go/go.sum 2>/dev/null | sha256sum | cut -c1-16)
          {
            echo "pr=$pr"
            echo "key=${EPOCH}-go-${MODULE}-${RUNNER_OS}-${h}"
            echo "prefix=${EPOCH}-go-${MODULE}-${RUNNER_OS}-"
            echo "mod=$(go env GOMODCACHE)"
            echo "build=$(go env GOCACHE)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore Go cache
        id: restore
        if: steps.cachekeys.outputs.pr == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.cachekeys.outputs.mod }}
            ${{ steps.cachekeys.outputs.build }}
          # Never an exact hit (the run id is new): restore-keys picks the newest
          # entry for this lockfile, else the newest for this module.
          key: ${{ steps.cachekeys.outputs.key }}-${{ github.run_id }}
          restore-keys: |
            ${{ steps.cachekeys.outputs.key }}-
            ${{ steps.cachekeys.outputs.prefix }}

      # provisioner/internal/git's SyncFleetShared shells out to rsync. The Talos
      # runner pod has no root and no apt, so the image has to carry it
      # (ukubi-ci runner-image); fail with that said, not on a missing binary.
      - name: Check rsync
        if: matrix.module == 'provisioner'
        run: |
          command -v rsync >/dev/null || { echo "::error::rsync is not in the runner image; ukubi-ci runner-image must bake it, this runner has no root and no apt"; exit 1; }

      # The Talos runner has no services: and no Docker socket, so the database
      # tests use a disposable database from the dev IntegreSQL (infra-bootstrap
      # ADR-0088) through ukubi-ci's dev-db action, with DATABASE_URL exported.
      # No seed command: dbtest applies db/migrations/ into a schema per test
      # (AGENTFLEET_TEST_DSN), and the template is keyed on those files. Only
      # core has database tests.
      # ukubi-ci is pinned to the head of its open PR (feat/talos-pr-jobs);
      # re-pin to the release sha once it is tagged.
      - name: Dev database (IntegreSQL)
        if: matrix.module == 'core'
        uses: MohammadBnei/ukubi-ci/actions/dev-db@d683f2091575188024f7e1200e619977d9db19ae
        with:
          integresql-url: http://integresql.dev-services.svc.cluster.local:5000
          postgres-host: dev-postgres.dev-services.svc.cluster.local
          hash-paths: db/migrations

      # go vet is not a separate step: golangci-lint's default linters (no
      # config file in this repo) include govet.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: ${{ matrix.module }}
          # Pinned, not `latest` — go.mod declares go 1.27.1 (this repo's
          # local toolchain), and golangci-lint refuses to analyze a
          # module targeting a newer Go than it was itself built with.
          # v2.14.0 is built with go1.27.1 and matches what's verified
          # working locally (`golangci-lint version`).
          # golangci-lint-action v7+ is required for golangci-lint v2.x
          # (v6 only supports v1.x).
          version: v2.14.0
          # The action's own cache would restore on main; the explicit model above is the only cache.
          skip-cache: true

      # Go's per-package test-result cache is on (no blanket -count=1): a PR job
      # restores the build cache above, so a package whose inputs did not change
      # is not run again. The packages the cache cannot judge (a test reading
      # files outside its module, such as core/internal/buildguard, or the
      # integration tests' database) run with -count=1 in a second invocation
      # with the same flags, so the compiled binaries are shared. The list is
      # computed by .github/scripts/go-test.sh. A main push restores nothing,
      # so it runs everything anyway.
      #
      # One compile per module: the integration tag is on the race run, not a
      # second non-race `go test`. Every non-integration test passes with the
      # integration env set: the variables are read only by integration-tagged
      # files (dbtest, credentials_integration_test) and by config's loader, and
      # no non-integration test depends on their absence.
      - name: go test (race, integration, real Postgres)
        working-directory: ${{ matrix.module }}
        env:
          # dbtest.NewPool's external-database path (a schema per test); empty
          # for the modules that have no database tests.
          AGENTFLEET_TEST_DSN: ${{ env.DATABASE_URL }}
          # mintPostgres needs a superuser named postgres, which the dev Postgres
          # does not hand out (integresql is NOSUPERUSER). Those tests skip here
          # and run in the provisioner-mint job on main.
          AGENTFLEET_TEST_NO_ADMIN_PG: '1'
        run: bash "$GITHUB_WORKSPACE/.github/scripts/go-test.sh"

      - name: Release the dev database
        if: always() && matrix.module == 'core'
        uses: MohammadBnei/ukubi-ci/actions/dev-db-release@d683f2091575188024f7e1200e619977d9db19ae

      # Last, so it holds what lint and the tests built. Saved under this run's
      # id on every green run, so the newest run's cache is the one the next PR
      # restores and the caches refresh instead of freezing at the first run.
      - name: Save Go cache
        if: success()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.cachekeys.outputs.mod }}
            ${{ steps.cachekeys.outputs.build }}
          key: ${{ steps.cachekeys.outputs.key }}-${{ github.run_id }}

  # The provisioner's mintPostgres tests need a superuser named postgres
  # (credentials_integration_test.go). The dev Postgres has none (IntegreSQL's
  # roles are NOSUPERUSER) and the Talos runner has no services:, so they skip
  # in the go job and run here instead, on CT 103's podman runner with a
  # Postgres service of their own. Main only: no pull-request job runs on CT 103.
  # (A branch cannot be checked by `if:` on event_name here, which is
  # workflow_call inside a called workflow; github.ref says it.)
  provisioner-mint:
    needs: changes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres-admin:
        image: postgres:18.7-alpine
        env:
          POSTGRES_PASSWORD: admin-test-password
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: false

      # -count=1: the tests depend on a live server Go cannot track.
      - name: go test (mintPostgres, real superuser)
        working-directory: provisioner
        env:
          AGENTFLEET_TEST_ADMIN_PG_HOST: postgres-admin
        run: go test ./internal/k8s -run 'TestMintPostgres' -race -tags=integration -count=1

  # Unfiltered on purpose: the drift it catches (an ADR index row that
  # disagrees with its file, a skill citing a path that was renamed, a
  # workflow handing GITHUB_TOKEN a write scope) comes as often from a
  # code-only PR as from a docs-only one. One package, no Postgres, seconds.
  docs-check:
    runs-on: k8s-ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          # Own cache key per consumer: a shared key is saved by whichever job
          # finishes first and every other job restores that partial cache.
          cache: false

      - name: go test (docs + workflow guards)
        working-directory: core
        run: go test ./internal/buildguard -run 'TestDocs|TestWorkflows' -count=1

      # core's config vs. what is written about it and what the manifests set.
      # Also unfiltered: k8s/core.yaml and docs/ARCHITECTURE.md are outside the
      # `core` filter (k8s/** goes to the provisioner's), and a bad literal merged
      # as a gitops edit would otherwise reach core on its sync: a refusal for the
      # required keys, a silent fall-back to the default plus a WARN for the rest.
      # TestManifestsLoad fails on either, so a manifest-only PR cannot merge it.
      - name: go test (config doc + manifests)
        working-directory: core
        run: go test ./internal/config -run 'TestConfigDocumented|TestManifestsLoad' -count=1
