name: Biome

# Lint + format check for every JS/TS package (dashboard/, islands/, worker/),
# one root config (biome.jsonc), one pinned Biome in the root package.json.
#
# Its own workflow, not a job in docker.yml: a lint check must not wait on
# the build box. Unfiltered: it takes seconds.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  biome:
    runs-on: k8s-ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          no-cache: true
          bun-version: 1.4.2
      # The root install is Biome only; no package's own
      # node_modules is needed to lint it.
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: biome ci
        run: bun run lint
