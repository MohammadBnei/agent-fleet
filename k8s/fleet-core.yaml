# fleet-core — Discord ingress + planning-transcript coordination +
# log/introspection queries, folded into one Go binary (see docs/adr/0013,
# which supersedes docs/adr/0001's Redis-list design and replaces this
# repo's former agent-fleet-bot.yaml + the mcp-redis/ package). Deployed via
# infra-bootstrap's common-app-chart as a two-source Application (chart from
# infra-bootstrap, these values from this repo) — see this repo's own
# README.md and infra-bootstrap's gitops/README.md.
#
# Needs zero cluster RBAC (same invariant e2e-provisioner's ADR-0012
# established for the worker pods) — common-app-chart is sufficient here,
# unlike e2e-provisioner, which stays a standalone plain-manifest
# Application in infra-bootstrap specifically because it DOES need RBAC.

image:
  repository: mohammaddocker/agent-fleet-fleet-core
  # Pinned, bumped automatically by .github/workflows/docker.yml's deploy
  # job on every release tag.
  tag: "1.0.1"

service:
  port: 8080 # now genuinely serves the MCP HTTP endpoint (worker's send_message/wait_for_messages) + /healthz

env:
  - name: FLEET_CORE_PORT
    value: "8080"
  - name: LOKI_URL
    value: "http://loki.monitoring.svc.cluster.local:3100"
  - name: E2E_PROVISIONER_GRPC_ADDR
    value: "e2e-provisioner.agent-fleet.svc.cluster.local:9090"

podLabels:
  app.kubernetes.io/part-of: agent-fleet

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

# Owns the shared fleet-wide PVC's lifecycle (RWX Longhorn) — moved here
# from the deleted agent-fleet-bot.yaml, same claim, same mount. Holds:
# common skills/helper scripts, the append-only knowledge journal mirror,
# and shared MCP configs, at /mnt/fleet-shared.
extraManifests:
  - |
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: agent-fleet-shared-pvc
      namespace: {{ .Release.Namespace }}
    spec:
      accessModes: ["ReadWriteMany"]
      resources:
        requests:
          storage: 5Gi

extraVolumes:
  - name: fleet-shared
    persistentVolumeClaim:
      claimName: agent-fleet-shared-pvc

extraVolumeMounts:
  - name: fleet-shared
    mountPath: /mnt/fleet-shared

# Same Infisical project as the bot/mcp-redis it replaces —
# DISCORD_BOT_TOKEN, DISCORD_TRIGGER_CHANNEL_ID, AGENTFLEET_DB_HOST/PORT/
# NAME/USER/PASSWORD. REDIS_* secrets are no longer read (retire them from
# this project once the cutover is confirmed — see docs/adr/0013).
infisical:
  enabled: true
  projectSlug: "agent-fleet-nygh"
  envSlug: dev

# Applies db/schema.sql (idempotent) via fleet-core's own `migrate`
# subcommand — reuses fleet-core's own image (same ADR-0023 pattern the
# bot used with psql), but drops the runtime psql dependency entirely: the
# schema is go:embed'd into the binary at build time (see
# fleet-core/internal/db/migrate.go).
hooks:
  migrate:
    type: PreSync
    image:
      repository: mohammaddocker/agent-fleet-fleet-core
      tag: "1.0.1"
    command: ["/fleet-core", "migrate"]
