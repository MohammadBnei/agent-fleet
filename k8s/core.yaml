# core (renamed from fleet-core, docs/adr/0019/0020/0021) — Discord
# ingress + planning-transcript coordination + log/introspection queries +
# the web dashboard's ConnectRPC API/static SPA + core's own gRPC server
# (CoreService — its first, see docs/adr/0020) + the dispatch loop that
# claims pending tasks and commands the provisioner to spawn worker pods.
# Deployed via infra-bootstrap's common-app-chart as a two-source
# Application (chart from infra-bootstrap, these values from this repo) —
# see this repo's own README.md and infra-bootstrap's gitops/README.md.
#
# Needs zero cluster RBAC (docs/adr/0020 point 1: core is the fleet's sole
# Postgres-credential holder, and the *only* thing that ever talks to the
# provisioner — hub-and-spoke) — common-app-chart is sufficient here,
# unlike the provisioner, which stays a standalone plain-manifest
# Application (now sourced from this repo's own k8s/provisioner/, not
# infra-bootstrap — see that directory's README) specifically because it
# DOES need RBAC.

image:
  repository: registry.bnei.lan:5000/agent-fleet-core
  # Pinned, bumped automatically by .github/workflows/docker.yml's deploy
  # job on every release tag.
  tag: "4.2.0"

# extraPorts.grpc backs CORE_GRPC_PORT below — sidecar and provisioner both
# dial agent-fleet-core.agent-fleet.svc.cluster.local:9090 for CoreService
# (common-app-chart prefixes the Service name with the release name, so it's
# never bare "core" — a wrong hostname here previously made every
# ReportEvent/SetTaskStatus/AppendJournal call from those two components
# fail with "rpc error: code = Unavailable desc = name resolver error:
# produced zero addresses", confirmed live 2026-08-06).
service:
  port: 8080 # /healthz, the dashboard's ConnectRPC API + static SPA
  extraPorts:
    - name: grpc
      port: 9090

# This app's first public-facing surface (the dashboard) — hostname itself
# is driven by infra-bootstrap's gitops/apps/registry.yaml entry (its
# `hostname:` field is templated into a Helm `parameters` override that
# always wins over a values-file setting of the same key), so it isn't set
# here. middlewares: isn't part of that templated parameter set, so it has
# to live here — reuses the same shared basic-admin-auth Middleware
# already gating pgweb/Alertmanager (see docs/adr/0014).
ingress:
  enabled: true
  middlewares:
    - name: basic-admin-auth
      namespace: default
  # fleet.bnei.dev is deliberately GREY (DNS-only) at Cloudflare, unlike every
  # other *.bnei.dev host, which went proxied on 2026-08-18 (infra-bootstrap
  # ADR-0038). Reason: this host serves ConnectRPC streaming, and Cloudflare's
  # free plan returns HTTP 524 when the origin sends nothing for 100 seconds.
  # A long-lived stream trips that; proxying would break the dashboard.
  #
  # Being grey means requests arrive at Traefik straight from the client, so
  # two of common-app-chart's baseline defaults — which assume Cloudflare is
  # in front — have to be turned off here:
  baseline:
    originLock:
      # The lock allowlists Cloudflare's published ranges as the TCP peer.
      # On a grey host the peer is the real client, so leaving this on would
      # 403 every legitimate request.
      enabled: false
    rateLimit:
      # CF-Connecting-IP is set by Cloudflare and never present on a direct
      # connection, so the chart default would bucket every client under one
      # empty key. Empty restores per-client bucketing off the peer address,
      # which is the true client here (Traefik runs externalTrafficPolicy:
      # Local).
      sourceHeader: ""

env:
  - name: CORE_PORT
    value: "8080"
  - name: CORE_GRPC_PORT
    value: "9090"
  - name: LOKI_URL
    # platform.applicationset.yaml templates every platform release as
    # 'platform-{{.name}}' — the loki Service is platform-loki, not loki.
    value: "http://platform-loki.monitoring.svc.cluster.local:3100"
  - name: PROVISIONER_GRPC_ADDR
    value: "provisioner.agent-fleet.svc.cluster.local:9090"
  # A firing Alertmanager alert becomes a thot task (docs/adr/0037).
  # ALERT_WEBHOOK_TOKEN comes from the Infisical secret; without it the
  # endpoint refuses every request rather than serving it open. Set
  # THOT_DISCORD_CHANNEL_ID here to route alert threads to a dedicated
  # channel — unset, they land in the normal trigger channel.
  - name: MAX_IN_FLIGHT_TASKS
    value: "5"

podLabels:
  app.kubernetes.io/part-of: agent-fleet

# A LimitRange is namespace-wide, not release-scoped: this one governs
# every pod in `agent-fleet`, including the worker/e2e pods the provisioner
# creates directly (it is the `agent-fleet-core-limits` object
# provisioner/internal/k8s/pod.go's resource comments refer to). Overridden
# only to raise `max.cpu` from the chart's default of "2".
#
# The worker pod runs compiles, test suites and dependency installs in its
# own Bash (docs/adr/0048 §6 deleted the e2e sandbox that used to), and its
# limits are pinned at exactly this ceiling. A container limit above max is
# rejected at admission, so the pod would simply never be created — not
# throttled, not pending, absent; raising this is what makes the 4000m/4Gi
# limits in pod.go legal. Change the two together (guarded by
# TestCreateWorkerPod_ResourcesWithinLimitRange).
#
# default/defaultRequest are left at the chart's values: they only apply to
# containers that declare nothing, and every fleet container sets its own.
limitRange:
  enabled: true
  default:
    cpu: 500m
    memory: 512Mi
  defaultRequest:
    cpu: 100m
    memory: 128Mi
  max:
    cpu: "4"
    memory: 4Gi

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

# The old agent-fleet-shared-pvc (/mnt/fleet-shared) is dropped entirely as
# of this redesign — confirmed via a full grep that nothing in the
# rewritten core/provisioner/sidecar/worker code references it anymore.
# Repo clones/worktrees/skills/CLAUDE.md now live on the provisioner-owned
# workspace PVC instead (see k8s/provisioner/pvc.yaml); knowledge_journal
# is a real Postgres table, not a PVC mirror.

# Makes Prometheus scrape core's /metrics (docs/adr/0047).
#
# A ServiceMonitor, NOT `prometheus.io/scrape` pod annotations: the cluster
# runs kube-prometheus-stack — the Prometheus Operator — and infra-bootstrap's
# gitops/platform/values/prometheus/values.yaml declares no
# additionalScrapeConfigs, so there is no kubernetes-pods job for an
# annotation to drive. Annotations here would be inert and would read, wrongly,
# as "scraping is configured". They were the first attempt; they scraped
# nothing.
#
# No `release:` label needed — that same values file sets
# serviceMonitorSelectorNilUsesHelmValues: false, so Prometheus watches
# ServiceMonitors cluster-wide.
#
# The selector must match the labels common-app-chart puts on its Service
# (_helpers.tpl "common-app-chart.selectorLabels" — both keys are the release
# name), and `port: http` is the chart's own name for service.port above.
#
# Templated off .Release rather than hardcoded, matching how zot's own
# extraManifests block writes its ConfigMap: extraManifests is `tpl`-rendered,
# so hardcoding "agent-fleet-core"/"agent-fleet" would silently select nothing
# under any other release name or namespace — which is exactly what a
# scratch-namespace deploy of this same values file does.
extraManifests:
  - |
    apiVersion: monitoring.coreos.com/v1
    kind: ServiceMonitor
    metadata:
      name: {{ .Release.Name }}
      namespace: {{ .Release.Namespace }}
      labels:
        app.kubernetes.io/part-of: agent-fleet
    spec:
      selector:
        matchLabels:
          app.kubernetes.io/name: {{ .Release.Name }}
          app.kubernetes.io/instance: {{ .Release.Name }}
      endpoints:
        - port: http
          path: /metrics
          interval: 30s

# Same Infisical project as before — DISCORD_BOT_TOKEN,
# DISCORD_TRIGGER_CHANNEL_ID, AGENTFLEET_DB_HOST/PORT/NAME/USER/PASSWORD.
infisical:
  enabled: true
  projectSlug: "agent-fleet-nygh"
  envSlug: dev

# Applies db/migrations/ via the dedicated `migration` image — a
# migrate/migrate CLI image with db/migrations/ COPY'd in at build time
# (see migration/Dockerfile, docs/adr/0030). core itself no longer embeds
# or applies any schema. AGENTFLEET_DB_* comes from the same Infisical
# secret the main container gets (common-app-chart's jobContainer helper
# injects it into every hook via envFrom whenever infisical.enabled) — the
# image's entrypoint.sh reads those vars directly and URL-encodes user/
# password with jq before building the postgres:// DSN, so special
# characters in the password can't be misparsed by migrate's URL parser.
hooks:
  migrate:
    type: PreSync
    image:
      repository: registry.bnei.lan:5000/agent-fleet-migration
      tag: "4.2.0"
    args:
      - "up"

# Per-app Grafana dashboard (infra-bootstrap's grafana-ops skill / gitops/
# README.md "common-app-chart" section) — renders a ConfigMap labeled
# grafana_dashboard: "1", picked up dynamically by Grafana's dashboards
# sidecar, no infra-bootstrap changes needed.
#
# Panels 1-7 predate any custom metrics and are all generic
# kube-state-metrics/cAdvisor pod queries or Loki LogQL over the fleet-wide
# JSON/slog logs. The "Fleet metrics" row (panels 8+) queries core's and the
# provisioner's own agentfleet_* series, added in docs/adr/0047 — but note
# that the two SDK panels there are still LogQL: worker pods are single-shot
# Jobs that often live and die between two 30s scrapes, so their telemetry
# stays in logs on purpose, not in Prometheus.
#
# The pod_filter variable drives both metric and log panels via
# the shared `pod` label — Alloy only attaches namespace/pod/container/app/
# job to Loki streams (gitops/platform/values/alloy/values.yaml), no custom
# k8s label reaches Loki, so filtering has to go through pod-name regex
# rather than the agent-fleet.dev/component label.
dashboards:
  enabled: true
  items:
    overview: |
      {
        "title": "Agent Fleet",
        "uid": "agent-fleet-overview",
        "tags": ["agent-fleet"],
        "timezone": "browser",
        "schemaVersion": 39,
        "version": 1,
        "refresh": "30s",
        "time": { "from": "now-6h", "to": "now" },
        "templating": {
          "list": [
            {
              "name": "pod_filter",
              "type": "custom",
              "label": "Component",
              "query": "All : .+,core : agent-fleet-core-.*,provisioner : provisioner-.*,worker : worker-.*",
              "current": { "text": "All", "value": ".+" },
              "options": [
                { "text": "All", "value": ".+", "selected": true },
                { "text": "core", "value": "agent-fleet-core-.*", "selected": false },
                { "text": "provisioner", "value": "provisioner-.*", "selected": false },
                { "text": "worker", "value": "worker-.*", "selected": false }
              ],
              "multi": false,
              "includeAll": false
            }
          ]
        },
        "panels": [
          {
            "id": 1,
            "type": "timeseries",
            "title": "CPU usage by pod",
            "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
            "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
            "targets": [
              { "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"agent-fleet\", container!=\"\", pod=~\"$pod_filter\"}[5m])) by (pod)", "legendFormat": "{{pod}}", "refId": "A" }
            ]
          },
          {
            "id": 2,
            "type": "timeseries",
            "title": "Memory usage by pod",
            "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
            "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
            "targets": [
              { "expr": "sum(container_memory_working_set_bytes{namespace=\"agent-fleet\", container!=\"\", pod=~\"$pod_filter\"}) by (pod)", "legendFormat": "{{pod}}", "refId": "A" }
            ]
          },
          {
            "id": 3,
            "type": "table",
            "title": "Restarts by pod",
            "gridPos": { "h": 6, "w": 8, "x": 0, "y": 8 },
            "targets": [
              { "expr": "sum(kube_pod_container_status_restarts_total{namespace=\"agent-fleet\", pod=~\"$pod_filter\"}) by (pod)", "instant": true, "format": "table", "refId": "A" }
            ]
          },
          {
            "id": 4,
            "type": "stat",
            "title": "Active worker pods",
            "gridPos": { "h": 6, "w": 4, "x": 8, "y": 8 },
            "targets": [
              { "expr": "count(kube_pod_labels{namespace=\"agent-fleet\", label_agent_fleet_dev_component=\"worker\"})", "instant": true, "refId": "A" }
            ]
          },
          {
            "id": 5,
            "type": "stat",
            "title": "Errors in range",
            "gridPos": { "h": 6, "w": 4, "x": 12, "y": 8 },
            "datasource": { "type": "loki", "uid": "ds-loki" },
            "targets": [
              { "expr": "sum(count_over_time({namespace=\"agent-fleet\"} |~ \"$pod_filter\" | json | level=\"ERROR\" [$__range]))", "instant": true, "refId": "A", "datasource": { "type": "loki", "uid": "ds-loki" } }
            ]
          },
          {
            "id": 6,
            "type": "timeseries",
            "title": "Error rate by pod",
            "gridPos": { "h": 6, "w": 8, "x": 16, "y": 8 },
            "datasource": { "type": "loki", "uid": "ds-loki" },
            "targets": [
              { "expr": "sum(rate({namespace=\"agent-fleet\"} |~ \"$pod_filter\" | json | level=\"ERROR\" [5m])) by (pod)", "legendFormat": "{{pod}}", "refId": "A", "datasource": { "type": "loki", "uid": "ds-loki" } }
            ]
          },
          {
            "id": 7,
            "type": "logs",
            "title": "Live logs",
            "gridPos": { "h": 10, "w": 24, "x": 0, "y": 14 },
            "datasource": { "type": "loki", "uid": "ds-loki" },
            "options": { "showTime": true, "sortOrder": "Descending", "wrapLogMessage": false, "enableLogDetails": true },
            "targets": [
              { "expr": "{namespace=\"agent-fleet\"} |~ \"$pod_filter\" | json", "refId": "A", "datasource": { "type": "loki", "uid": "ds-loki" } }
            ]
          },
          {
            "id": 8,
            "type": "row",
            "title": "Fleet metrics",
            "collapsed": false,
            "gridPos": { "h": 1, "w": 24, "x": 0, "y": 24 },
            "panels": []
          },
          {
            "id": 9,
            "type": "timeseries",
            "title": "Task queue by status",
            "description": "core's own view of the tasks table. Nothing else in the cluster can produce this — a pending task has no pod for kube-state-metrics to count, and no log line for Loki to match.",
            "gridPos": { "h": 8, "w": 12, "x": 0, "y": 25 },
            "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
            "targets": [
              { "expr": "sum by (status) (agentfleet_tasks_current)", "legendFormat": "{{status}}", "refId": "A" }
            ]
          },
          {
            "id": 10,
            "type": "timeseries",
            "title": "Dispatch headroom",
            "description": "live == max with pending > 0 is a saturated fleet; pending > 0 with headroom to spare is a stalled dispatcher. Reading either alone can't tell them apart.",
            "gridPos": { "h": 8, "w": 12, "x": 12, "y": 25 },
            "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
            "targets": [
              { "expr": "agentfleet_live_pods", "legendFormat": "live pods", "refId": "A" },
              { "expr": "agentfleet_max_in_flight", "legendFormat": "cap", "refId": "B" },
              { "expr": "sum(agentfleet_tasks_current{status=\"pending\"})", "legendFormat": "pending", "refId": "C" }
            ]
          },
          {
            "id": 11,
            "type": "timeseries",
            "title": "RPC rate",
            "gridPos": { "h": 8, "w": 12, "x": 0, "y": 33 },
            "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
            "targets": [
              { "expr": "sum by (surface) (rate(agentfleet_grpc_requests_total[5m]))", "legendFormat": "core/{{surface}}", "refId": "A" },
              { "expr": "sum(rate(agentfleet_provisioner_grpc_requests_total[5m]))", "legendFormat": "provisioner", "refId": "B" }
            ]
          },
          {
            "id": 12,
            "type": "timeseries",
            "title": "RPC errors by method",
            "description": "Everything except status=ok (ConnectRPC) and OK (gRPC).",
            "gridPos": { "h": 8, "w": 12, "x": 12, "y": 33 },
            "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
            "targets": [
              { "expr": "sum by (method, status) (rate(agentfleet_grpc_requests_total{status!~\"ok|OK\"}[5m]))", "legendFormat": "{{method}} {{status}}", "refId": "A" },
              { "expr": "sum by (method, status) (rate(agentfleet_provisioner_grpc_requests_total{status!=\"OK\"}[5m]))", "legendFormat": "{{method}} {{status}}", "refId": "B" }
            ]
          },
          {
            "id": 13,
            "type": "timeseries",
            "title": "git operation p95",
            "description": "Measured in the provisioner's Manager.run, so it covers clone/fetch/worktree alike. A slow clone is invisible as a pod metric — the pod doesn't exist yet.",
            "gridPos": { "h": 8, "w": 12, "x": 0, "y": 41 },
            "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
            "targets": [
              { "expr": "histogram_quantile(0.95, sum by (le, operation) (rate(agentfleet_provisioner_git_operation_duration_seconds_bucket[5m])))", "legendFormat": "{{operation}}", "refId": "A" }
            ]
          },
          {
            "id": 14,
            "type": "timeseries",
            "title": "SDK cost per session (USD)",
            "description": "LogQL, not PromQL, and deliberately so: worker pods are single-shot Jobs that routinely start and exit between two scrapes, so a Prometheus counter on them would sample a random subset of sessions. session.ts already logs the SDK result payload, and Loki keeps every line regardless of how briefly the pod lived.",
            "gridPos": { "h": 8, "w": 12, "x": 12, "y": 41 },
            "datasource": { "type": "loki", "uid": "ds-loki" },
            "fieldConfig": { "defaults": { "unit": "currencyUSD" }, "overrides": [] },
            "targets": [
              { "expr": "sum by (taskId) (max_over_time({namespace=\"agent-fleet\", container=\"worker\"} | json | msg =~ \".+ result\" | unwrap totalCostUsd [$__interval]))", "legendFormat": "{{taskId}}", "refId": "A", "datasource": { "type": "loki", "uid": "ds-loki" } }
            ]
          },
          {
            "id": 15,
            "type": "timeseries",
            "title": "SDK context size (input tokens)",
            "description": "The number the context budget is judged on — a session climbing monotonically toward the compact threshold shows up here first.",
            "gridPos": { "h": 8, "w": 24, "x": 0, "y": 49 },
            "datasource": { "type": "loki", "uid": "ds-loki" },
            "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
            "targets": [
              { "expr": "sum by (taskId) (max_over_time({namespace=\"agent-fleet\", container=\"worker\"} | json | msg =~ \".+ result\" | unwrap inputTokens [$__interval]))", "legendFormat": "{{taskId}}", "refId": "A", "datasource": { "type": "loki", "uid": "ds-loki" } }
            ]
          }
        ]
      }

# One Loki-based alert (logAlerts.datasourceUid applies to every rule in
# this block, so it can't be mixed with a Prometheus-based condition —
# pod-restart/crash and OOM/high-memory aren't duplicated here because
# kube-prometheus-stack's default rules (defaultRules never disabled in
# infra-bootstrap's gitops/platform/values/prometheus/values.yaml) already
# cover those cluster-wide and route to the same shared Discord receiver).
# This was the first app to use logAlerts, and it found the bug the comment
# here used to predict: common-app-chart wired the threshold expression
# straight onto the range query with no reduce step, so every evaluation
# errored and execErrState turned that error into a Discord alert. Fixed in
# infra-bootstrap (PR #123) — nothing to do here beyond the grouping below.
logAlerts:
  enabled: true
  datasourceUid: ds-loki
  rules:
    - uid: high-error-log-rate
      title: High error-log rate
      # `by (pod, msg)` is what puts the actual error in the Discord message.
      # Grafana cannot include raw log lines in a notification — an alert
      # query has to reduce to numbers — so the only way to see WHAT broke
      # rather than "5 errors happened somewhere" is to promote the log's own
      # fields to group-by labels, which the reduce step then carries into the
      # alert instance. slog's JSON handler puts a constant string in `msg`
      # and the variable parts in attrs, so this stays low-cardinality.
      #
      # Threshold semantics shift with it: 5 occurrences of the SAME message
      # from ONE pod, not 5 errors namespace-wide. Stricter, and a systemic
      # failure hitting many ephemeral worker pods once each now dilutes
      # across series instead of summing. That's the deliberate trade for a
      # message that names the error — revisit the number once there's real
      # volume to look at.
      expr: 'sum by (pod, msg) (count_over_time({namespace="agent-fleet"} | json | level="ERROR" [5m]))'
      threshold: 5
      for: 5m
      severity: warning
