# dream-analyst-worker — persistent Claude Code worker pod scoped to the
# dream-analyst repo (github.com/MohammadBnei/dream-analyst.git, same repo
# already onboarded as its own deployed app in infra-bootstrap's
# gitops/apps/registry.yaml — this is a separate thing: a dev worker that
# opens PRs against it, not that app's runtime deployment).
#
# Polls the shared `tasks` table for repo='dream-analyst', creates a git
# worktree per task, runs a single-session Agent SDK planning phase (see
# docs/adr/0017) gated on Mohammad's explicit approval in Discord, then
# continues the same planner session into implementation and opens a PR.
# No k8s API access needed.
# Always-on for now (replicaCount: 1) — KEDA scale-to-0 deferred, see
# agent-fleet/README.md.

image:
  repository: mohammaddocker/agent-fleet-worker
  # Pinned, bumped automatically by .github/workflows/docker.yml's deploy
  # job on every release tag.
  tag: "1.2.0"

# Originally required to avoid a RollingUpdate deadlock against a dedicated
# RWO Longhorn PVC (new pod can't attach while the old pod still holds it).
# The PVC below is now RWX (see accessMode comment) so that deadlock no
# longer applies, but Recreate is left as-is — still correct, and changing
# deploy strategy wasn't part of the RWX migration this file's history is
# tracking.
strategy:
  type: Recreate

# RollingUpdate deadlocks forever against a dedicated RWO Longhorn PVC: the
# new pod can't attach `data` while the old pod (same PVC, ReadWriteOnce)
# still holds it, and the old pod never terminates because the rollout
# waits for the new one to go Ready first. Recreate avoids the deadlock by
# tearing down the old pod (and releasing the volume) before starting the
# new one — costs a short outage per deploy, worth it for a single-replica
# worker.
strategy:
  type: Recreate

service:
  port: 8080 # unused (no HTTP server), required by the chart schema

podLabels:
  app.kubernetes.io/part-of: agent-fleet

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

env:
  - name: TARGET_REPO
    value: "dream-analyst"
  - name: TARGET_REPO_URL
    value: "https://github.com/MohammadBnei/dream-analyst.git"
  - name: WORKER_NAME
    value: "dream-analyst-worker"
  - name: CLAUDE_CONFIG_DIR
    value: "/workspace/.claude-home" # relocate ~/.claude (session transcripts, credentials cache) onto the same RWX PVC as the git worktrees, so a crash-restarted pod can actually resume a session — see docs/adr/0016

# Own git checkout + per-task worktrees — Longhorn default (replicated),
# never shared with the other worker or the bot as a whole PVC. RWX (not
# RWO) so the e2e-provisioner can also mount this same PVC into an
# ephemeral e2e pod via a per-task subPath (worktrees/<taskId>) — see
# docs/adr/0012. Migrating an existing bound PVC's access mode isn't a live
# in-place op: this requires `kubectl delete pvc dream-analyst-worker -n
# agent-fleet` before ArgoCD recreates it RWX on next sync. Low actual risk
# — git.ts re-clones the repo from scratch if the checkout is missing, and
# worktrees are always per-task and disposable — but it's a real
# delete/recreate, not a quiet reconcile, so do it deliberately.
persistence:
  enabled: true
  size: 10Gi
  mountPath: /workspace
  accessMode: ReadWriteMany

# Shared fleet-wide PVC, owned by agent-fleet-bot's Application — see that
# app's values.yaml comment. Same namespace (agent-fleet) so the claim name
# resolves.
extraVolumes:
  - name: fleet-shared
    persistentVolumeClaim:
      claimName: agent-fleet-shared-pvc

extraVolumeMounts:
  - name: fleet-shared
    mountPath: /mnt/fleet-shared

# Same dedicated Infisical project as agent-fleet-bot (infra-bootstrap
# docs/secrets.md) — CLAUDE_CODE_OAUTH_TOKEN (Claude Code auths via OAuth
# token, not a raw Anthropic API key — minted with `claude setup-token`),
# GH_TOKEN (dedicated bot GitHub account, collaborator on
# dream-analyst/vos-monolith — `gh auth setup-git` wires it into git's
# credential helper for push, and gh CLI reads it directly for
# `gh pr create`), DISCORD_BOT_TOKEN, AGENTFLEET_DB_*, REDIS_MAIN_PASSWORD.
infisical:
  enabled: true
  projectSlug: "agent-fleet-nygh"
  envSlug: dev
