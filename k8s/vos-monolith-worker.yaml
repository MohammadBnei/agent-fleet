# vos-monolith-worker — persistent Claude Code worker pod scoped to the
# vos-monolith repo (github.com/MohammadBnei/vos-monolith.git). Same shape as
# dream-analyst-worker.yaml — see that file's comments for the full design
# rationale.

image:
  repository: mohammaddocker/agent-fleet-worker
  # Pinned, bumped automatically by .github/workflows/docker.yml's deploy
  # job on every release tag.
  tag: "1.2.0"

# Recreate, not RollingUpdate — see dream-analyst-worker.yaml's comment
# (originally an RWO-PVC deadlock avoidance; PVC below is now RWX but
# Recreate is kept as-is, still correct).
strategy:
  type: Recreate

# Recreate, not RollingUpdate — same dedicated RWO PVC deadlock as
# dream-analyst-worker.yaml, see that file's comment.
strategy:
  type: Recreate

service:
  port: 8080 # unused (no HTTP server), required by the chart schema

podLabels:
  app.kubernetes.io/part-of: agent-fleet

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

env:
  - name: TARGET_REPO
    value: "vos-monolith"
  - name: TARGET_REPO_URL
    value: "https://github.com/MohammadBnei/vos-monolith.git"
  - name: WORKER_NAME
    value: "vos-monolith-worker"
  - name: BASE_BRANCH
    value: "dev" # vos-monolith's actual default/dev branch — main only gets prod tag bumps, see infra-bootstrap's gitops/apps/registry.yaml comment
  - name: CLAUDE_CONFIG_DIR
    value: "/workspace/.claude-home" # relocate ~/.claude (session transcripts, credentials cache) onto the same RWX PVC as the git worktrees, so a crash-restarted pod can actually resume a session — see docs/adr/0016

# RWX (not RWO) — see dream-analyst-worker.yaml's comment: lets
# e2e-provisioner mount this same PVC into an ephemeral e2e pod via a
# per-task subPath. Migration is a real delete/recreate, not a quiet
# reconcile — same low-risk reasoning as that file.
persistence:
  enabled: true
  size: 10Gi
  mountPath: /workspace
  accessMode: ReadWriteMany

extraVolumes:
  - name: fleet-shared
    persistentVolumeClaim:
      claimName: agent-fleet-shared-pvc

extraVolumeMounts:
  - name: fleet-shared
    mountPath: /mnt/fleet-shared

infisical:
  enabled: true
  projectSlug: "agent-fleet-nygh"
  envSlug: dev
