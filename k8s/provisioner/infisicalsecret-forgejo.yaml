# FORGE=forgejo (docs/adr/0086 amendment D3): the bot users' tokens,
# FORGEJO_FLEET_READ_TOKEN, FORGEJO_FLEET_WRITE_TOKEN (ukubi-fleet) and
# FORGEJO_REVIEW_TOKEN (ukubi-review), named by provisioner/internal/forgejo.
# Folder /forgejo of the dedicated project fleet-github-app, read by that
# project's identity fleet-github-app-reader (fleet-github-app-universal-auth): agent-fleet-nygh is synced whole into core's env, so
# forge tokens never go there. The root folder (the App key) is synced by
# provisioner-github-app; this one syncs only /forgejo. Mounted as files at
# FORGEJO_SECRETS_DIR on the provisioner only (deployment.yaml).
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: provisioner-forgejo
  namespace: agent-fleet
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: fleet-github-app
        envSlug: dev
        secretsPath: "/forgejo"
      credentialsRef:
        secretName: fleet-github-app-universal-auth
        secretNamespace: infisical
  managedSecretReference:
    secretName: provisioner-forgejo
    secretNamespace: agent-fleet
    creationPolicy: Orphan
