# docs/adr/0065: the provisioner's Agent Vault agent token (AGENT_VAULT_TOKEN,
# written by infra-bootstrap's gitops/scripts/agent-vault-bootstrap.sh) and the
# credential VALUES definitions name by key (CLAUDE_CODE_OAUTH_TOKEN as an
# Infisical reference to the root key, GH_DEV_NOTES, ...). Folder
# /agent-vault only. Core never syncs it: its scope is the root, and
# secretsScope.recursive is unset (false), so sub-folders are not synced.
# Sync configuration, not isolation: the shared universal-auth identity can
# read the folder (accepted, ADR-0065 "Accepted risks").
# Mounted as files (deployment.yaml), not envFrom: rotation without a restart,
# and the values stay out of git's and gh's environment.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: provisioner-agent-vault
  namespace: agent-fleet
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: agent-fleet-nygh
        envSlug: dev
        secretsPath: "/agent-vault"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: provisioner-agent-vault
    secretNamespace: agent-fleet
    creationPolicy: Orphan
