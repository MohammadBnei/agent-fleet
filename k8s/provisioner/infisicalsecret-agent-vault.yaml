# docs/adr/0065: the provisioner's Agent Vault agent token (AGENT_VAULT_TOKEN,
# written by infra-bootstrap's gitops/scripts/agent-vault-bootstrap.sh) and the
# credential VALUES definitions name by key (CLAUDE_CODE_OAUTH_TOKEN as a copy
# of agent-fleet-nygh's /provisioner key, GH_DEV_NOTES, ...). Dedicated Infisical
# project `agent-vault` (infra-bootstrap ADR-0061 Decision 6), folder
# /agent-vault, read by the provisioner's own Kubernetes-auth identity
# (ADR-0093 slice 2). Core never syncs it.
# Mounted as files (deployment.yaml), not envFrom: rotation without a restart,
# and the values stay out of git's and gh's environment.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: provisioner-agent-vault
  namespace: agent-fleet
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    kubernetesAuth:
      # Own identity k8s-agent-fleet-provisioner (infra-bootstrap
      # terraform/infisical/agent-fleet.tf, ADR-0093 slice 2).
      identityId: "6b4fc1ea-dfc9-4f67-a3bf-9f5cbe93d624"
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-reader-provisioner
        namespace: agent-fleet
      secretsScope:
        projectSlug: agent-vault
        envSlug: dev
        secretsPath: "/agent-vault"
  managedSecretReference:
    secretName: provisioner-agent-vault
    secretNamespace: agent-fleet
    creationPolicy: Orphan
