apiVersion: v1
kind: ServiceAccount
metadata:
  name: provisioner
  namespace: agent-fleet
---
# Subject of the provisioner's Infisical identity (infra-bootstrap
# terraform/infisical/agent-fleet.tf, ADR-0093 slice 2). No pod runs as it;
# only the Infisical operator mints its tokens.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infisical-reader-provisioner
  namespace: agent-fleet
automountServiceAccountToken: false
# The operator reads the first of these with autoCreateServiceAccountToken
# false: operator v0.11.11 re-logs in with the JWT it first used, and a
# minted token dies in 10 minutes, so syncs stopped after an hour.
secrets:
- name: infisical-reader-provisioner-token
---
# Long-lived token of infisical-reader-provisioner, filled by the token
# controller. Revoke by deleting it, then restart the Infisical operator.
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: infisical-reader-provisioner-token
  namespace: agent-fleet
  annotations:
    kubernetes.io/service-account.name: infisical-reader-provisioner
