# SSH authorized_keys for e2e-runner pods, managed via Infisical.
# Fetches the fleet-wide SSH public key from Infisical and materializes
# it as a Kubernetes Secret that pod.go mounts at /ssh-authorized-keys/.
# Optional: if the secret doesn't exist, pods still start without SSH access.
#
# secretsPath is the /e2e-ssh SUBFOLDER, never "/" — and that is the whole
# point of this being a second InfisicalSecret rather than another key in
# provisioner-infisical. The operator does not recurse, so this managed
# Secret contains exactly one key. Pointed at "/" it would instead mirror
# every root secret — GH_TOKEN, CLAUDE_CODE_OAUTH_TOKEN, AGENTFLEET_DB_* —
# into a Secret whose name says "authorized keys" and which is mounted into
# the e2e pod. Only pod.go's `Items:` projection would stand between those
# credentials and the sandbox docs/adr/0039 defines as credential-free.
# Don't widen this path.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: e2e-ssh-infisical
  namespace: agent-fleet
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: agent-fleet-nygh
        envSlug: dev
        secretsPath: "/e2e-ssh"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: e2e-ssh-authorized-keys
    secretNamespace: agent-fleet
    creationPolicy: Orphan
