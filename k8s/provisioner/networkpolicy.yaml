# First NetworkPolicy anywhere in this cluster (Cilium enforces it with no
# extra setup — see docs/adr/0012). Targets e2e-runner pods only; worker
# pods (docs/adr/0019/0020) aren't selected by any NetworkPolicy and stay
# default-allow, same as every other pod in the cluster — their traffic is
# either localhost-only (sidecar's MCP/API ports, same pod) or outbound
# gRPC to core, neither of which an ingress-only policy needs to gate.
#
# Three separate ingress rules, not one combined rule, because each source
# is allowed a different port subset:
#   - Traefik (human preview, gated by basic-admin-auth at L7): app + code-server
#   - worker pods (curl for API/backend testing): app port only, never code-server
#   - provisioner itself (Playwright + run_command MCP proxying): playwright
#     + exec ports
# The worker pod's own code-server access is the thing this exists to deny —
# code-server is a full IDE/terminal, a human-review-only surface, not
# something the agent should ever be able to reach.
#
# sshd's 2222 (human VSCode Remote-SSH) is deliberately NOT listed. The only
# access path is `kubectl port-forward`, which originates on the node — the
# kubelet opens the connection from the host namespace, so no `from:`
# selector here can match it and none is needed. Cilium's allow-localhost
# default permits host->local-pod regardless of policy; the proof is already
# running, since this pod's ReadinessProbe on 3000 comes from the same host
# origin and succeeds today with no rule admitting it.
#
# So an ingress rule for 2222 buys nothing and costs a lot: expressed as
# `namespaceSelector: {} + podSelector: {}` it reads "every pod in the
# cluster", which hands worker pods a route to the sandbox's sshd — the
# same class of reach this policy exists to deny for code-server. If
# external SSH ever lands (the deferred TCP IngressRoute), add a rule
# selecting the traefik namespace specifically, never an empty selector.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: e2e-runner
  namespace: agent-fleet
spec:
  podSelector:
    matchLabels:
      agent-fleet.dev/component: e2e-runner
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
    ports:
    - protocol: TCP
      port: 3000
    - protocol: TCP
      port: 8080
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: agent-fleet
    ports:
    - protocol: TCP
      port: 3000
  - from:
    - podSelector:
        matchLabels:
          app: provisioner
    ports:
    - protocol: TCP
      port: 8931
    - protocol: TCP
      port: 8932
  # core reaches :8932 for its own human-facing path — runInE2ePod, backing
  # GetE2EAppLog and the dashboard run-command surface (docs/adr/0044). Unlike
  # a worker, core is not task-scoped, so this belongs here rather than in the
  # per-task policy the provisioner now creates (docs/adr/0045).
  #
  # Listed ahead of the code that uses it: core still reaches the sandbox via
  # the provisioner relay today. A permission that arrives after the caller
  # fails as a timeout with no useful signal, so it lands first.
  #
  # The label is `agent-fleet-core`, not `core` — common-app-chart derives
  # app.kubernetes.io/name from the release name. Verified against the live
  # pod rather than assumed; `-l app.kubernetes.io/name=core` matches nothing,
  # and a selector that matches nothing is a policy that silently denies.
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: agent-fleet-core
    ports:
    - protocol: TCP
      port: 8932
