# Namespaced Role only — never a ClusterRole. Scoped to exactly what the
# provisioner needs:
#
#   - a session's pod, which is a batch/v1.Job (reliability-findings.md #11 —
#     Job's own TTL semantics replace a hand-rolled GC pass) plus its own
#     PersistentVolumeClaim (docs/adr/0048 §4)
#   - what expose() publishes: a Service and a Traefik IngressRoute
#   - a repo's shared postgres/redis instances (docs/adr/0034), now requested
#     on demand via request_service rather than declared per repo
#
# The e2e-preview pod this Role was originally written for is gone
# (docs/adr/0048 §6), and with it the per-task NetworkPolicy grant.
#
# Secrets/PersistentVolumeClaims (docs/adr/0034): a shared instance's own
# admin credentials (provisioner-generated, never AGENTFLEET_DB_*) and a
# postgres shared instance's data volume — infrastructure the provisioner
# itself creates and owns, distinct from the fleet-coordination-DB boundary
# in docs/adr/0020 point 1, which is untouched. Preview-pod auth REFERENCES a
# Middleware in `default` (authentik-forwardauth since infra-bootstrap
# ADR-0041, basic-admin-auth before it) that this Role deliberately cannot
# manage — there are no `middlewares` verbs below, and adding them so the
# provisioner could mint its own copy would put the fleet in charge of its own
# auth gate. Referencing one it does not control is the point.
#
# The worker pods themselves never get any of this — this Role is the ONLY
# RBAC surface in the whole fleet that can create/delete cluster resources
# (core, per docs/adr/0020 point 1, needs none at all).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: provisioner
  namespace: agent-fleet
rules:
- apiGroups: [""]
  # update, not just create/delete: re-exposing a session on a DIFFERENT port
  # updates the Service in place rather than recreating it, so a URL a human is
  # looking at does not 503 mid-swap (k8s/expose.go). Without this verb the
  # first expose() works and every later one 403s.
  resources: ["pods", "services"]
  verbs: ["create", "get", "list", "watch", "update", "delete"]
- apiGroups: [""]
  resources: ["secrets", "persistentvolumeclaims"]
  verbs: ["create", "get", "list", "watch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  # update (not just create/get/list/watch/delete): EnsureSharedInstance's
  # touchLastUsedAt PATCHes the Deployment's own annotation on every reuse
  # (docs/adr/0034's idle-GC substrate) — found live via /kind-local, the
  # first version of this grant omitted it and every touch silently 403'd
  # (logged as a non-fatal WARN by design, but every instance was
  # perpetually "never used" from the GC pass's point of view).
  verbs: ["create", "get", "list", "watch", "update", "delete"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list", "watch", "delete"]
- apiGroups: ["traefik.io"]
  # middlewares dropped with the cluster-ip-whitelist the provisioner used to
  # create at startup: expose()'s route references the shared basic-auth
  # middleware in the `default` namespace, which this Role does not manage.
  resources: ["ingressroutes"]
  verbs: ["create", "get", "list", "watch", "delete"]
# The networkpolicies grant is gone with what needed it (docs/adr/0048 §6).
# docs/adr/0045 added it so a per-task NetworkPolicy could fence which worker
# may reach which sandbox — enforcement in the CNI rather than a bearer token
# the sandbox would have to verify. There is no sandbox and no cross-pod reach
# to fence: an agent's tools and its app are both inside its own pod.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: provisioner
  namespace: agent-fleet
subjects:
- kind: ServiceAccount
  name: provisioner
  namespace: agent-fleet
roleRef:
  kind: Role
  name: provisioner
  apiGroup: rbac.authorization.k8s.io
