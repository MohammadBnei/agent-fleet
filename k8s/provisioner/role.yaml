# Namespaced Role only — never a ClusterRole. Scoped to exactly what the
# provisioner needs to create/tear down an e2e-preview pod (Pod, Service,
# Traefik IngressRoute/Middleware), a worker session (docs/adr/0019/0020),
# and, as of docs/adr/0034, a repo's shared environment-recipe service
# instances (postgres/redis). Worker sessions are batch/v1.Jobs, not bare
# Pods (reliability-findings.md #11 — Job's own backoff/TTL semantics
# replace the reconcile loop's hand-rolled retry/GC), so they need their
# own apiGroup/resource grant; e2e-preview pods stay plain Pods
# (long-running, explicitly killed, not run-to-completion — Job doesn't fit
# that lifecycle).
#
# Secrets/PersistentVolumeClaims (docs/adr/0034): a shared instance's own
# admin credentials (provisioner-generated, never AGENTFLEET_DB_*) and a
# postgres shared instance's data volume — infrastructure the provisioner
# itself creates and owns, distinct from the fleet-coordination-DB boundary
# in docs/adr/0020 point 1, which is untouched. Preview-pod auth still
# reuses the existing basic-admin-auth Middleware, unrelated to this grant.
#
# The worker pods themselves never get any of this — this Role is the ONLY
# RBAC surface in the whole fleet that can create/delete cluster resources
# (core, per docs/adr/0020 point 1, needs none at all).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: provisioner
  namespace: agent-fleet
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["create", "get", "list", "watch", "delete"]
- apiGroups: [""]
  resources: ["secrets", "persistentvolumeclaims"]
  verbs: ["create", "get", "list", "watch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  # update (not just create/get/list/watch/delete): EnsureSharedInstance's
  # touchLastUsedAt PATCHes the Deployment's own annotation on every reuse
  # (docs/adr/0034's idle-GC substrate) — found live via /kind-local, the
  # first version of this grant omitted it and every touch silently 403'd
  # (logged as a non-fatal WARN by design, but every instance was
  # perpetually "never used" from the GC pass's point of view).
  verbs: ["create", "get", "list", "watch", "update", "delete"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list", "watch", "delete"]
- apiGroups: ["traefik.io"]
  resources: ["ingressroutes", "middlewares"]
  verbs: ["create", "get", "list", "watch", "delete"]
# docs/adr/0045: once a sidecar dials its own task's sandbox directly, "which
# worker may reach which sandbox" has to be enforced by something. This grant
# lets the provisioner create one narrow per-task NetworkPolicy alongside each
# sandbox Service, rather than handing the sandbox a bearer token to verify —
# docs/adr/0039's un-prompted run_command depends on that pod holding no fleet
# credentials at all.
#
# Strictly less powerful than the secrets/PVC grant above, and it stays inside
# docs/adr/0034's boundary: the worker pod still holds zero RBAC, and dialing a
# Service needs DNS and a network path, not permissions.
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: provisioner
  namespace: agent-fleet
subjects:
- kind: ServiceAccount
  name: provisioner
  namespace: agent-fleet
roleRef:
  kind: Role
  name: provisioner
  apiGroup: rbac.authorization.k8s.io
