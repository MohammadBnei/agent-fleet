# Namespaced Role only — never a ClusterRole. Scoped to exactly what the
# provisioner needs to create/tear down an e2e-preview pod (Pod, Service,
# Traefik IngressRoute/Middleware) and, as of docs/adr/0019/0020, a worker
# session. Worker sessions are batch/v1.Jobs, not bare Pods
# (reliability-findings.md #11 — Job's own backoff/TTL semantics replace
# the reconcile loop's hand-rolled retry/GC), so they need their own
# apiGroup/resource grant; e2e-preview pods stay plain Pods (long-running,
# explicitly killed, not run-to-completion — Job doesn't fit that
# lifecycle). No Secret access: preview auth reuses the existing
# basic-admin-auth Middleware, no per-session secret is ever minted.
#
# The worker pods themselves never get any of this — this Role is the ONLY
# RBAC surface in the whole fleet that can create/delete cluster resources
# (core, per docs/adr/0020 point 1, needs none at all).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: provisioner
  namespace: agent-fleet
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["create", "get", "list", "watch", "delete"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list", "watch", "delete"]
- apiGroups: ["traefik.io"]
  resources: ["ingressroutes", "middlewares"]
  verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: provisioner
  namespace: agent-fleet
subjects:
- kind: ServiceAccount
  name: provisioner
  namespace: agent-fleet
roleRef:
  kind: Role
  name: provisioner
  apiGroup: rbac.authorization.k8s.io
