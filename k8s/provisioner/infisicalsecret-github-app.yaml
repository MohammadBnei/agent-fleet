# docs/adr/0075: the GitHub App ukubi-fleet's GITHUB_APP_ID and
# GITHUB_APP_PRIVATE_KEY. Dedicated Infisical project fleet-github-app
# (infra-bootstrap ADR-0062), read by its own identity fleet-github-app-reader,
# never the shared universal-auth one: agent-fleet-nygh is synced whole into
# core's env. Mounted as files on the provisioner only (deployment.yaml).
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: provisioner-github-app
  namespace: agent-fleet
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: fleet-github-app
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: fleet-github-app-universal-auth
        secretNamespace: infisical
  managedSecretReference:
    secretName: provisioner-github-app
    secretNamespace: agent-fleet
    creationPolicy: Orphan
