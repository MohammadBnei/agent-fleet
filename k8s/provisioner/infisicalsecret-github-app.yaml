# docs/adr/0075: the GitHub App ukubi-fleet's GITHUB_APP_ID and
# GITHUB_APP_PRIVATE_KEY. Dedicated Infisical project fleet-github-app
# (infra-bootstrap ADR-0062), read by the provisioner's own Kubernetes-auth
# identity (ADR-0093 slice 2), never core's. Kept out of agent-fleet-nygh, which
# core also reads. Mounted as files on the provisioner only (deployment.yaml).
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: provisioner-github-app
  namespace: agent-fleet
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    kubernetesAuth:
      # Own identity k8s-agent-fleet-provisioner (infra-bootstrap
      # terraform/infisical/agent-fleet.tf, ADR-0093 slice 2).
      identityId: "6b4fc1ea-dfc9-4f67-a3bf-9f5cbe93d624"
      autoCreateServiceAccountToken: false # infisical-reader-provisioner-token
      serviceAccountRef:
        name: infisical-reader-provisioner
        namespace: agent-fleet
      secretsScope:
        projectSlug: fleet-github-app
        envSlug: dev
        secretsPath: "/"
  managedSecretReference:
    secretName: provisioner-github-app
    secretNamespace: agent-fleet
    creationPolicy: Orphan
