# Renamed from infra-bootstrap's gitops/platform/e2e-provisioner/ — moved
# into this repo per docs/adr/0019/0020/0021's redesign (single "provisioner"
# owning all cluster-pod creation: e2e-preview pods AND worker pods, plus
# the shared PVC's git lifecycle). RBAC/ServiceAccount binding isn't
# something common-app-chart supports, so this stays a standalone
# plain-manifest ArgoCD Application (see infra-bootstrap's
# gitops/bootstrap/provisioner-application.yaml) — only its repoURL/path
# moved, not its shape.
#
# The worker/sidecar/provisioner images are pinned and auto-bumped by
# .github/workflows/docker.yml's deploy job. The e2e-runner image that used to
# float on :latest here is gone with the sandbox (docs/adr/0048 §6) — a session
# runs one pod, on the worker image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provisioner
  namespace: agent-fleet
  labels:
    app.kubernetes.io/part-of: agent-fleet
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: provisioner
  template:
    metadata:
      labels:
        app: provisioner
        app.kubernetes.io/part-of: agent-fleet
    spec:
      serviceAccountName: provisioner
      containers:
      - name: provisioner
        image: mohammaddocker/agent-fleet-provisioner:3.6.0
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: grpc
        env:
        - name: NAMESPACE
          value: agent-fleet
        - name: E2E_HOST
          value: e2e.bnei.dev
        - name: PORT
          value: "8080"
        - name: GRPC_PORT
          value: "9090"
        # New for docs/adr/0019/0020: the two images the provisioner spawns
        # as a worker pod's two containers, the shared workspace PVC it
        # clones/worktrees onto, and where core's own gRPC server
        # (ReportPodEvents) lives.
        - name: WORKER_IMAGE
          value: mohammaddocker/agent-fleet-worker:3.6.0
        - name: SIDECAR_IMAGE
          value: mohammaddocker/agent-fleet-sidecar:3.6.0
        - name: WORKSPACE_PVC
          value: agent-fleet-workspace
        - name: WORKSPACE_ROOT
          value: /workspace
        # Per-session working volumes go on node-local disk, NOT the cluster
        # default (longhorn). Measured 2026-08-14 (docs/adr/0048 §4): Longhorn
        # RWX and the NFS VM both cap at 10 MB/s, where a cold `bun install`
        # could not finish in three minutes; the same install takes 2.4s on
        # node disk. Both network backends landing on the identical number is
        # the fabric, not the backend: measured 2026-08-15, `.165` links at
        # 100 Mb/s because it reaches the Freebox through a TP-Link hop that
        # advertises 10/100 only. `k8s-worker-01` is a `.165` guest, which is
        # where that benchmark ran. server1 is at gigabit — an earlier version
        # of this comment blamed it and ex-laptop, before anyone ran `ethtool`.
        #
        # local-path is WaitForFirstConsumer (confirmed live), which is what
        # makes this safe: the volume is created where the pod schedules, and a
        # resumed session is pulled back to its own node by the PV's affinity.
        - name: SESSION_STORAGE_CLASS
          value: local-path
        # ...and because local-path is a hostPath on the node's OS disk,
        # sessions are confined to the two nodes that can afford it. The
        # control-plane nodes have ~33 GiB allocatable; filling one is a
        # cluster incident, not a session failure.
        #
        # The label is applied to k8s-worker-01/02. It is NOT a stock kubespray
        # label — the workers carry only arch/os/hostname — so a rebuilt node
        # needs it reapplied, or sessions will simply not schedule.
        - name: SESSION_NODE_SELECTOR
          value: agent-fleet.dev/session-node=true
        - name: CORE_GRPC_ADDR
          value: agent-fleet-core.agent-fleet.svc.cluster.local:9090
        # client-go's rest.InClusterConfig() natively trusts the projected
        # ServiceAccount CA — no TLS workaround needed for a Go binary
        # (unlike the old TS e2e-provisioner, see docs/adr/0013).
        envFrom:
        - secretRef:
            name: provisioner-infisical
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: agent-fleet-workspace
