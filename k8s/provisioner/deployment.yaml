# Renamed from infra-bootstrap's gitops/platform/e2e-provisioner/ — moved
# into this repo per docs/adr/0019/0020/0021's redesign (single "provisioner"
# owning all cluster-pod creation: e2e-preview pods AND worker pods, plus
# the shared PVC's git lifecycle). RBAC/ServiceAccount binding isn't
# something common-app-chart supports, so this stays a standalone
# plain-manifest ArgoCD Application (see infra-bootstrap's
# gitops/bootstrap/provisioner-application.yaml) — only its repoURL/path
# moved, not its shape.
#
# core (worker/sidecar/provisioner) images are pinned + auto-bumped by
# .github/workflows/docker.yml's deploy job; e2e-runner stays a floating
# :latest for v1, same accepted trade-off as actions-runner's
# myoung34/github-runner:latest — it isn't built by this repo's own CI.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provisioner
  namespace: agent-fleet
  labels:
    app.kubernetes.io/part-of: agent-fleet
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: provisioner
  template:
    metadata:
      labels:
        app: provisioner
        app.kubernetes.io/part-of: agent-fleet
    spec:
      serviceAccountName: provisioner
      containers:
      - name: provisioner
        image: mohammaddocker/agent-fleet-provisioner:1.51.1
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: grpc
        env:
        - name: NAMESPACE
          value: agent-fleet
        - name: E2E_RUNNER_IMAGE
          value: mohammaddocker/agent-fleet-e2e-runner:latest
        - name: E2E_HOST
          value: e2e.bnei.dev
        - name: PORT
          value: "8080"
        - name: GRPC_PORT
          value: "9090"
        # New for docs/adr/0019/0020: the two images the provisioner spawns
        # as a worker pod's two containers, the shared workspace PVC it
        # clones/worktrees onto, and where core's own gRPC server
        # (ReportPodEvents) lives.
        - name: WORKER_IMAGE
          value: mohammaddocker/agent-fleet-worker:1.51.1
        - name: SIDECAR_IMAGE
          value: mohammaddocker/agent-fleet-sidecar:1.51.1
        - name: WORKSPACE_PVC
          value: agent-fleet-workspace
        - name: WORKTREES_ROOT
          value: /workspace
        - name: CORE_GRPC_ADDR
          value: agent-fleet-core.agent-fleet.svc.cluster.local:9090
        # client-go's rest.InClusterConfig() natively trusts the projected
        # ServiceAccount CA — no TLS workaround needed for a Go binary
        # (unlike the old TS e2e-provisioner, see docs/adr/0013).
        envFrom:
        - secretRef:
            name: provisioner-infisical
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: agent-fleet-workspace
