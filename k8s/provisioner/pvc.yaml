# The fleet's shared RWX volume. It holds two things now (docs/adr/0048 §4):
#
#   repos/<repo>/          the clone cache, mounted READ-ONLY into session pods
#   claude-home/<session>/ that session's Agent SDK resume state
#
# Both are small and read-mostly, or small and irreplaceable. What used to be
# here and is not any more: session working trees, and the Go/Bun dependency
# caches. Those are write-heavy, and this volume was measured at 10 MB/s —
# where a cold `bun install` could not finish in three minutes. They now live
# on a per-session `local-path` PVC, node-local, where the same install takes
# 2.4 seconds.
#
# Session pods mount subPaths of this, not the whole volume. That used to be
# impossible: a linked git worktree's .git is an absolute-path gitlink back to
# repos/<repo>/.git/worktrees/<taskId>, so scoping the mount severed it and
# every git command answered "not a git repository" (found live, 2026-08-05).
# There are no linked worktrees any more — a session's tree is a real clone —
# so the mount boundary is real isolation for the first time.
#
# Only the provisioner (clone cache maintenance, claude-home seeding) and
# session pods touch it. core never does; holding zero PVC access matches its
# zero-RBAC design.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-fleet-workspace
  namespace: agent-fleet
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 30Gi
