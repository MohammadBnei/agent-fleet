# Reuses agent-fleet's existing Infisical project. Since docs/adr/0020 point 1
# the provisioner reads no Postgres credentials (AGENTFLEET_DB_* is core's to
# use). It no longer reads GH_TOKEN either: its git and every pod's GitHub
# access are the App ukubi-fleet's tokens (docs/adr/0075).
#
# "Reads" is not "holds": the scope below is synced whole, the same one core
# syncs, so this Secret carries every key in it — AGENTFLEET_DB_*, the S3
# keys, CLAUDE_CODE_OAUTH_TOKEN, DISCORD_BOT_TOKEN, THOT_AUTH_TOKEN,
# FLEET_PROVISIONER_TOKEN and FLEET_CORE_PROVISIONER_TOKEN among them
# (docs/adr/0069 Consequences). The provisioner refuses to start if
# FLEET_CORE_PROVISIONER_TOKEN is missing or short (docs/adr/0069).
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: provisioner-infisical
  namespace: agent-fleet
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: agent-fleet-nygh
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: provisioner-infisical
    secretNamespace: agent-fleet
    creationPolicy: Orphan
