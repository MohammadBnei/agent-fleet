# Reuses agent-fleet's existing Infisical project. Since docs/adr/0020 point 1
# the provisioner reads no Postgres credentials (AGENTFLEET_DB_* is core's to
# use). It no longer reads GH_TOKEN either: its git and every pod's GitHub
# access are the App ukubi-fleet's tokens (docs/adr/0075).
#
# It syncs only /provisioner in agent-fleet-nygh, which imports /shared
# (FLEET_CORE_PROVISIONER_TOKEN, FLEET_PROVISIONER_TOKEN, LOG_LEVEL,
# SESSION_RETENTION). Core's keys (AGENTFLEET_DB_*, S3, Discord) live in /core,
# which this identity cannot read (infra-bootstrap ADR-0093 slice 2). The
# provisioner refuses to start if FLEET_CORE_PROVISIONER_TOKEN is missing or
# short (docs/adr/0069).
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: provisioner-infisical
  namespace: agent-fleet
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    kubernetesAuth:
      # Own identity k8s-agent-fleet-provisioner (infra-bootstrap
      # terraform/infisical/agent-fleet.tf, ADR-0093 slice 2).
      identityId: "6b4fc1ea-dfc9-4f67-a3bf-9f5cbe93d624"
      autoCreateServiceAccountToken: false # infisical-reader-provisioner-token
      serviceAccountRef:
        name: infisical-reader-provisioner
        namespace: agent-fleet
      secretsScope:
        projectSlug: agent-fleet-nygh
        envSlug: dev
        secretsPath: "/provisioner"
  managedSecretReference:
    secretName: provisioner-infisical
    secretNamespace: agent-fleet
    creationPolicy: Orphan
