# Reuses agent-fleet's existing Infisical project, but the secret set
# changed with docs/adr/0020 point 1: the provisioner now holds zero
# Postgres credentials (AGENTFLEET_DB_* moved to core-only) and instead
# needs GH_TOKEN — it owns the shared PVC's git clone/fetch/worktree
# lifecycle (docs/adr/0019 point 2), the same auth the worker used to
# configure for itself before that responsibility moved here.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: provisioner-infisical
  namespace: agent-fleet
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: agent-fleet-nygh
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: provisioner-infisical
    secretNamespace: agent-fleet
    creationPolicy: Orphan
