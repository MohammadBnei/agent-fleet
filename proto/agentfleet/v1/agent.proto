syntax = "proto3";
package agentfleet.v1;
option go_package = "github.com/MohammadBnei/agent-fleet/proto/gen/go/agentfleet/v1;agentfleetv1";

import "agentfleet/v1/transcript.proto";
import "ukubi/errors/v1/options.proto";

// AgentErrorKey is AgentService's error keys (docs/adr/0081 §1-2), carried as ErrorKey.key: each value's wire
// string is its (ukubi.errors.v1.key), "agent." and its name after the prefix in lower case, which the islands and
// the dashboard read the generated enum's names by (core/internal/errkeys TestDeclared). A key exists only
// where the islands or the dashboard show text for an error and its code alone does not say what happened; every
// other error is server.internal with its code. Each RPC lists its keys below. Never rename or remove a value, nor
// change its wire string: add a new value.
enum AgentErrorKey {
  AGENT_ERROR_KEY_UNSPECIFIED = 0;
  // The thread's definition changed since it opened (docs/adr/0066 §6): start a new thread.
  AGENT_ERROR_KEY_DEFINITION_CHANGED = 1 [(ukubi.errors.v1.key) = "agent.definition_changed"];
  // The owner's open threads are at the cap, a member's 50 or a client's 500: close one first. Not the warm-time
  // capacity, also ResourceExhausted, which is busy.
  AGENT_ERROR_KEY_THREAD_CAP = 2 [(ukubi.errors.v1.key) = "agent.thread_cap"];
  // The definition does not exist or is not the caller's to use (one answer for both, docs/adr/0066 §4). Not a
  // missing thread, also NotFound.
  AGENT_ERROR_KEY_DEFINITION_UNAVAILABLE = 3 [(ukubi.errors.v1.key) = "agent.definition_unavailable"];
}

// AgentService (docs/adr/0066): the one API members and registered clients
// drive definition sessions through. Members call it on :8080 with their
// console cookie, clients on :9091 with a bearer; the listener sets the
// principal, and core/internal/agentsvc's authz table decides each method.
//
// It returns its own messages, never DashboardService's Session: no pod
// names, leases, images or agent session ids.
service AgentService {
  rpc ListDefinitions(AgentServiceListDefinitionsRequest) returns (AgentServiceListDefinitionsResponse);

  // Threads (docs/adr/0067): a thread is one definition session.
  rpc ListThreads(ListThreadsRequest) returns (ListThreadsResponse);
  rpc CreateThread(CreateThreadRequest) returns (CreateThreadResponse) {
    option (ukubi.errors.v1.keys) = "agent.thread_cap";
    option (ukubi.errors.v1.keys) = "agent.definition_unavailable";
  }
  rpc PostMessage(AgentServicePostMessageRequest) returns (AgentServicePostMessageResponse) {
    option (ukubi.errors.v1.keys) = "agent.definition_changed";
  }
  rpc GetTranscript(AgentServiceGetTranscriptRequest) returns (AgentServiceGetTranscriptResponse);
  rpc StreamTranscript(AgentServiceStreamTranscriptRequest) returns (stream AgentServiceStreamTranscriptResponse);

  // Decisions: each names the seq of an unanswered request of its type. Each is AnswerDecision for that request.
  rpc RespondToPermission(AgentServiceRespondToPermissionRequest) returns (AgentServiceRespondToPermissionResponse);
  rpc AnswerQuestion(AgentServiceAnswerQuestionRequest) returns (AgentServiceAnswerQuestionResponse);
  rpc ApprovePlan(ApprovePlanRequest) returns (ApprovePlanResponse);

  // The decision deck (docs/adr/0082 §5), whatever the kind: an admin in the console sees the decisions of every
  // session that is not archived, console and repo sessions included; anyone else, those on the threads they may read.
  rpc ListDecisions(ListDecisionsRequest) returns (ListDecisionsResponse);
  rpc GetDecision(GetDecisionRequest) returns (GetDecisionResponse);
  // Answers one open decision by id. An admin in the console answers any decision it can see; anyone else, on the
  // threads canAnswer allows (docs/adr/0067 §2).
  rpc AnswerDecision(AnswerDecisionRequest) returns (AnswerDecisionResponse);
  // Sends the decisions version, then each change: the version reached and the ids that changed. It ends after 90 s;
  // the client reconnects with since_version and re-reads the ids it holds.
  rpc WatchDecisions(WatchDecisionsRequest) returns (stream WatchDecisionsResponse);

  // Control: the owner's or an admin's.
  rpc SetConfig(SetConfigRequest) returns (SetConfigResponse);
  rpc Stop(StopRequest) returns (StopResponse);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);

  // Clients only (docs/adr/0066 §6-7, 0070).
  rpc Open(OpenRequest) returns (OpenResponse) {
    option (ukubi.errors.v1.keys) = "agent.thread_cap";
    option (ukubi.errors.v1.keys) = "agent.definition_unavailable";
  }
  rpc CloseThread(CloseThreadRequest) returns (CloseThreadResponse);
  rpc Invoke(InvokeRequest) returns (InvokeResponse);
  rpc WaitForResult(WaitForResultRequest) returns (WaitForResultResponse);
}

message AgentDefinitionInfo {
  string name = 1;
  repeated string model_allow = 2;
  repeated string mode_allow = 3;
  repeated string interaction_allow = 4;
  repeated string lifecycle_allow = 5;
}

message AgentServiceListDefinitionsRequest {}

message AgentServiceListDefinitionsResponse {
  repeated AgentDefinitionInfo definitions = 1;
}

message Thread {
  string id = 1;
  string definition = 2;
  string title = 3;
  // "shared" or "private".
  string visibility = 4;
  // True when the caller owns the thread.
  bool mine = 5;
  // "ask" or "deny".
  string interaction = 6;
  // "resident" or "single-shot".
  string lifecycle = 7;
  string model = 8;
  string mode = 9;
  // A context-only or untrusted entry is in its transcript (docs/adr/0067
  // §3): only admins answer it.
  bool tainted = 10;
  string created_at = 11;
  string last_active_at = 12;
  Status status = 13;
}

// docs/adr/0066 §10, derived, never stored.
message Status {
  // "loading", "working", "waiting", "idle" or "error".
  string state = 1;
  // Set with state "error": CAPACITY, PROVISION_FAILED, IMAGE_PULL, OOM,
  // STARTUP_STALL, AGENT_CRASHED, TIMEOUT, CREDENTIAL_STALE.
  string code = 2;
  string message = 3;
}

message Entry {
  int64 seq = 1;
  TranscriptEntryType type = 2;
  // "agent", "worker", "human", "system".
  string from = 3;
  string text = 4;
  optional int64 reply_to = 5;
  string created_at = 6;
  // Display only: the member's name, or the client.
  string author_name = 7;
  bool context_only = 8;
  bool untrusted = 9;
  // The caller wrote this entry. The author's sub never leaves core; this
  // is how a client tells its own messages from other members'.
  bool mine = 10;
}

message ListThreadsRequest {
  // Empty lists every definition the caller may use.
  string definition = 1;
}

message ListThreadsResponse {
  repeated Thread threads = 1;
}

message CreateThreadRequest {
  string definition = 1;
  // "shared" or "private".
  string visibility = 2;
  string title = 3;
}

message CreateThreadResponse {
  Thread thread = 1;
}

message AgentServicePostMessageRequest {
  string thread_id = 1;
  string text = 2;
}

message AgentServicePostMessageResponse {
  int64 seq = 1;
}

message AgentServiceGetTranscriptRequest {
  string thread_id = 1;
  int64 since_seq = 2;
  int32 limit = 3;
}

message AgentServiceGetTranscriptResponse {
  repeated Entry entries = 1;
  int64 next_seq = 2;
}

message AgentServiceStreamTranscriptRequest {
  string thread_id = 1;
  int64 since_seq = 2;
}

message AgentServiceStreamTranscriptResponse {
  Entry entry = 1;
}

message AgentServiceRespondToPermissionRequest {
  string thread_id = 1;
  int64 seq = 2;
  // "allow" or "deny".
  string behavior = 3;
  string message = 4;
}

message AgentServiceRespondToPermissionResponse {
  int64 seq = 1;
}

message AgentServiceAnswerQuestionRequest {
  string thread_id = 1;
  int64 seq = 2;
  string answers_json = 3;
}

message AgentServiceAnswerQuestionResponse {
  int64 seq = 1;
}

message ApprovePlanRequest {
  string thread_id = 1;
  int64 seq = 2;
  // Optional: a mode to switch to before approving, within mode.allow.
  string mode = 3;
}

message ApprovePlanResponse {
  int64 seq = 1;
}

message SetConfigRequest {
  string thread_id = 1;
  // Empty leaves the value as it is.
  string model = 2;
  string mode = 3;
}

message SetConfigResponse {}

message StopRequest {
  string thread_id = 1;
}

message StopResponse {}

message GetStatusRequest {
  string thread_id = 1;
}

message GetStatusResponse {
  Status status = 1;
}

message OpenRequest {
  string definition = 1;
  string thread_key = 2;
  string message = 3;
  bool wake = 4;
  bool tainted = 5;
  string interaction = 6;
  string lifecycle = 7;
  string visibility = 8;
  string idempotency_key = 9;
  string actor = 10;
  string causation_id = 11;
}

message OpenResponse {
  string thread_id = 1;
  int64 seq = 2;
}

message CloseThreadRequest {
  string definition = 1;
  string thread_key = 2;
}

message CloseThreadResponse {}

message InvokeRequest {
  string definition = 1;
  string input = 2;
  string idempotency_key = 3;
}

message InvokeResponse {
  string thread_id = 1;
}

message WaitForResultRequest {
  string thread_id = 1;
  int32 wait_seconds = 2;
}

message WaitForResultResponse {
  // "running", "done" or "failed".
  string state = 1;
  string structured_output = 2;
  string result_text = 3;
  string subtype = 4;
  Status error = 5;
}

// A decision's kind (docs/adr/0082 §5). A card, the fourth kind, comes with draft_card in a later slice.
enum DecisionKind {
  DECISION_KIND_UNSPECIFIED = 0;
  // AskUserQuestion.
  DECISION_KIND_QUESTION = 1;
  // A permission request, of any tool but ExitPlanMode.
  DECISION_KIND_PERMISSION = 2;
  // ExitPlanMode's permission request: approving the plan.
  DECISION_KIND_PLAN = 3;
}

enum DecisionState {
  DECISION_STATE_UNSPECIFIED = 0;
  DECISION_STATE_OPEN = 1;
  DECISION_STATE_ANSWERED = 2;
  // Closed without an answer: the agent re-asked, or the pod a permission was bound to is gone.
  DECISION_STATE_WITHDRAWN = 3;
  // A card's (docs/adr/0082 §5-6): past expires_at, or its pinned state moved.
  DECISION_STATE_EXPIRED = 4;
  DECISION_STATE_STALE = 5;
}

message Decision {
  string id = 1;
  DecisionKind kind = 2;
  DecisionState state = 3;
  // The session the decision is on: a thread, or for an admin also a console or repo session.
  string thread_id = 4;
  // The request's seq in the thread's transcript: what RespondToPermission, AnswerQuestion and ApprovePlan name.
  int64 request_seq = 5;
  // At most 280 characters, an agent claim: the first question, the tool, or the plan.
  string ask = 6;
  // The request as the agent sent it, as JSON.
  string payload_json = 7;
  // A permission's or plan's tool.
  string tool = 8;
  // Set once answered: the reply as JSON, who wrote it and when.
  string answer_json = 9;
  string answered_by = 10;
  string answered_at = 11;
  string created_at = 12;
  // The decisions version of this decision's last change.
  int64 version = 13;
  // owner/name, when the thread is about a GitHub subject.
  string subject_repo = 14;
}

message ListDecisionsRequest {
  // Empty matches every state, kind, repo or thread.
  repeated DecisionState states = 1;
  repeated DecisionKind kinds = 2;
  string subject_repo = 3;
  string thread_id = 4;
  // At most 200; 0 is 50.
  int32 page_size = 5;
  string page_token = 6;
}

message ListDecisionsResponse {
  // Newest first. A page can hold fewer than page_size while more follow.
  repeated Decision decisions = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

message GetDecisionRequest {
  string id = 1;
}

message GetDecisionResponse {
  Decision decision = 1;
}

message AnswerDecisionRequest {
  string decision_id = 1;
  // A permission or a plan: "allow" or "deny".
  string behavior = 2;
  // A question: its answers, a JSON object.
  string answers_json = 3;
  // A permission's or plan's message to the agent, at most 10,000 characters.
  string message = 4;
  // A plan approved: the mode to switch to first, within mode.allow. Empty switches nothing.
  string mode = 5;
  // A permission allowed (docs/adr/0076 §3): "once" (the default), "session", or "definition" (admins only), and
  // the rule's form, "exact" or "prefix".
  string scope = 6;
  string rule_form = 7;
}

message AnswerDecisionResponse {
  // The answer's seq in the thread's transcript.
  int64 seq = 1;
}

message WatchDecisionsRequest {
  // 0 starts at the current version.
  int64 since_version = 1;
}

message WatchDecisionsResponse {
  int64 version = 1;
  repeated string changed_ids = 2;
}
