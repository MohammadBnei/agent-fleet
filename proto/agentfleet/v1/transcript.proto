syntax = "proto3";
package agentfleet.v1;
option go_package = "github.com/MohammadBnei/agent-fleet/proto/gen/go/agentfleet/v1;agentfleetv1";

// Message shapes only — no service here (reused by core.proto's
// CoreService and the dashboard's DashboardService). Originally this data
// only ever traveled over MCP (fleet-core's send_message/wait_for_messages
// tools) — as of docs/adr/0020, MCP is local-only (agent-to-sidecar) and
// gRPC carries this between the sidecar and core instead; these message
// shapes are unchanged by that transport switch, only how they're
// delivered.

enum TranscriptEntryType {
  TRANSCRIPT_ENTRY_TYPE_UNSPECIFIED = 0;
  TRANSCRIPT_ENTRY_TYPE_DISCUSSION = 1;
  TRANSCRIPT_ENTRY_TYPE_APPROVE = 2;
  TRANSCRIPT_ENTRY_TYPE_ABORT = 3;
  // Structured multiple-choice question(s) posted by the agent via the
  // AskUserQuestion MCP tool — `text` is a JSON payload, not prose. Answered
  // via the dashboard (not Discord), see docs/adr/0018.
  TRANSCRIPT_ENTRY_TYPE_QUESTION = 4;
  // The human's answer to a QUESTION entry — `text` is a JSON payload.
  TRANSCRIPT_ENTRY_TYPE_ANSWER = 5;
  // Worker-sidecar-originated, never human- or agent-authored: git
  // diff/branch/tool-call telemetry pushed independently of any agent tool
  // call (see docs/adr/0020, docs/adr/0021's sidecar). `text` is a JSON
  // payload. Never relayed to Discord (core's relay loop skips this type).
  TRANSCRIPT_ENTRY_TYPE_TOOL_CALL = 6;
  // The raw Claude Agent SDK message discriminants worker/src/session.ts's
  // logSdkMessage relays verbatim (reliability-findings.md #0: "relay
  // everything, let the UI decide, no pre-filtering") — `text` is a JSON
  // payload, dashboard-only, never relayed to Discord (matches the DB
  // CHECK constraint in db/schema.sql, already widened for these values).
  TRANSCRIPT_ENTRY_TYPE_SYSTEM = 7;
  TRANSCRIPT_ENTRY_TYPE_ASSISTANT = 8;
  TRANSCRIPT_ENTRY_TYPE_USER = 9;
  TRANSCRIPT_ENTRY_TYPE_RESULT = 10;
  // Human-authored, from the dashboard's permission-mode selector (see
  // docs/adr/0027) — `text` is the raw target mode string
  // ("acceptEdits"|"dontAsk"|"bypassPermissions"), same convention APPROVE
  // already uses for its `text:"approved"`.
  TRANSCRIPT_ENTRY_TYPE_PERMISSION_MODE = 11;
  // Worker-authored, posted by canUseTool for any tool call the SDK's
  // current permission mode would prompt for (supersedes docs/adr/0021's
  // Write/Edit-absent-from-allowedTools gate) — `text` is a JSON
  // {tool, input} payload. Answered via DashboardService.RespondToPermission,
  // correlated back through `reply_to` the same way ANSWER correlates to
  // QUESTION.
  TRANSCRIPT_ENTRY_TYPE_PERMISSION_REQUEST = 12;
  // The human's allow/deny decision for a PERMISSION_REQUEST entry —
  // `text` is a JSON {decision, updatedInput?} payload.
  TRANSCRIPT_ENTRY_TYPE_PERMISSION_RESPONSE = 13;
  // Human-authored, from DashboardService.Interrupt (or Discord) — stops
  // only the current turn via the worker's q.interrupt(), unlike ABORT
  // which ends the whole session/pod. `text` is a free-text reason, same
  // convention ABORT already uses.
  TRANSCRIPT_ENTRY_TYPE_INTERRUPT = 14;
}

message TranscriptEntry {
  string task_id = 1;
  int64 seq = 2;
  string from = 3; // "agent" | "human"
  string text = 4;
  TranscriptEntryType type = 5;
  // Non-nil only for an ANSWER/PERMISSION_RESPONSE entry replying to a
  // specific QUESTION/PERMISSION_REQUEST entry's own seq (mirrors
  // transcript.Entry.ReplyTo server-side) — without this, a live-streamed
  // entry had no reply correlation at all; only AskUserQuestion's
  // in-process poll loop ever saw it.
  optional int64 reply_to = 6;
  // When the entry was appended (RFC3339, matching JournalEntry.created_at
  // and Task.heartbeat_at). Stored in Postgres since the first migration
  // but never sent until now, which left every client unable to say when
  // anything happened or how long a turn took — `seq` orders a feed, it
  // does not time one.
  string created_at = 7;
}

message AppendTranscriptEntryRequest {
  string task_id = 1;
  string from = 2;
  string text = 3;
  TranscriptEntryType type = 4;
  string idempotency_key = 5; // required; fleet-core mints one server-side if empty
}

message ReadTranscriptSinceRequest {
  string task_id = 1;
  int64 since_seq = 2;
  int32 timeout_ms = 3;
}

message ReadTranscriptSinceResponse {
  repeated TranscriptEntry entries = 1;
  int64 next_seq = 2;
}
