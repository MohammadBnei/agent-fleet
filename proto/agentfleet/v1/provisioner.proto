syntax = "proto3";
package agentfleet.v1;
option go_package = "github.com/MohammadBnei/agent-fleet/proto/gen/go/agentfleet/v1;agentfleetv1";

// provisioner is the gRPC server, core is the client — the same direction
// this service has always had (see docs/adr/0013), just renamed and grown.
// Originally e2e-only ("e2e-provisioner" / "E2eProvisionerService"); as of
// docs/adr/0019 the provisioner also spawns and tears down worker pods, so
// this service grew CreateWorkerPod/TearDownSession alongside the
// unchanged e2e-session RPCs. Per docs/adr/0020's hub-and-spoke rule, core
// is the *only* client of this service — no worker pod or sidecar ever
// calls it directly, including for e2e requests (those are proxied through
// core.proto's CoreService instead).

// The recipe system's wire types (ScopeMode, ServiceIngredient), the e2e
// session RPCs' messages (KillE2eSession*, GetE2eSessionStatus*,
// CreateE2eSession*) and the ServiceEndpoint roster all lived here.
//
// All of it is deleted (docs/adr/0048 §6). Nothing declares what toolchain or
// services a repo needs up front — the agent asks for a service when it turns
// out to need one — and nothing is dialled by address, because there is no
// second pod to dial.

// Which kind of pod an operation targets.
//
// Value 2 was SESSION_KIND_E2E, the sandbox pod (docs/adr/0048 §6). Reserved
// rather than reused: proto3 enums are open, so an in-flight message from a
// component on the older build still decodes — it just names a kind that
// selects nothing. Reusing the number for something else is what would
// actually break that rollout.
enum SessionKind {
  reserved 2;
  reserved "SESSION_KIND_E2E";

  SESSION_KIND_UNSPECIFIED = 0;
  SESSION_KIND_WORKER = 1;
}

// Fetches the repo's clone cache and creates the session's pod, synchronously,
// returning once the pod is scheduled. core is the only caller (docs/adr/0020
// point 2 — the provisioner never decides to spawn a pod on its own).
//
// It no longer adds a worktree: the session's working tree is cloned by an
// init container inside the pod, because it lives on a per-session volume the
// provisioner never mounts (docs/adr/0048 §4/§5).
message CreateWorkerPodRequest {
  string session_id = 1;
  string repo = 2;
  string repo_url = 3;
  string base_branch = 4;
  // description and lease_id are handed straight through to the worker
  // pod's env — the worker no longer fetches its own session row at all
  // (docs/adr/0020 point 1: it holds no DB credentials, direct or
  // otherwise), so whatever it needs has to arrive at pod creation time.
  string description = 5;
  string lease_id = 6;
  // Non-empty when this task already has a saved Claude SDK session
  // (sessions.agent_session_id) — threaded straight to the worker pod's
  // RESUME_SESSION_ID env, which worker/src/session.ts passes as `resume:`
  // to query() so the new pod continues the prior conversation instead of
  // starting fresh (sessions redesign, supersedes docs/adr/0021/0025's
  // phase-boundary framing). Empty for a brand-new task.
  string resume_session_id = 7;
  // The transcript seq this pod's streamHumanMessages cursor should start
  // from — one past whatever already existed for this task at dispatch
  // time. Without this, a fresh pod's cursor defaults to 0 and replays
  // every pre-existing human directive (a stale Stop's "abort" entry,
  // most critically), which self-aborts a resumed session within seconds
  // of it starting. 0 for a brand-new task (nothing to skip).
  int64 resume_from_seq = 8;
  reserved 9, 11;
  reserved "guidance", "service_ingredients";

  // tool_keys is what survives docs/adr/0034's ingredient resolution: only
  // "cluster-access", which is a privilege grant rather than a toolchain
  // (docs/adr/0037). The toolchain is in the session's image now, and services
  // are requested on demand rather than declared per repo — so
  // service_ingredients has no producer left, and `guidance` went with the
  // fleet-composed prompt it was hidden inside (docs/adr/0048).
  repeated string tool_keys = 10;

  // The container image the worker container runs, from `repos.image` — the
  // one column docs/adr/0048 §6 put in place of the four toolchain
  // ingredients, on the grounds that "an init container copying a Go
  // toolchain onto an emptyDir is an elaborate way of saying this repo needs
  // Go". Empty means the provisioner's own WORKER_IMAGE default.
  //
  // The column, its dashboard input and its store round-trip all shipped
  // with docs/adr/0048; this field is what was missing, so setting the field
  // in the dashboard did nothing at all until now.
  //
  // Applies to the worker container ONLY. The clone init container and the
  // sidecar stay on the fleet's own images: cloning is fleet-owned behavior
  // that needs git, and a repo-supplied image is not required to have it.
  string image = 12;
}

message CreateWorkerPodResponse {
  string pod_name = 1;
  // The images the pod spec actually got, after `image` above was resolved
  // against the provisioner's own WORKER_IMAGE/SIDECAR_IMAGE defaults. core
  // stores these on the session row so the dashboard can say which build a
  // session ran — which stays true after the fleet is upgraded underneath it,
  // where reporting today's defaults would quietly lie.
  string worker_image = 2;
  string sidecar_image = 3;
}

// The provisioner's own build and the images it stamps onto new pods.
//
// Deliberately its own RPC rather than three more fields on
// ListWorkerPodsResponse: the dashboard's topology polls every 5s, and
// ListWorkerPods hits the Kubernetes API. This answer is process-local
// constants, so it costs nothing to ask often.
message GetVersionRequest {}

message GetVersionResponse {
  // The provisioner binary's version, compiled in via -ldflags at image build
  // time (docker.yml passes the same string it tags the image with). "dev" for
  // a local `go build`.
  string version = 1;
  // What a new session gets when its repo sets no `image` override.
  string worker_image = 2;
  // What every session's sidecar runs — no per-repo override exists, the
  // sidecar is fleet-owned.
  string sidecar_image = 3;
}

// core owns `sessions` and therefore decides when a session should tear
// down (task reached done/failed/cancelled, or an explicit kill) —
// the provisioner no longer polls/joins against `the deleted status column` itself
// (docs/adr/0020 point 1: it holds no DB credentials at all). The
// provisioner's own reconcile loop keeps doing pure-k8s orphan detection
// independently of this RPC.
message TearDownSessionRequest {
  string session_id = 1;
  SessionKind kind = 2;
}

message TearDownSessionResponse {
  bool torn_down = 1; // false = nothing to tear down
}

// Worktree/branch lifecycle (reliability-findings.md #2): a task's
// worktree is no longer deleted as a side effect of TearDownSession (that
// destroyed never-pushed commits whenever a terminal status was reached
// via a git push failure — the only reference to them lived in the
// worktree's branch). These two RPCs are the manual half of cleanup
// (dashboard-driven); the automated half is the periodic sweep
// (provisioner/internal/sweep), which only acts once a branch's upstream
// is confirmed [gone].
// ListWorkerPods reports which sessions actually have a live worker Job, as
// Kubernetes sees it. It is the safety net that replaces the 30-second
// heartbeat deleted in docs/adr/0048.
//
// The heartbeat asked the pod to report on itself, which could not
// distinguish a healthy session from a wedged one and went silent for the
// same reason the pod had stopped working. Pod events are pushed instead —
// but a push can be dropped (core restarting, for instance, which is exactly
// when a deploy is happening), and a dropped TERMINATED leaves a session
// holding a concurrency slot forever. Core reconciles against this list every
// 60s so that failure self-heals rather than requiring a human to notice.
//
// Deliberately a provisioner RPC rather than core reading the API directly:
// core holds zero cluster RBAC (docs/adr/0020 point 1), and a liveness check
// is not a reason to grant it any.
message ListWorkerPodsRequest {}

message LiveWorkerPod {
  string session_id = 1;
  string pod_name = 2;
  // Kubernetes Job phase: "Running" | "Pending" | "Succeeded" | "Failed".
  string phase = 3;
}

message ListWorkerPodsResponse {
  repeated LiveWorkerPod pods = 1;
}

// ListWorktrees/DeleteWorktree and their messages (WorktreeInfo,
// ListWorktreesResponse, DeleteWorktree*) are gone with the worktree model
// (docs/adr/0048 §5). A session's tree is its own PVC; nothing lists them by
// repo, and the retention GC deletes a volume rather than a directory.

// Publishes a session's port at <session>.e2e.bnei.dev: a Service plus a
// Traefik IngressRoute on ADR-0033's `le-dns` wildcard. Idempotent — the
// agent may call expose() again after a warm, and re-exposing the same port
// must return the same URL rather than erroring.
message ExposeSessionRequest {
  string session_id = 1;
  int32 port = 2;
}

message ExposeSessionResponse {
  string url = 1;
}

message UnexposeSessionRequest {
  string session_id = 1;
}

message UnexposeSessionResponse {}

// Provisions or reuses a shared backing service. Keyed by repo, not by
// session (ADR-0034's rule, which outlives the recipe system that introduced
// it): instances are expensive and sessions on the same repo want the same
// database, so tearing one down is never implied by a single session ending.
message ProvisionServiceRequest {
  string session_id = 1;
  string repo = 2;
  // "postgres" | "redis"
  string kind = 3;
}

message ProvisionServiceResponse {
  string dsn = 1;
}

service ProvisionerService {
  rpc CreateWorkerPod(CreateWorkerPodRequest) returns (CreateWorkerPodResponse);
  rpc TearDownSession(TearDownSessionRequest) returns (TearDownSessionResponse);
  // The liveness reconcile source — see ListWorkerPodsRequest.
  rpc ListWorkerPods(ListWorkerPodsRequest) returns (ListWorkerPodsResponse);
  // What build the provisioner is, and what it stamps onto new pods.
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse);

  // What is left of the sandbox after docs/adr/0048 §6: the two capabilities
  // that need cluster RBAC. Everything else the e2e pod did — running the
  // app, running builds, running a browser — happens in the session pod
  // itself now, with plain Bash.
  rpc ExposeSession(ExposeSessionRequest) returns (ExposeSessionResponse);
  rpc UnexposeSession(UnexposeSessionRequest) returns (UnexposeSessionResponse);
  rpc ProvisionService(ProvisionServiceRequest) returns (ProvisionServiceResponse);

  // Deletes a session's working-tree PVC. The other half of its disk (the
  // SDK resume state) is a directory on the shared volume, removed in the
  // same call — the two live on different volumes because they have
  // different access patterns, not because anything wants them apart.
  rpc SweepSession(SweepSessionRequest) returns (SweepSessionResponse);
}

message SweepSessionRequest {
  string session_id = 1;
}

message SweepSessionResponse {}
