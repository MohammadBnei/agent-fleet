syntax = "proto3";
package agentfleet.v1;
option go_package = "github.com/MohammadBnei/agent-fleet/proto/gen/go/agentfleet/v1;agentfleetv1";

import "agentfleet/v1/agent.proto";
import "agentfleet/v1/transcript.proto";
import "agentfleet/v1/provisioner.proto";
import "agentfleet/v1/files.proto";
import "ukubi/errors/v1/options.proto";

// CoreErrorKey is CoreService's error keys (docs/adr/0081 §1-2), as AgentErrorKey is AgentService's: each value's
// wire string is "core." and its name after the prefix in lower case. Never rename or remove a value, nor change its
// wire string: add a new value.
enum CoreErrorKey {
  CORE_ERROR_KEY_UNSPECIFIED = 0;
  // The definition drafted its 10 cards of the last 24 hours: the card was not drafted.
  CORE_ERROR_KEY_CARD_BUDGET = 1 [(ukubi.errors.v1.key) = "core.card_budget"];
}

// core is the gRPC server here — its first (see docs/adr/0020's Context:
// "nothing under fleet-core/ hosts one today"). Two kinds of clients:
// the provisioner (streaming pod-lifecycle events in, ReportPodEvents
// only) and every worker pod's sidecar (everything else — the sidecar's
// local MCP server and wrapper-facing API both funnel through this one
// outbound connection, docs/adr/0020 point 5). core holds the fleet's
// only Postgres credentials (docs/adr/0020 point 1); this service is how
// every other component reaches data that lives there.

// --- provisioner -> core: pushed, not polled (docs/adr/0020 point 3) ---

enum PodPhase {
  POD_PHASE_UNSPECIFIED = 0;
  POD_PHASE_CREATED = 1;
  POD_PHASE_SCHEDULED = 2;
  POD_PHASE_RUNNING = 3;
  POD_PHASE_CRASHED = 4;
  POD_PHASE_TERMINATED = 5;
  // Reported once, immediately when CreateWorkerPod's handler starts —
  // before git clone/worktree/pod-create even begin. Closes the blind
  // spot where a claimed task with a hung or slow provisioning step looked
  // identical to one that hadn't started at all (confirmed live: a task
  // sat claimed for 20+ minutes with zero pod events, indistinguishable
  // from "provisioner never got the call"). `message` carries the current
  // sub-step ("cloning repo", "adding worktree", "creating pod") — no new
  // enum value per sub-step, since the set of steps is provisioner-
  // internal detail, not a state other components branch on.
  POD_PHASE_PROVISIONING = 6;
}

message PodEvent {
  string session_id = 1;
  SessionKind kind = 2;
  PodPhase phase = 3;
  string pod_name = 4;
  string message = 5; // human-readable detail — a crash reason, or (for
                       // POD_PHASE_PROVISIONING) the current sub-step
  string job_uid = 6; // the Job's UID: one pod attempt, unlike pod_name, which is per session
  // Why the node took the pod away ("Evicted", "Preempted"), empty for anything else. A planned loss is no crash
  // (docs/adr/0084 §3).
  string termination_reason = 7;
}

message ReportPodEventsResponse {}

// --- sidecar -> core: agent-facing (proxied MCP-shaped calls) ---

// Mirrors today's send_message MCP tool exactly — reuses transcript.proto's
// types rather than redefining them (same precedent dashboard.proto already
// set for GetTranscript/StreamTranscript).
message SendMessageRequest {
  string session_id = 1;
  string from = 2;
  string text = 3;
  TranscriptEntryType type = 4;
  string idempotency_key = 5; // core mints one server-side if empty
  // Correlates this entry to an earlier one, reusing the reply_to_seq
  // column transcript already has for question/answer and permission
  // pairs. Set by ask_thot so thot's answer points at the question that
  // prompted it — the two can be minutes apart with other messages
  // interleaving, so adjacency alone isn't enough to pair them.
  optional int64 reply_to_seq = 6;
}

// AppendResponse is the one response shape for every RPC whose job is
// "append an entry to a session's transcript": SendMessage here, and
// PostMessage/AnswerQuestion/RespondToPermission on DashboardService.
//
// They are one operation wearing four names — a human message, an agent
// message, an answer, and a permission decision are all a row in
// `transcript` — so they get one shape. The seq is the only thing the
// caller could not compute for itself, and it is the correlation key
// everything else in the fleet keys off.
//
// Deliberately NOT extended to cover every RPC. Three of the four used to
// return `string status = 1` holding a constant the server always set,
// which duplicated the signal Connect's error channel already carries: with
// a status inside a successful response, every caller has to check both,
// and eventually one checks only the wrong one. The rule this settles on is
// narrower and holds: **an RPC returns nothing, or the one thing the caller
// cannot already know.**
message AppendResponse {
  int64 seq = 1;
}

// Appends a QUESTION entry and long-polls for a matching ANSWER up to
// timeout_ms, returning it verbatim if one arrives. A timeout is not an
// error: the question stays live, the agent ends its turn, and the answer is
// delivered later as a new message (docs/adr/0058).
//
// This one keeps a response body rather than sharing AppendResponse,
// because it genuinely returns something the caller cannot compute: whether
// a human answered, and what they said.
message AskUserQuestionRequest {
  string session_id = 1;
  string questions_json = 2;
  // Fixed by the sidecar (blockingWaitMs, 45s), never chosen by the agent:
  // the agent's MCP client aborts a request at 60s (docs/adr/0058). <=0 falls
  // back to core's own default. Core waits min(DECISION_WAIT_MS, this).
  int32 timeout_ms = 3;
  // The agent_spec_sha the worker applied, as for StreamHumanMessagesRequest
  // (docs/adr/0066 §8): an answer is human input too.
  string agent_spec_sha = 4;
}

message AskUserQuestionResponse {
  reserved 1;
  reserved "status";

  // Was `string status = 1` holding "answered"|"pending". A bool, because
  // that is what it always was: a string that looks like a status code
  // invites callers to treat a timeout as a failure, and invites the server
  // to grow a third value nobody handles. Whether a human answered is a
  // yes/no, and the timeout is an ordinary outcome of a long poll.
  bool answered = 4;
  string answers_json = 2; // set only when answered
  // The seq of the question entry this call appended. Stable across
  // re-invocations only if the caller passes the same questions — a
  // re-ask mints a NEW entry with a new seq, which is what makes any
  // control posted against an older one dead.
  int64 question_seq = 3;
  // The question's decision (docs/adr/0082 §5), for the pending reply the
  // agent reads. Empty when answered.
  string decision_id = 5;
}

// RequestE2eEnvRequest/Response and KillE2eEnvRequest/Response are gone with
// the sandbox (docs/adr/0048 §6). Their whole payload was the recipe system —
// resolved_start_cmd, profile_name, tools, services — i.e. the fleet telling
// the agent how to run the repo the agent is already sitting in.
//
// What replaces them carries no recipe at all, because there is nothing to
// resolve: the agent starts its own server and asks for a URL.
message ExposeRequest {
  string session_id = 1;
  int32 port = 2;
}

message ExposeResponse {
  string url = 1;
}

message UnexposeRequest {
  string session_id = 1;
}

message UnexposeResponse {}

message RequestServiceRequest {
  string session_id = 1;
  // "postgres" | "redis"
  string kind = 2;
}

message RequestServiceResponse {
  string dsn = 1;
}

// Playwright's tool set is discovered at runtime by the e2e pod, not fixed
// — proxied sidecar -> core -> provisioner -> e2e pod (see provisioner.proto's
// matching pair; same message shapes, reused rather than redefined).

// --- sidecar -> core: wrapper-facing (never agent-initiated, docs/adr/0020
// point 5's third responsibility) ---

// Session, GetSessionRequest/Response, and SetPermissionModeRequest/Response
// live here (not dashboard.proto, which imports this file) so CoreService's
// GetSession/SetPermissionMode below and DashboardService's same-named RPCs
// can share one definition — both just return/mutate the session row, no
// dashboard-specific shape needed.
//
// Field numbers 4, 6, 9, 10, 15 and 16 are reserved, not reused: status,
// pr_url, heartbeat_at, retry_count, awaiting_human and kind are all gone in
// docs/adr/0048, and reusing their numbers would let an old client silently
// misread a new field as the one it remembers.
message Session {
  reserved 4, 6, 9, 10, 15, 16;
  reserved "status", "pr_url", "heartbeat_at", "retry_count", "awaiting_human", "kind";

  string id = 1;
  string repo = 2;
  // Human-facing labels only, never part of the prompt. A session's actual
  // instruction is its first transcript entry.
  string description = 3;
  optional string title = 18;

  // Field 5 was thread_id — the Discord thread a task relayed into. Gone
  // with the thread machinery (docs/adr/0048): Discord is outbound-only, so
  // there is no thread to correlate back to.
  reserved 5;
  reserved "thread_id";

  // Pod lifecycle (PodPhase, from ReportPodEvents and core's reconcile
  // loop). With `status` gone this is the fleet's only liveness signal, and
  // the concurrency cap counts exactly these phases.
  optional string pod_phase = 7;
  optional string pod_message = 8;
  optional string last_error = 11;

  // The Claude SDK's own session id (SaveAgentSessionId) — resumable in a
  // fresh pod via `resume:`. Named agent_session_id, not session_id, now
  // that the row itself is a session. Unset until the SDK's first streamed
  // message reports it.
  optional string agent_session_id = 12;
  // Which Claude model this session runs. The worker reads it back on every
  // warm; unset, it falls back to CLAUDE_MODEL, and with that empty too it
  // passes no model and Claude Code picks (docs/adr/0077). A repo session's
  // row then records the model the SDK's init reported.
  optional string model = 22;

  // Last time a transcript entry was appended — the clock the idle sweep and
  // the retention GC both read. RFC3339. Unset for a session with no
  // activity yet.
  optional string last_active_at = 13;

  // The session's current SDK permission mode ("default"|"plan"|
  // "acceptEdits"|"auto"|"dontAsk"), so the mode picker
  // shows the real active mode instead of guessing. Restored on every warm.
  optional string permission_mode = 14;

  // Session liveness (docs/adr/0040): "" (no live pod) | "working" |
  // "blocked" | "idle" | "done" | "stalled" | "unknown". Derived server-side
  // from the row on every read rather than stored, so it cannot drift; core
  // owns the thresholds, so every client agrees on what "stalled" means
  // instead of each re-implementing the heuristic.
  //
  // This is now the ONLY status. It replaces the 8-value enum whose 'done'
  // value never acquired a writer, because a polymorphic session's
  // completion is not something a machine can compute.
  string live_state = 17;

  // How many decisions are waiting on a human right now: unanswered
  // questions plus pending permission requests.
  //
  // A count, not the old awaiting_human boolean, and that is a bug fix.
  // Permissions are a LIST — parallel tool calls each get their own seq —
  // but the boolean was set and cleared by any single permission_response,
  // so answering one decision marked the session unblocked while others were
  // still waiting, and it would sit stalled with nobody notified.
  int32 pending_decisions = 19;

  // Disk reclaimed by the retention GC: readable, but no longer resumable.
  // The dashboard must not offer Warm when this is set.
  optional string swept_at = 20;
  // The human is finished with this session — the only terminal state,
  // because it is the only one a machine cannot compute.
  optional string archived_at = 21;

  // Which images this session's pod actually ran, recorded from
  // CreateWorkerPodResponse at dispatch. Not the provisioner's current
  // defaults: a session warmed before a fleet upgrade keeps reporting the
  // build it is running, which is the whole point of showing it. Empty for a
  // session that has never had a pod.
  optional string worker_image = 23;
  optional string sidecar_image = 24;
  // docs/adr/0062: set when the session was created from a definition,
  // pinned to that version. Both or neither.
  optional string definition_name = 25;
  optional string definition_sha = 26;
  // The effort level a repo session launches with (docs/adr/0077). Unset =
  // none chosen: the worker passes no effort and Claude Code decides. A
  // definition session leaves it unset and uses its spec's thinking.default.
  optional string effort = 27;
  // The release that built this session's pod, recorded next to
  // worker_image/sidecar_image from CreateWorkerPodResponse.fleet_version.
  // Unset for a pod created before the provisioner reported it.
  optional string fleet_version = 28;
  // docs/adr/0086 §2: the letters of the Rule of Two this session may use, A (untrusted trigger), B (sensitive
  // reads), C (effects): "BC", "AB", "AC" or "ABC" (supervised). Stored once at create, never widened.
  string trust_set = 29;
}

// What one agent can see of another session. Deliberately not the full
// Session: an agent needs enough to pick a target and know whether it can be
// talked to, not another session's internals.
message SessionSummary {
  string session_id = 1;
  string repo = 2;
  string description = 3;
  string status = 4;
  // See Session.live_state (docs/adr/0040). This is what makes "wait until
  // the other agent is genuinely blocked" expressible at all.
  string live_state = 5;
}

message ListPeerSessionsRequest {
  // The caller's own task, excluded from the results — an agent has no use
  // for a summary of itself and cannot prompt itself anyway.
  string caller_session_id = 1;
}

message ListPeerSessionsResponse {
  repeated SessionSummary sessions = 1;
}

message PromptSessionRequest {
  string caller_session_id = 1;
  string target_session_id = 2;
  string text = 3;
  // Hop count, incremented per relay. Bounded so A->B->A cannot loop
  // forever; an agent never sets this itself, the sidecar does.
  int32 depth = 4;
}

message PromptSessionResponse {
  int64 seq = 1;
  // The target's live state immediately after delivery — usually
  // "working", or "unknown" if a pod was just warmed for it.
  string live_state = 2;
  // Set when delivery warmed an idle session's pod.
  string pod_name = 3;
}

message WaitForSessionStateRequest {
  string target_session_id = 1;
  // Only count a settled state once the target has produced activity newer
  // than this transcript seq. Without it, waiting right after prompting an
  // already-idle target returns instantly with the state it was in BEFORE
  // the prompt — the target hasn't started the new turn yet. herdr solves
  // the same race by requiring an observed state change off a baseline
  // captured before submission. Pass the seq prompt_agent returned; the
  // sidecar fills it in automatically when omitted.
  int64 after_seq = 4;
  // Any of these ends the wait. Empty means the settled set
  // (idle/done/blocked/stalled) — "it stopped needing to be waited on".
  repeated string until = 2;
  // Fixed by the sidecar (blockingWaitMs), not the agent (docs/adr/0060). <=0
  // falls back to core's own two-minute default, which is above the agent's
  // 60s MCP ceiling — so the sidecar must always send a value.
  int32 timeout_ms = 3;
}

message WaitForSessionStateResponse {
  string live_state = 1;
  bool timed_out = 2;
}

message GetSessionRequest {
  string id = 1;
}

message GetSessionResponse {
  Session session = 1;
  // docs/adr/0066 §9, 0067 §4: a definition session's spec, from its pinned
  // version's effective spec. Unset for a repo session, which keeps today's
  // behaviour.
  AgentSpec agent_spec = 2;
  // Hex sha256 of agent_spec's deterministic encoding. The worker echoes it
  // on StreamHumanMessages and WaitForMessages once it has applied the spec;
  // core delivers a definition session nothing without the current one
  // (docs/adr/0066 §8). Empty for a repo session.
  string agent_spec_sha = 3;
  // docs/adr/0076 §3: the session's grants and its definition's live ones,
  // outside agent_spec and its sha so a new grant never stops delivery.
  repeated string grants = 4;
  // docs/adr/0082 §5: how long the worker's gate waits on a permission or
  // plan decision before answering "pending" (core's DECISION_WAIT_MS).
  // 0 means the worker's own default, 45 s.
  int32 decision_wait_ms = 5;
  // docs/adr/0084 §4: a standing character's open threads other than main,
  // thread key -> the SDK session id to resume it with. A thread with no id
  // yet is absent. Main resumes with session.agent_session_id.
  map<string, string> thread_session_ids = 6;
}

// What a definition pod's worker applies to its query() (docs/adr/0067 §4).
// Flattened from the definition's effective spec (core/internal/definitions
// Spec); lifecycle is the SESSION's choice within the definition's allow
// list, empty for a resident session (the worker reads "" as "resident").
message AgentSpec {
  repeated string tools_allow = 1;
  repeated string tools_deny = 2;
  repeated string sidecar_tools = 3;
  repeated string model_allow = 4;
  string thinking_default = 5;
  repeated string mode_allow = 6;
  string system_prompt_append = 7;
  int32 max_turns = 8;
  // Unused: interaction is gone (docs/adr/0070 §2). Always empty.
  string interaction = 9 [deprecated = true];
  string lifecycle = 10;
  // docs/adr/0068 §4: the definition's workspace is served to an island host
  // (its embed.origins is not empty), so a write that leaves active content
  // in it, or a non-plain file, asks a human in every mode.
  bool script_ask = 11;
  // docs/adr/0070 §3: the definition's output.schema as compact JSON, and
  // only for a single-shot session; "" for every other (an empty field is not
  // encoded, so a resident session's agent_spec_sha is unchanged). `lifecycle`
  // above is likewise filled from the session row for single-shot only.
  string output_schema = 12;
}

// Sets an arbitrary SDK permission mode on a task. Reused by two very
// different callers: the dashboard (docs/adr/0027 — a human flipping a
// running session's mode, which also appends a transcript entry the live
// worker reacts to; see dashboard.proto's own SetPermissionMode comment)
// and the sidecar (a worker pod persisting its own initial/current mode on
// startup, no transcript append — CoreService's handler is a plain column
// write, see coreserver's implementation).
// The caller's own session (bound to its lease), the tool, and the call's input as JSON. Core compares the input
// canonically (decisions.Canon): key order and spacing do not matter, every value does.
message ConsumeGrantRequest {
  string session_id = 1;
  string tool = 2;
  string input_json = 3;
}

message ConsumeGrantResponse {
  bool granted = 1;
  // The answered decision the grant came from, when granted.
  string decision_id = 2;
}

message SetPermissionModeRequest {
  string session_id = 1;
  string mode = 2;
}

message SetPermissionModeResponse {}

// A worker pod relabelling its OWN session's human-facing title/description
// (Session.title/description). Optional per field: an unset field leaves that
// column unchanged, so a title can be set without clobbering a description.
// Like SetPermissionMode, a plain column write with no transcript append — the
// caller IS the session, there is no other worker to notify.
message UpdateSessionMetaRequest {
  string session_id = 1;
  optional string title = 2;
  optional string description = 3;
}

message UpdateSessionMetaResponse {}

// PublishEventRequest is a definition session handing work to whoever owns or
// subscribes to the event (docs/adr/0071 §2, docs/adr/0078 §8). The caller
// names only what it says: core sets the actor (agent:<definition>), the
// causation (the bridge event that last woke the session), hops and trust.
message PublishEventRequest {
  string session_id = 1;
  // Under dev.bnei.agent., never a reserved type.
  string type = 2;
  // The thread it is about, e.g. github/<owner>/<repo>/pr/<n>.
  string subject = 3;
  // What the receiving agent reads, quoted.
  string text = 4;
  // Optional: a retry with the same key publishes nothing new.
  string idempotency_key = 5;
}

// DraftCardRequest is the card as the agent says it; core fills the option ids, the subject url, expires_at, the
// writer and drafted_by.
message DraftCardRequest {
  string session_id = 1;
  // 1..280 characters.
  string ask = 2;
  CardSubject subject = 3;
  // Two or three.
  repeated CardOption options = 4;
  bool write_own = 5;
  // Optional: a retry with the same key drafts nothing new.
  string idempotency_key = 6;
}

message DraftCardResponse {
  string decision_id = 1;
  // RFC3339.
  string expires_at = 2;
}

message PublishEventResponse {
  string id = 1;
  bool trusted = 2;
  int32 hops = 3;
}

// SubmitReviewRequest is a reviewer definition session's one review of the PR
// its thread is about (docs/adr/0082 slice 5). core checks the session may
// post it and relays it to ProvisionerService.PostReview.
message SubmitReviewRequest {
  string session_id = 1;
  // owner/name; with pr, must be the session's thread github/<owner>/<repo>/pr/<n>.
  string repo = 2;
  int64 pr = 3;
  // 40 hex.
  string head_sha = 4;
  // "approve" | "changes" | "comment".
  string verdict = 5;
  // At most 60000 characters.
  string body = 6;
  repeated ReviewComment comments = 7;
  // Set by the sidecar inside a standing character's turn (docs/adr/0084 §4): names the entry the review answers.
  string idempotency_key = 8;
}

message SubmitReviewResponse {
  string review_url = 1;
  // The event GitHub got: APPROVE | REQUEST_CHANGES | COMMENT.
  string event = 2;
}

// SpawnWorkerRequest is a standing character starting one single-shot run of a definition on its spawns.allow list
// (docs/adr/0084 §6). The run is T1, its owner is the character, and its depth is 1.
message SpawnWorkerRequest {
  string session_id = 1;
  string definition = 2;
  string input = 3;
  // A retry with the same key starts nothing new. Required.
  string idempotency_key = 4;
}

message SpawnWorkerResponse {
  // The run's thread: what WaitForResult takes.
  string thread_id = 1;
}

// WaitForSpawnRequest is the character waiting on one of its own spawned runs (docs/adr/0084 §6). Core answers
// only a run this character started. The answer is AgentService's WaitForResultResponse.
message WaitForSpawnRequest {
  string session_id = 1;
  string thread_id = 2;
  // At most 60; 0 answers at once.
  int32 wait_seconds = 3;
}

// OpenIssueRequest is a character opening a GitHub issue in a repo its definition owns (docs/adr/0084 §6).
message OpenIssueRequest {
  string session_id = 1;
  // owner/name, one of the definition's owns.repos.
  string repo = 2;
  string title = 3;
  string body = 4;
  string idempotency_key = 5;
}

message OpenIssueResponse {
  string url = 1;
}

// ListResponderCardsRequest reads the owner's alert cards and the remediations the first responders filed
// (docs/adr/0084 §5). Never pushed: the character calls it.
message ListResponderCardsRequest {
  string session_id = 1;
  // RFC3339; empty is the last 24 hours.
  string since = 2;
  // At most 50; 0 is 20.
  int32 limit = 3;
}

// ResponderCard is core-resolved typed fields only: never the agent's claim, a free label, an annotation value or
// alert text. ask is the card's own text, which core wrote from enums, numbers and object ids.
message ResponderCard {
  string id = 1;
  // "card" or "remediation".
  string kind = 2;
  // A card: open | answered | withdrawn | expired | stale. A remediation: pending | pulled | done | refused | lost.
  string state = 3;
  // A card's text. Empty for a remediation.
  string ask = 4;
  // A remediation: the catalogue action and its target (<namespace>/<name>), the responder that selected it.
  string action = 5;
  string target = 6;
  string responder = 7;
  string created_at = 8;
}

// SpeakRequest is a standing character's line for the owner's browser (docs/adr/0084 §7).
message SpeakRequest {
  string session_id = 1;
  string text = 2;
  // A short label (lowercase letters, digits, - and _; at most 32); may be empty.
  string face = 3;
  string idempotency_key = 4;
}

message SpeakResponse {
  // False when no owner's browser was watching: the line is dropped, never stored.
  bool delivered = 1;
}

message ListResponderCardsResponse {
  repeated ResponderCard cards = 1;
}

// HeartbeatRequest/Response and SetTaskStatusRequest/Response used to live
// here. Both are deleted in docs/adr/0048.
//
// The heartbeat only ever proved a 30s timer was still firing inside the
// worker — it could not distinguish a healthy session from a wedged one, and
// it was refreshed by the pod being asked to report on itself. Liveness now
// reconciles pod_phase against Kubernetes, which is the actual source of
// truth for whether a pod exists.
//
// SetTaskStatus went with the `status` column. A polymorphic session has no
// computable completion, so the worker was never in a position to report one
// — which is why the old enum's 'done' value never acquired a writer.

message AppendJournalRequest {
  string repo = 1;
  string actor = 2;
  string event_type = 3;
  string payload_json = 4;
  // The writing session's set holds A (ADR-0086 §5): the row stays hidden from
  // journal_search until the owner promotes it.
  bool quarantined = 5;
}

message AppendJournalResponse {}

// AuthorizeMemoryWrite is the sidecar's memory_write asking core first (ADR-0086 §2, §5). Core reads the session's
// stored set: A writes only to quarantine, C without A writes to memory, B alone is refused (agent.rule_of_two).
message AuthorizeMemoryWriteRequest {
  string session_id = 1;
  // As SubmitReviewRequest's: the write that follows the grant is an effect of the turn's entry.
  string idempotency_key = 2;
}

message AuthorizeMemoryWriteResponse {
  bool quarantine = 1; // the write goes to the quarantine repo
}

// JournalEntry also backs dashboard.proto's GetJournal (imported from
// here, same reuse pattern as Session/GetSessionRequest/GetSessionResponse below).
message JournalEntry {
  int64 id = 1;
  string repo = 2;
  string actor = 3;
  string event_type = 4;
  string payload_json = 5;
  string created_at = 6; // RFC3339
  // Written by a session whose set holds A: hidden from journal_search until
  // the owner promotes it (ADR-0086 §5). The console label and the promote path are a follow-up slice.
  bool quarantined = 7;
}

// SearchJournal is journal_search's backing RPC (docs/adr/0032's deferred
// "feed knowledge_journal back into a session" read path) — Postgres
// full-text search (to_tsvector/ts_rank), not a vector/embedding search.
message SearchJournalRequest {
  string repo = 1; // "" matches every repo
  string query = 2; // "" drops the full-text predicate — plain chronological read
  int32 limit = 3;
  // Bounds on created_at, RFC3339 or YYYY-MM-DD; "" means unbounded.
  // since is inclusive; until is exclusive, EXCEPT that a bare YYYY-MM-DD
  // until covers that whole day (a date names a day, not the instant it
  // starts, so until=2026-08-18 includes the 18th).
  string since = 4;
  string until = 5;
}

message SearchJournalResponse {
  repeated JournalEntry entries = 1;
}

message SaveAgentSessionIdRequest {
  string session_id = 1;
  string agent_session_id = 2;
  string model = 3;
  // The caller pod's lease (docs/adr/0041). Without it this write is keyed
  // by task alone, so a pod that was torn down but is still shutting down
  // can overwrite the identity of the pod that replaced it — and
  // sessions.agent_session_id is precisely what the next resume reads. The
  // sidecar fills it from its own lease (docs/adr/0064); an empty one matches
  // no session (sessions.leaseMatch), so the write is dropped.
  string lease_id = 4;
  // docs/adr/0084 §4: the thread this SDK session id belongs to. Empty or
  // "main" is the session's own agent_session_id; any other thread keeps its
  // own, and an empty agent_session_id clears it.
  string thread_key = 5;
}

message SaveAgentSessionIdResponse {}

// StillHoldsLeaseRequest/Response used to live here — a pre-push check
// against a stale pod finishing work after a reclaim respawned a fresh one.
// Deleted in docs/adr/0048 along with the reclaim that created that race:
// nothing reclaims a session any more, so no second pod is ever spawned for
// one while the first is alive. It had no production caller either way — only
// worker test fakes referenced it.
//
// lease_id itself survives on the session row, guarding SaveAgentSessionId
// below. That guard is still needed because teardown is not synchronous.

// Git diff/branch/elapsed-time/tool-call-summary telemetry, pushed by the
// sidecar on its own schedule — entirely decoupled from agent tool calls
// (docs/adr/0020 point 5's second bullet). Persisted as a
// TRANSCRIPT_ENTRY_TYPE_TOOL_CALL entry, never relayed to Discord.
message PushToolTelemetryRequest {
  string session_id = 1;
  string summary_json = 2;
  // Unified `git diff` output for the paths core asked for on a previous
  // tick, as {"<path>": "<diff>"}. Answers wanted_paths below.
  //
  // NOT persisted. The summary above becomes a transcript row; this does
  // not, and must not: latestToolCallSummary reads the newest TOOL_CALL
  // entry to build the CHANGES panel, so a diff payload landing there
  // empties the panel entirely. Core holds these in memory, which is also
  // exactly what "readable while the pod is alive" means — the working
  // tree is only reachable from inside the pod, so a diff has no meaning
  // once it is gone.
  string file_diffs_json = 3;
}

// The response is the one channel core has for asking the sidecar
// anything. Nothing outside the pod can dial it: the session PVC is
// ReadWriteOnce, the provisioner never mounts it, and core has no cluster
// RBAC at all — so the sidecar is the sole window onto the working tree,
// and this 5s call is the only time it is open. Answering here rather
// than adding an inbound port keeps hub-and-spoke intact (docs/adr/0020
// point 4) and adds no pod-network surface (docs/adr/0056).
message PushToolTelemetryResponse {
  // Repo-relative paths a human has opened in the console and is waiting
  // on a diff for. Bounded by core; the sidecar answers on its next tick.
  repeated string wanted_paths = 1;
}

// The mechanism that lets the sidecar deliver new human input to the
// wrapper live, for streamInput() (docs/adr/0021 point 2) — a genuine
// live feed, not a poll the wrapper initiates on its own schedule.
message StreamHumanMessagesRequest {
  string session_id = 1;
  int64 since_seq = 2;
  // The GetSessionResponse.agent_spec_sha this worker applied. Required, and
  // must be current, for a definition session (docs/adr/0066 §8); ignored
  // for a repo session.
  string agent_spec_sha = 3;
}

// --- sidecar -> core: shared file space, agent-facing (docs/adr/0030) ---
// Reuses files.proto's message shapes verbatim — the same cross-file reuse
// ListWorktrees/DeleteWorktree also rely on.

// --- sidecar -> core: worker spans (docs/adr/0081 §7) ---

// One finished operation the worker timed: a turn, or a tool call inside it.
// Names, ids and numbers only; the worker sends no content. Everything that
// says WHO (the session, the service) comes from core, never from here.
message WorkerSpan {
  string name = 1;
  // Ids are the worker's own and mean nothing outside this request: core
  // mints fresh span ids and resolves parent_local_id only against the
  // other spans in the same request.
  string local_id = 2;
  string parent_local_id = 3;
  int64 start_unix_nano = 4;
  int64 end_unix_nano = 5;
  WorkerSpanStatus status = 6;
  map<string, string> attributes = 7;
  map<string, int64> int_attributes = 8;
  // Stable across pods for one turn (the SDK result uuid or the transcript
  // seq), never a per-pod counter. With the session id it names the trace.
  string turn_key = 9;
}

enum WorkerSpanStatus {
  WORKER_SPAN_STATUS_UNSPECIFIED = 0;
  WORKER_SPAN_STATUS_OK = 1;
  WORKER_SPAN_STATUS_ERROR = 2;
}

message ExportSpansRequest {
  // Used only by the auth binder to prove the caller's own session; it is
  // the trace's session attribute too, because the lease vouched for it.
  string session_id = 1;
  repeated WorkerSpan spans = 2;
}

message ExportSpansResponse {
  // How many spans core queued. The rest hit a cap or the queue; not an error.
  int32 accepted = 1;
}

// --- Log querying (Loki queries, docs/adr/0013) ---

message QueryLogsRequest {
  string session_id = 1;        // Optional - for fleet components
  string namespace = 2;       // Default "agent-fleet"
  string component = 3;       // worker|sidecar|core|provisioner|e2e|app
  string app_name = 4;        // Optional - for component="app"
  string level = 5;           // debug|info|warn|error (empty = all)
  string start_time = 6;      // RFC3339, inclusive
  string end_time = 7;        // RFC3339, exclusive
  int32 limit = 8;            // Max entries (default 100, max 1000)
}

message LogEntry {
  string timestamp = 1;       // RFC3339
  string level = 2;
  string msg = 3;
  string component = 4;
  string pod_name = 5;
  string namespace = 6;
  string fields_json = 7;     // Other slog fields as JSON
}

message QueryLogsResponse {
  repeated LogEntry entries = 1;
  int32 total_count = 2;
}

// For agents via MCP tool - supports both duration and explicit timestamps
message ViewLogsRequest {
  string component = 1;       // Required
  string app_name = 2;        // Optional
  string namespace = 3;       // Optional (default "agent-fleet")
  string level = 4;           // Optional (empty = all)
  string duration = 5;        // "1h"|"30m"|"24h" (default "1h") - ignored if start_time set
  int32 limit = 6;            // Default 50, max 1000
  string start_time = 7;      // Optional: RFC3339 timestamp, overrides duration
  string end_time = 8;        // Optional: RFC3339 timestamp (default: now)
}

message ViewLogsResponse {
  string logs_text = 1;       // Formatted for agent consumption
}

service CoreService {
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  rpc ReportPodEvents(stream PodEvent) returns (ReportPodEventsResponse);

  // Shares AppendResponse with DashboardService's three append RPCs — see
  // that message's comment. buf's default is one response type per RPC;
  // this repo already overrides that wherever two RPCs are genuinely the
  // same shape (GetSession and SetPermissionMode below do the same).
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc SendMessage(SendMessageRequest) returns (AppendResponse);
  // Reuses transcript.proto's ReadTranscriptSinceRequest/Response, same
  // precedent dashboard.proto already set for GetTranscript.
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc WaitForMessages(ReadTranscriptSinceRequest) returns (ReadTranscriptSinceResponse);
  rpc AskUserQuestion(AskUserQuestionRequest) returns (AskUserQuestionResponse);

  // RequestE2eEnv/KillE2eEnv are gone with the sandbox (docs/adr/0048 §6),
  // as ListE2eTools/CallE2eTool went with the relay before them
  // (docs/adr/0045). What survives is the part that was never about a second
  // pod: two capabilities needing cluster RBAC, which core forwards to the
  // provisioner because the session pod holds none.
  //
  // These are NOT passthroughs of the kind docs/adr/0045 deleted. Core is the
  // only holder of the session row, so it is the only thing that can answer
  // "which repo is this session on" for RequestService, and lifecycle
  // commands to the provisioner route through core by decision
  // (docs/adr/0020 point 4) — a Service and a route are pod lifecycle.
  rpc Expose(ExposeRequest) returns (ExposeResponse);
  rpc Unexpose(UnexposeRequest) returns (UnexposeResponse);
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc RequestService(RequestServiceRequest) returns (RequestServiceResponse);

  // Lets a worker pod fetch its own fresh session row on startup instead of
  // relying on stale environment variables — same message shapes
  // DashboardService.GetTask uses, different caller (docs/adr/0029).
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  // A worker pod persisting its own permission mode (initial "default", the
  // mode the SDK actually launched in when it refused the requested one, or a
  // change it made itself) — a plain column write, unlike
  // DashboardService.SetPermissionMode which also notifies a *different*,
  // already-running worker via the transcript.
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc SetPermissionMode(SetPermissionModeRequest) returns (SetPermissionModeResponse);
  // A worker pod relabelling its own session's title/description. Plain column
  // write, no transcript append — the caller IS the session (mirrors this
  // service's SetPermissionMode, not DashboardService's cross-worker notify).
  rpc UpdateSessionMeta(UpdateSessionMetaRequest) returns (UpdateSessionMetaResponse);
  // Heartbeat, SetTaskStatus and StillHoldsLease used to be here. All three
  // are deleted in docs/adr/0048 — see their message definitions above for
  // why each stopped being a question worth asking.
  rpc AppendJournal(AppendJournalRequest) returns (AppendJournalResponse);
  rpc AuthorizeMemoryWrite(AuthorizeMemoryWriteRequest) returns (AuthorizeMemoryWriteResponse);
  rpc SearchJournal(SearchJournalRequest) returns (SearchJournalResponse);
  rpc SaveAgentSessionId(SaveAgentSessionIdRequest) returns (SaveAgentSessionIdResponse);
  rpc PushToolTelemetry(PushToolTelemetryRequest) returns (PushToolTelemetryResponse);
  // Worker spans, relayed by the sidecar (docs/adr/0081 §7). Session-only.
  rpc ExportSpans(ExportSpansRequest) returns (ExportSpansResponse);
  // Streams transcript.proto's TranscriptEntry directly, same precedent
  // dashboard.proto's StreamTranscript already set.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc StreamHumanMessages(StreamHumanMessagesRequest) returns (stream TranscriptEntry);

  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc GetFileUploadUrl(GetFileUploadUrlRequest) returns (GetFileUploadUrlResponse);
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc GetFileDownloadUrl(GetFileDownloadUrlRequest) returns (GetFileDownloadUrlResponse);
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
  rpc ViewLogs(ViewLogsRequest) returns (ViewLogsResponse);

  // Inter-agent coordination (docs/adr/0041). Hub-and-spoke per
  // docs/adr/0020 point 4: the path is agent -> its own sidecar (MCP) ->
  // core (here) -> the target session. There is no worker-to-worker link
  // and no worker-to-provisioner link.
  rpc ListPeerSessions(ListPeerSessionsRequest) returns (ListPeerSessionsResponse);
  rpc PromptSession(PromptSessionRequest) returns (PromptSessionResponse);
  rpc WaitForSessionState(WaitForSessionStateRequest) returns (WaitForSessionStateResponse);

  // Publishes an event to the bridge as the calling definition session
  // (docs/adr/0078 §8). Only for a definition granting publish_event.
  rpc PublishEvent(PublishEventRequest) returns (PublishEventResponse);

  // Spends a one-time grant (docs/adr/0082 §5): a human's allow of a grantable permission request of this session,
  // for this tool and this exact input. Each grant lets one call through, once.
  rpc ConsumeGrant(ConsumeGrantRequest) returns (ConsumeGrantResponse);

  // Drafts a decision card in the calling definition session's thread (docs/adr/0082 §5). Only for a definition
  // granting draft_card. It does not wait: the owner's choice arrives later as a message.
  rpc DraftCard(DraftCardRequest) returns (DraftCardResponse) {
    option (ukubi.errors.v1.keys) = "core.card_budget";
  }

  // Posts the calling reviewer session's review of its PR (docs/adr/0082 slice 5). Only for a definition granting
  // submit_review.
  rpc SubmitReview(SubmitReviewRequest) returns (SubmitReviewResponse);

  // Reach for a standing character (docs/adr/0084 §6). Each is granted per definition through sidecarTools.
  // Starts one run of a spawns.allow definition, counted in the definition pool and the character's sub-pool.
  rpc SpawnWorker(SpawnWorkerRequest) returns (SpawnWorkerResponse);
  // The character's own spawned run, long-polled. Shares AgentService's WaitForResultResponse.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc WaitForSpawn(WaitForSpawnRequest) returns (WaitForResultResponse);
  // Opens an issue in one of the definition's owns.repos.
  rpc OpenIssue(OpenIssueRequest) returns (OpenIssueResponse);
  // The first responders' cards and remediations, typed fields only.
  rpc ListResponderCards(ListResponderCardsRequest) returns (ListResponderCardsResponse);
  // One line to the owner's browser on an admin origin (docs/adr/0084 §7). Granted per definition (speak), never on the
  // bridge, wakes nothing, at most 20 lines per turn.
  rpc Speak(SpeakRequest) returns (SpeakResponse);
}

