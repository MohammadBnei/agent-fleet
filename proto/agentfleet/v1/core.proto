syntax = "proto3";
package agentfleet.v1;
option go_package = "github.com/MohammadBnei/agent-fleet/proto/gen/go/agentfleet/v1;agentfleetv1";

import "agentfleet/v1/transcript.proto";
import "agentfleet/v1/provisioner.proto";
import "agentfleet/v1/files.proto";

// core is the gRPC server here — its first (see docs/adr/0020's Context:
// "nothing under fleet-core/ hosts one today"). Two kinds of clients:
// the provisioner (streaming pod-lifecycle events in, ReportPodEvents
// only) and every worker pod's sidecar (everything else — the sidecar's
// local MCP server and wrapper-facing API both funnel through this one
// outbound connection, docs/adr/0020 point 5). core holds the fleet's
// only Postgres credentials (docs/adr/0020 point 1); this service is how
// every other component reaches data that lives there.

// --- provisioner -> core: pushed, not polled (docs/adr/0020 point 3) ---

enum PodPhase {
  POD_PHASE_UNSPECIFIED = 0;
  POD_PHASE_CREATED = 1;
  POD_PHASE_SCHEDULED = 2;
  POD_PHASE_RUNNING = 3;
  POD_PHASE_CRASHED = 4;
  POD_PHASE_TERMINATED = 5;
  // Reported once, immediately when CreateWorkerPod's handler starts —
  // before git clone/worktree/pod-create even begin. Closes the blind
  // spot where a claimed task with a hung or slow provisioning step looked
  // identical to one that hadn't started at all (confirmed live: a task
  // sat claimed for 20+ minutes with zero pod events, indistinguishable
  // from "provisioner never got the call"). `message` carries the current
  // sub-step ("cloning repo", "adding worktree", "creating pod") — no new
  // enum value per sub-step, since the set of steps is provisioner-
  // internal detail, not a state other components branch on.
  POD_PHASE_PROVISIONING = 6;
}

message PodEvent {
  string session_id = 1;
  SessionKind kind = 2;
  PodPhase phase = 3;
  string pod_name = 4;
  string message = 5; // human-readable detail — a crash reason, or (for
                       // POD_PHASE_PROVISIONING) the current sub-step
}

message ReportPodEventsResponse {}

// --- sidecar -> core: agent-facing (proxied MCP-shaped calls) ---

// Mirrors today's send_message MCP tool exactly — reuses transcript.proto's
// types rather than redefining them (same precedent dashboard.proto already
// set for GetTranscript/StreamTranscript).
message SendMessageRequest {
  string session_id = 1;
  string from = 2;
  string text = 3;
  TranscriptEntryType type = 4;
  string idempotency_key = 5; // core mints one server-side if empty
  // Correlates this entry to an earlier one, reusing the reply_to_seq
  // column transcript already has for question/answer and permission
  // pairs. Set by ask_thot so thot's answer points at the question that
  // prompted it — the two can be minutes apart with other messages
  // interleaving, so adjacency alone isn't enough to pair them.
  optional int64 reply_to_seq = 6;
}

// AppendResponse is the one response shape for every RPC whose job is
// "append an entry to a session's transcript": SendMessage here, and
// PostMessage/AnswerQuestion/RespondToPermission on DashboardService.
//
// They are one operation wearing four names — a human message, an agent
// message, an answer, and a permission decision are all a row in
// `transcript` — so they get one shape. The seq is the only thing the
// caller could not compute for itself, and it is the correlation key
// everything else in the fleet keys off.
//
// Deliberately NOT extended to cover every RPC. Three of the four used to
// return `string status = 1` holding a constant the server always set,
// which duplicated the signal Connect's error channel already carries: with
// a status inside a successful response, every caller has to check both,
// and eventually one checks only the wrong one. The rule this settles on is
// narrower and holds: **an RPC returns nothing, or the one thing the caller
// cannot already know.**
message AppendResponse {
  int64 seq = 1;
}

// Appends a QUESTION entry and long-polls for a matching ANSWER up to
// timeout_ms, returning it verbatim if one arrives. A timeout is not an
// error — the caller re-invokes with the same questions to keep waiting.
//
// This one keeps a response body rather than sharing AppendResponse,
// because it genuinely returns something the caller cannot compute: whether
// a human answered, and what they said.
message AskUserQuestionRequest {
  string session_id = 1;
  string questions_json = 2;
  int32 timeout_ms = 3; // default 60000, matching today's handler
}

message AskUserQuestionResponse {
  reserved 1;
  reserved "status";

  // Was `string status = 1` holding "answered"|"pending". A bool, because
  // that is what it always was: a string that looks like a status code
  // invites callers to treat a timeout as a failure, and invites the server
  // to grow a third value nobody handles. Whether a human answered is a
  // yes/no, and the timeout is an ordinary outcome of a long poll.
  bool answered = 4;
  string answers_json = 2; // set only when answered
  // The seq of the question entry this call appended. Stable across
  // re-invocations only if the caller passes the same questions — a
  // re-ask mints a NEW entry with a new seq, which is what makes any
  // control posted against an older one dead.
  int64 question_seq = 3;
}

message RequestE2eEnvRequest {
  string session_id = 1;
  // Shell command that installs deps and starts the app, run via
  // `bash -lc` from the worktree root (e.g. "cd front && bun install &&
  // bun run dev"). Optional — falls back to the resolved profile's own
  // start_cmd when empty (docs/adr/0034).
  string start_cmd = 2;
  // Which named repo_profiles row to resolve — optional, defaults to
  // "e2e" when empty. Lets the agent request a different declared profile
  // (e.g. a repo's "lint" profile) for the same request_e2e_env MCP tool
  // call, reusing this same start_cmd-override pattern (docs/adr/0034).
  string profile = 3;
}

message RequestE2eEnvResponse {
  string preview_url = 1;
  string status = 2;
  // The recipe that actually got used, echoed back so the agent can see it.
  // Before this the worker had no read access to repo_profiles at all: it
  // guessed a start_cmd, its guess silently beat a correct profile, and the
  // preview 502'd with nobody able to say why. An agent that can read the
  // recipe reports "the configured command binds localhost" instead of
  // inventing a replacement for it.
  string resolved_start_cmd = 3;
  string profile_name = 4;
  repeated string tools = 5;    // catalog keys, e.g. "bun-toolchain"
  repeated string services = 6; // "<key>:<scope-mode>", e.g. "postgres:task-scoped"
  // Where to dial the sandbox, passed straight through from the provisioner
  // (docs/adr/0045). core does not build, cache or interpret these — it does
  // not know what MCP is. That is what keeps this a *field* passthrough
  // rather than the *call* passthrough it replaces.
  repeated ServiceEndpoint endpoints = 7;
}

message KillE2eEnvRequest {
  string session_id = 1;
}

message KillE2eEnvResponse {
  bool killed = 1;
}

// Playwright's tool set is discovered at runtime by the e2e pod, not fixed
// — proxied sidecar -> core -> provisioner -> e2e pod (see provisioner.proto's
// matching pair; same message shapes, reused rather than redefined).

// --- sidecar -> core: wrapper-facing (never agent-initiated, docs/adr/0020
// point 5's third responsibility) ---

// Session, GetSessionRequest/Response, and SetPermissionModeRequest/Response
// live here (not dashboard.proto, which imports this file) so CoreService's
// GetSession/SetPermissionMode below and DashboardService's same-named RPCs
// can share one definition — both just return/mutate the session row, no
// dashboard-specific shape needed.
//
// Field numbers 4, 6, 9, 10, 15 and 16 are reserved, not reused: status,
// pr_url, heartbeat_at, retry_count, awaiting_human and kind are all gone in
// docs/adr/0048, and reusing their numbers would let an old client silently
// misread a new field as the one it remembers.
message Session {
  reserved 4, 6, 9, 10, 15, 16;
  reserved "status", "pr_url", "heartbeat_at", "retry_count", "awaiting_human", "kind";

  string id = 1;
  string repo = 2;
  // Human-facing labels only, never part of the prompt. A session's actual
  // instruction is its first transcript entry.
  string description = 3;
  optional string title = 18;

  // Field 5 was thread_id — the Discord thread a task relayed into. Gone
  // with the thread machinery (docs/adr/0048): Discord is outbound-only, so
  // there is no thread to correlate back to.
  reserved 5;
  reserved "thread_id";

  // Pod lifecycle (PodPhase, from ReportPodEvents and core's reconcile
  // loop). With `status` gone this is the fleet's only liveness signal, and
  // the concurrency cap counts exactly these phases.
  optional string pod_phase = 7;
  optional string pod_message = 8;
  optional string last_error = 11;

  // The Claude SDK's own session id (SaveAgentSessionId) — resumable in a
  // fresh pod via `resume:`. Named agent_session_id, not session_id, now
  // that the row itself is a session. Unset until the SDK's first streamed
  // message reports it.
  optional string agent_session_id = 12;
  // Which Claude model this session runs. The worker reads it back on every
  // warm and falls back to the CLAUDE_MODEL env default when unset — it was
  // stored but never returned before, so a per-session model choice silently
  // did nothing.
  optional string model = 22;

  // Last time a transcript entry was appended — the clock the idle sweep and
  // the retention GC both read. RFC3339. Unset for a session with no
  // activity yet.
  optional string last_active_at = 13;

  // The session's current SDK permission mode ("default"|"plan"|
  // "acceptEdits"|"bypassPermissions"|...), so the dashboard's mode picker
  // shows the real active mode instead of guessing. Restored on every warm.
  optional string permission_mode = 14;

  // Session liveness (docs/adr/0040): "" (no live pod) | "working" |
  // "blocked" | "idle" | "done" | "stalled" | "unknown". Derived server-side
  // from the row on every read rather than stored, so it cannot drift; core
  // owns the thresholds, so every client agrees on what "stalled" means
  // instead of each re-implementing the heuristic.
  //
  // This is now the ONLY status. It replaces the 8-value enum whose 'done'
  // value never acquired a writer, because a polymorphic session's
  // completion is not something a machine can compute.
  string live_state = 17;

  // How many decisions are waiting on a human right now: unanswered
  // questions plus pending permission requests.
  //
  // A count, not the old awaiting_human boolean, and that is a bug fix.
  // Permissions are a LIST — parallel tool calls each get their own seq —
  // but the boolean was set and cleared by any single permission_response,
  // so answering one decision marked the session unblocked while others were
  // still waiting, and it would sit stalled with nobody notified.
  int32 pending_decisions = 19;

  // Disk reclaimed by the retention GC: readable, but no longer resumable.
  // The dashboard must not offer Warm when this is set.
  optional string swept_at = 20;
  // The human is finished with this session — the only terminal state,
  // because it is the only one a machine cannot compute.
  optional string archived_at = 21;
}

// What one agent can see of another session. Deliberately not the full
// Session: an agent needs enough to pick a target and know whether it can be
// talked to, not another session's internals.
message SessionSummary {
  string session_id = 1;
  string repo = 2;
  string description = 3;
  string status = 4;
  // See Session.live_state (docs/adr/0040). This is what makes "wait until
  // the other agent is genuinely blocked" expressible at all.
  string live_state = 5;
}

message ListPeerSessionsRequest {
  // The caller's own task, excluded from the results — an agent has no use
  // for a summary of itself and cannot prompt itself anyway.
  string caller_session_id = 1;
}

message ListPeerSessionsResponse {
  repeated SessionSummary sessions = 1;
}

message PromptSessionRequest {
  string caller_session_id = 1;
  string target_session_id = 2;
  string text = 3;
  // Hop count, incremented per relay. Bounded so A->B->A cannot loop
  // forever; an agent never sets this itself, the sidecar does.
  int32 depth = 4;
}

message PromptSessionResponse {
  int64 seq = 1;
  // The target's live state immediately after delivery — usually
  // "working", or "unknown" if a pod was just warmed for it.
  string live_state = 2;
  // Set when delivery warmed an idle session's pod.
  string pod_name = 3;
}

message WaitForSessionStateRequest {
  string target_session_id = 1;
  // Only count a settled state once the target has produced activity newer
  // than this transcript seq. Without it, waiting right after prompting an
  // already-idle target returns instantly with the state it was in BEFORE
  // the prompt — the target hasn't started the new turn yet. herdr solves
  // the same race by requiring an observed state change off a baseline
  // captured before submission. Pass the seq prompt_agent returned; the
  // sidecar fills it in automatically when omitted.
  int64 after_seq = 4;
  // Any of these ends the wait. Empty means the settled set
  // (idle/done/blocked/stalled) — "it stopped needing to be waited on".
  repeated string until = 2;
  int32 timeout_ms = 3;
}

message WaitForSessionStateResponse {
  string live_state = 1;
  bool timed_out = 2;
}

message GetSessionRequest {
  string id = 1;
}

message GetSessionResponse {
  Session session = 1;
}

// Sets an arbitrary SDK permission mode on a task. Reused by two very
// different callers: the dashboard (docs/adr/0027 — a human flipping a
// running session's mode, which also appends a transcript entry the live
// worker reacts to; see dashboard.proto's own SetPermissionMode comment)
// and the sidecar (a worker pod persisting its own initial/current mode on
// startup, no transcript append — CoreService's handler is a plain column
// write, see coreserver's implementation).
message SetPermissionModeRequest {
  string session_id = 1;
  string mode = 2;
}

message SetPermissionModeResponse {}

// HeartbeatRequest/Response and SetTaskStatusRequest/Response used to live
// here. Both are deleted in docs/adr/0048.
//
// The heartbeat only ever proved a 30s timer was still firing inside the
// worker — it could not distinguish a healthy session from a wedged one, and
// it was refreshed by the pod being asked to report on itself. Liveness now
// reconciles pod_phase against Kubernetes, which is the actual source of
// truth for whether a pod exists.
//
// SetTaskStatus went with the `status` column. A polymorphic session has no
// computable completion, so the worker was never in a position to report one
// — which is why the old enum's 'done' value never acquired a writer.

message AppendJournalRequest {
  string repo = 1;
  string actor = 2;
  string event_type = 3;
  string payload_json = 4;
}

message AppendJournalResponse {}

// JournalEntry also backs dashboard.proto's GetJournal (imported from
// here, same reuse pattern as Session/GetSessionRequest/GetSessionResponse below).
message JournalEntry {
  int64 id = 1;
  string repo = 2;
  string actor = 3;
  string event_type = 4;
  string payload_json = 5;
  string created_at = 6; // RFC3339
}

// SearchJournal is journal_search's backing RPC (docs/adr/0032's deferred
// "feed knowledge_journal back into a session" read path) — Postgres
// full-text search (to_tsvector/ts_rank), not a vector/embedding search.
message SearchJournalRequest {
  string repo = 1; // "" matches every repo
  string query = 2;
  int32 limit = 3;
}

message SearchJournalResponse {
  repeated JournalEntry entries = 1;
}

message SaveAgentSessionIdRequest {
  string session_id = 1;
  string agent_session_id = 2;
  string model = 3;
  // The caller pod's lease (docs/adr/0041). Without it this write is keyed
  // by task alone, so a pod that was torn down but is still shutting down
  // can overwrite the identity of the pod that replaced it — and
  // sessions.agent_session_id is precisely what the next resume reads. Empty is
  // accepted for compatibility with a worker image older than this field.
  string lease_id = 4;
}

message SaveAgentSessionIdResponse {}

// StillHoldsLeaseRequest/Response used to live here — a pre-push check
// against a stale pod finishing work after a reclaim respawned a fresh one.
// Deleted in docs/adr/0048 along with the reclaim that created that race:
// nothing reclaims a session any more, so no second pod is ever spawned for
// one while the first is alive. It had no production caller either way — only
// worker test fakes referenced it.
//
// lease_id itself survives on the session row, guarding SaveAgentSessionId
// below. That guard is still needed because teardown is not synchronous.

// Git diff/branch/elapsed-time/tool-call-summary telemetry, pushed by the
// sidecar on its own schedule — entirely decoupled from agent tool calls
// (docs/adr/0020 point 5's second bullet). Persisted as a
// TRANSCRIPT_ENTRY_TYPE_TOOL_CALL entry, never relayed to Discord.
message PushToolTelemetryRequest {
  string session_id = 1;
  string summary_json = 2;
}

message PushToolTelemetryResponse {}

// The mechanism that lets the sidecar deliver new human input to the
// wrapper live, for streamInput() (docs/adr/0021 point 2) — a genuine
// live feed, not a poll the wrapper initiates on its own schedule.
message StreamHumanMessagesRequest {
  string session_id = 1;
  int64 since_seq = 2;
}

// --- sidecar -> core: shared file space, agent-facing (docs/adr/0030) ---
// Reuses files.proto's message shapes verbatim — the same cross-file reuse
// ListWorktrees/DeleteWorktree also rely on.

// --- Log querying (Loki queries, docs/adr/0013) ---

message QueryLogsRequest {
  string session_id = 1;        // Optional - for fleet components
  string namespace = 2;       // Default "agent-fleet"
  string component = 3;       // worker|sidecar|core|provisioner|e2e|app
  string app_name = 4;        // Optional - for component="app"
  string level = 5;           // debug|info|warn|error (empty = all)
  string start_time = 6;      // RFC3339, inclusive
  string end_time = 7;        // RFC3339, exclusive
  int32 limit = 8;            // Max entries (default 100, max 1000)
}

message LogEntry {
  string timestamp = 1;       // RFC3339
  string level = 2;
  string msg = 3;
  string component = 4;
  string pod_name = 5;
  string namespace = 6;
  string fields_json = 7;     // Other slog fields as JSON
}

message QueryLogsResponse {
  repeated LogEntry entries = 1;
  int32 total_count = 2;
}

// For agents via MCP tool - supports both duration and explicit timestamps
message ViewLogsRequest {
  string component = 1;       // Required
  string app_name = 2;        // Optional
  string namespace = 3;       // Optional (default "agent-fleet")
  string level = 4;           // Optional (empty = all)
  string duration = 5;        // "1h"|"30m"|"24h" (default "1h") - ignored if start_time set
  int32 limit = 6;            // Default 50, max 1000
  string start_time = 7;      // Optional: RFC3339 timestamp, overrides duration
  string end_time = 8;        // Optional: RFC3339 timestamp (default: now)
}

message ViewLogsResponse {
  string logs_text = 1;       // Formatted for agent consumption
}

service CoreService {
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  rpc ReportPodEvents(stream PodEvent) returns (ReportPodEventsResponse);

  // Shares AppendResponse with DashboardService's three append RPCs — see
  // that message's comment. buf's default is one response type per RPC;
  // this repo already overrides that wherever two RPCs are genuinely the
  // same shape (GetSession and SetPermissionMode below do the same).
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc SendMessage(SendMessageRequest) returns (AppendResponse);
  // Reuses transcript.proto's ReadTranscriptSinceRequest/Response, same
  // precedent dashboard.proto already set for GetTranscript.
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc WaitForMessages(ReadTranscriptSinceRequest) returns (ReadTranscriptSinceResponse);
  rpc AskUserQuestion(AskUserQuestionRequest) returns (AskUserQuestionResponse);
  rpc RequestE2eEnv(RequestE2eEnvRequest) returns (RequestE2eEnvResponse);
  rpc KillE2eEnv(KillE2eEnvRequest) returns (KillE2eEnvResponse);
  // ListE2eTools/CallE2eTool used to live here — the sandbox tool-call relay.
  // Deleted in docs/adr/0045: the sidecar and core each dial their task's
  // sandbox directly from a ServiceEndpoint roster, so core is no longer in
  // the path of a shell command. RequestE2eEnv/KillE2eEnv above stay, because
  // those are real work only core can do (profile resolution from Postgres,
  // commanding the provisioner) rather than a passthrough.

  // Lets a worker pod fetch its own fresh session row on startup instead of
  // relying on stale environment variables — same message shapes
  // DashboardService.GetTask uses, different caller (docs/adr/0029).
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  // A worker pod persisting its own permission mode (initial "default" or a
  // change it made itself) — a plain column write, unlike
  // DashboardService.SetPermissionMode which also notifies a *different*,
  // already-running worker via the transcript.
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc SetPermissionMode(SetPermissionModeRequest) returns (SetPermissionModeResponse);
  // Heartbeat, SetTaskStatus and StillHoldsLease used to be here. All three
  // are deleted in docs/adr/0048 — see their message definitions above for
  // why each stopped being a question worth asking.
  rpc AppendJournal(AppendJournalRequest) returns (AppendJournalResponse);
  rpc SearchJournal(SearchJournalRequest) returns (SearchJournalResponse);
  rpc SaveAgentSessionId(SaveAgentSessionIdRequest) returns (SaveAgentSessionIdResponse);
  rpc PushToolTelemetry(PushToolTelemetryRequest) returns (PushToolTelemetryResponse);
  // Streams transcript.proto's TranscriptEntry directly, same precedent
  // dashboard.proto's StreamTranscript already set.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc StreamHumanMessages(StreamHumanMessagesRequest) returns (stream TranscriptEntry);

  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc GetFileUploadUrl(GetFileUploadUrlRequest) returns (GetFileUploadUrlResponse);
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc GetFileDownloadUrl(GetFileDownloadUrlRequest) returns (GetFileDownloadUrlResponse);
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
  rpc ViewLogs(ViewLogsRequest) returns (ViewLogsResponse);

  // Inter-agent coordination (docs/adr/0041). Hub-and-spoke per
  // docs/adr/0020 point 4: the path is agent -> its own sidecar (MCP) ->
  // core (here) -> the target session. There is no worker-to-worker link
  // and no worker-to-provisioner link.
  rpc ListPeerSessions(ListPeerSessionsRequest) returns (ListPeerSessionsResponse);
  rpc PromptSession(PromptSessionRequest) returns (PromptSessionResponse);
  rpc WaitForSessionState(WaitForSessionStateRequest) returns (WaitForSessionStateResponse);

}

