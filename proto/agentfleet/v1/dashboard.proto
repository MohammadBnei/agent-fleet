syntax = "proto3";
package agentfleet.v1;
option go_package = "github.com/MohammadBnei/agent-fleet/proto/gen/go/agentfleet/v1;agentfleetv1";

import "agentfleet/v1/transcript.proto";
import "agentfleet/v1/files.proto";
import "agentfleet/v1/core.proto";

// The web dashboard's API (see docs/adr/0015) — served over ConnectRPC by
// fleet-core, consumed by a generated connect-web client in dashboard/.
// Reuses transcript.proto's TranscriptEntry/ReadTranscriptSinceRequest/
// ReadTranscriptSinceResponse rather than redefining them: that message
// set was placed there anticipating exactly this "non-MCP client" (see
// transcript.proto's own comment, docs/adr/0013). Field names are
// snake_case here per proto convention; generated TS/JS renders them
// camelCase (e.g. thread_id -> threadId).

// Session, GetSessionRequest, and GetSessionResponse now live in core.proto (which
// this file already imports) — CoreService.GetTask (sidecar/worker
// self-lookup) and DashboardService.GetTask below share the same shapes.

message ListSessionsRequest {
  int32 limit = 1;
  // Full-text search over session labels (repo/title/description) and
  // transcript text. Empty = no filter (default listing order).
  string query = 2;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

// Creates a session row and NOTHING else — no pod, no directory, no worktree.
// `repo` must name a row in the repos table (docs/adr/0028); title and
// description are optional labels that never enter the prompt.
//
// The pod is booted by the first PostMessage, not here, and that split is
// load-bearing (docs/adr/0048): nothing machine-initiated produces a message,
// so nothing machine-initiated produces a pod. It also means an empty session
// is a valid resting state rather than a broken one — which matters because
// the Agent SDK's streaming-input generator is never entered until an input
// arrives, so a pod started with nothing to do would never emit a session id,
// would be unresumable, and would be swept by the startup-stall guard with
// nothing logged to explain it.
//
// Fields 3 and 5 are reserved. snippet_ids used to be resolved server-side
// into a hidden `guidance` column; snippets now prefill the dashboard's
// message composer instead, so their text reaches the model as part of a
// message a human actually sent and can edit — rather than as a wrapper the
// agent cannot see or question. `kind` was a UI label the dispatch path never
// branched on; a thot session is distinguished by its repo carrying
// cluster_access, which is the thing that is actually true about it.
message CreateSessionRequest {
  reserved 3, 5;
  reserved "snippet_ids", "kind";

  string repo = 1;
  string description = 2;
  optional string model = 4;
  optional string title = 6;
}

message CreateSessionResponse {
  Session session = 1;
}

// Streamed directly as `stream TranscriptEntry` on the RPC below — no
// wrapper response message, unlike the unary GetTranscript (which reuses
// transcript.proto's ReadTranscriptSinceResponse).
message StreamTranscriptRequest {
  string session_id = 1;
  int64 since_seq = 2;
}

// The e2e card's whole message set lived here: GetE2eStatus* (live pod phase,
// preview URL and the resolved recipe), StartE2e*/RestartE2eApp* (starting the
// app for a human, since only the agent could otherwise), and GetE2eAppLog*
// (the app's stdout, the first thing to read when a preview 502'd).
//
// All of it is gone with the sandbox (docs/adr/0048 §6). The app runs in the
// session's own pod, started by the agent with Bash, and what a human wants
// from it — a URL — the agent produces with expose().

message StopSessionRequest {
  string session_id = 1;
  optional string reason = 2;
}

message StopSessionResponse {}

// Interrupt stops only the current turn (the in-flight API exchange/tool
// call) via the SDK's own q.interrupt() — unlike Kill, the session and pod
// survive and stay ready for the next message. Posted as a distinct
// "interrupt" transcript entry (never "abort") so the worker can tell the
// two apart and only Kill tears the whole session down.
message InterruptRequest {
  string session_id = 1;
}

message InterruptResponse {}

// Sets an arbitrary SDK permission mode on a running task (docs/adr/0027,
// extended by the sessions redesign supersession of docs/adr/0021/0025 —
// Approve is gone, this is now the only mode lever). `mode` must be one of
// "default"|"plan"|"acceptEdits"|"auto"|"dontAsk" (validated server-side).
// "auto" is what plan approval sets, and the one that grants real authority:
// the worker allows everything but `rm`/`sudo` in it without asking
// (docs/adr/0053), so the dashboard puts it behind a confirm.
// "bypassPermissions" is gone — it bought only those two commands over "auto"
// and charged a launch profile for them; db/migrations/000004 rewrites any
// stored row. SetPermissionModeRequest/Response now live in
// core.proto, shared with CoreService.SetPermissionMode (the sidecar's
// self-report use case — see that file's comment on why the two callers
// need different server-side behavior despite the shared message shapes).

// Warm boots a pod for an idle session on demand — the sessions redesign's
// "bus" model (supersedes docs/adr/0021/0025's phase-boundary framing): a
// task's pod is ephemeral compute, not tied to the task's whole lifetime.
// Deliberately does not touch the deleted status column (a loose UI-freshness signal
// now, not control flow) — session state is the worktree + saved
// session_id, both of which already survive teardown. Rejected with
// CodeFailedPrecondition if the task already has a live pod (idempotent
// double-click guard) or the fleet is already at MAX_LIVE_SESSIONS.
// Records that a human opened this session's detail view — what turns a
// `done` live_state (finished while nobody was looking) back into `idle`.
// Deliberately an explicit call rather than a side effect of GetTask: the
// task list polls, and a poll marking everything seen would make `done`
// unreachable.
message MarkSeenRequest {
  string session_id = 1;
}

message MarkSeenResponse {}

message WarmSessionRequest {
  string session_id = 1;
}

message WarmSessionResponse {
  reserved 1;
  reserved "status"; // was always the constant "warming"

  // Empty when the session already had a live pod — an ordinary idempotent
  // outcome, not an error, since PostMessage calls this unconditionally on
  // every message.
  string pod_name = 2;
}

// A machine-initiated suggestion, from an Alertmanager webhook or the audit
// scheduler (docs/adr/0048). Proposals live in their own table with no pod
// path at all — that is what makes "a machine may propose, never open"
// structural, rather than a status value that dispatch politely declines to
// SELECT.
message Proposal {
  string id = 1;
  string repo = 2;
  string source = 3; // "alert" | "audit"
  string title = 4;
  string body = 5;
  string created_at = 6;
  // Set once a human opened it; the session it became.
  optional string session_id = 7;
}

message ListProposalsRequest {}

message ListProposalsResponse {
  // Open proposals only: neither opened nor dismissed.
  repeated Proposal proposals = 1;
}

// Turns a proposal into a real session. THE human gate — this is the one
// call that can hand a cluster-access agent a pod, so it is reachable only
// from the dashboard, behind the same Traefik basic-auth as everything else.
// Replaces ApproveTask, which flipped a status value to release a task into
// the dispatch queue.
//
// Guarded inside the UPDATE rather than read-then-write, for the reason the
// old ApproveProposal gave and which still applies: two clicks, two humans,
// or one stale browser tab must not open two sessions from one proposal.
// Rejected with CodeFailedPrecondition if it is already opened or dismissed.
//
// Creates the session but does NOT boot a pod — the proposal body is posted
// as the session's first message, and that is what provisions. So a human
// can open a proposal, read it, and still walk away without an agent having
// run.
message OpenFromProposalRequest {
  string proposal_id = 1;
}

message OpenFromProposalResponse {
  Session session = 1;
}

// Declines a proposal. Dismissing re-arms the dedup key, so a still-firing
// alert is proposed again on its next fire — "not now", not "never".
// Permanent suppression is an Alertmanager silence, which is where that
// decision belongs.
message DismissProposalRequest {
  string proposal_id = 1;
}

message DismissProposalResponse {}

// The human is finished with this session. The only terminal state in the
// fleet, because it is the only one a machine cannot compute: a session may
// end in a PR, or in an explanation, or in a dead end, and nothing but a
// person can tell those apart.
//
// Tears down any live pod and reclaims the session's directory and SDK
// state, so an archived session is readable but no longer resumable.
message ArchiveSessionRequest {
  string session_id = 1;
}

message ArchiveSessionResponse {}

// Answers a pending PERMISSION_REQUEST-type transcript entry (posted by
// canUseTool for any tool call the SDK's current permission mode would
// prompt for — supersedes docs/adr/0021's Write/Edit-absent-from-
// allowedTools gate). `seq` is that entry's own seq, carried the same way
// AnswerQuestion's is — for the dashboard's own bookkeeping, not required
// for correlation server-side. A sibling RPC to AnswerQuestion rather than
// overloading it: the payload shape differs (allow/deny/updatedInput vs.
// free-form answers JSON) and there's no real code to share beyond one
// AppendReply call either way.
message RespondToPermissionRequest {
  string session_id = 1;
  int64 seq = 2;
  string decision_json = 3;
}

message KillE2eRequest {
  string session_id = 1;
  // also_teardown_services (docs/adr/0034 follow-up): also delete the
  // repo's shared postgres/redis instances if this task used any —
  // human-confirmed opt-in, since those are shared across every task
  // against the repo, not owned by this one task alone.
  bool also_teardown_services = 2;
}

message KillE2eResponse {
  bool killed = 1;
  repeated string services_torn_down = 2;
}

// Answers a pending QUESTION-type transcript entry (posted by the agent's
// AskUserQuestion MCP tool call, see docs/adr/0018). `seq` is that entry's
// own seq — carried for the dashboard's own bookkeeping/idempotency, not
// required for correlation server-side (only one question is ever pending
// per task at a time, since the agent's tool call blocks on it).
// `answers_json` is a JSON-encoded {"answers": {"<question>": "<label>"}}
// payload, opaque to fleet-core — it's appended verbatim as the answer
// entry's `text` and returned verbatim to the blocked MCP tool call.
message AnswerQuestionRequest {
  string session_id = 1;
  int64 seq = 2;
  string answers_json = 3;
}

// Discuss lets a human send an arbitrary free-text message from the
// dashboard, full parity with a Discord thread reply — appended as a
// "discussion" transcript entry, picked up by the worker's existing
// streamHumanMessages SSE the same way a Discord reply already is (no
// worker/sidecar changes needed, it's a plain cursor-based transcript
// stream, not Discord-specific). `from`/`type` are hardcoded server-side,
// same pattern as Kill hardcoding "human"/"abort" — the dashboard has no
// need to expose them.
message PostMessageRequest {
  string session_id = 1;
  string text = 2;
}

// Soft-deletes the task (see db/schema.sql's tasks.deleted_at) after
// force-tearing down any live worker/e2e pod — unlike Kill, which only
// posts an "abort" transcript entry the worker pod must be alive and
// cooperative to react to, this calls ProvisionerService.TearDownSession
// directly so a wedged/crashed pod doesn't block removal. Doesn't touch
// `status` — a `done` task stays `done`, it just stops appearing in
// ListTasks.
message DeleteSessionRequest {
  string session_id = 1;
}

message DeleteSessionResponse {}

// WorktreeView and ListWorktreesViewResponse backed the worktrees page: the
// provisioner's directory listing left-joined against `sessions`, so an
// orphaned directory could be spotted and deleted by hand.
//
// There are no worktrees (docs/adr/0048 §5). A session's tree is its own PVC,
// deleted with the session by the retention GC, so there is nothing to list
// and nothing to orphan.

// GetJournal is the read path reliability-findings.md #1/#7 both call out
// as missing — knowledge_journal had no Get/List RPC anywhere, so even a
// journaled crash event was invisible without direct Postgres access.
// Typed request/response, same pull/cursor shape as GetTranscript, not a
// generic Query(bytes) returns (bytes) dispatcher — two concrete gaps
// don't justify throwing away protobuf's type safety for a general one.
// JournalEntry itself now lives in core.proto (imported above) — reused by
// SearchJournal too, same pattern as Session/GetSessionRequest/GetSessionResponse.
message GetJournalRequest {
  string repo = 1; // "" matches every repo
  int64 since_id = 2;
  int32 limit = 3;
}

message GetJournalResponse {
  repeated JournalEntry entries = 1;
  int64 next_id = 2;
}

// Repo is the dashboard-editable target-repo config (docs/adr/0028) —
// replaces the hardcoded tasks.KnownRepos Go map, backed by the `repos`
// table (db/schema.sql). No timestamps exposed: the dashboard's repo list
// is small and unordered, unlike Session/JournalEntry which need cursor state.
message Repo {
  reserved 4;
  reserved "e2e_profile";

  string name = 1;
  string url = 2;
  string base_branch = 3; // "" means the provisioner defaults to "main"
  // Container image this repo's sessions run. "" means the fleet default.
  // Replaces the four toolchain ingredients of docs/adr/0034's recipe
  // system — an init container copying a Go toolchain onto an emptyDir was
  // an elaborate way of saying "this repo needs Go".
  string image = 5;
  // Whether this repo's sessions get the kubectl shim that RPCs to
  // thot-executor (docs/adr/0037). The one recipe ingredient that did NOT
  // collapse into `image`, because it is a privilege grant rather than a
  // toolchain — the pod still holds zero Kubernetes credentials either way,
  // and which sessions may reach the cluster stays a human's decision,
  // editable here without a redeploy.
  bool cluster_access = 6;
}

message ListReposRequest {}

message ListReposResponse {
  repeated Repo repos = 1;
}

message CreateRepoRequest {
  string name = 1;
  string url = 2;
  string base_branch = 3;
  reserved 4;
  reserved "e2e_profile";
  string image = 5;
  bool cluster_access = 6;
}

message CreateRepoResponse {
  Repo repo = 1;
}

message UpdateRepoRequest {
  string name = 1;
  string url = 2;
  string base_branch = 3;
  reserved 4;
  reserved "e2e_profile";
  string image = 5;
  bool cluster_access = 6;
}

message UpdateRepoResponse {
  Repo repo = 1;
}

message DeleteRepoRequest {
  string name = 1;
}

message DeleteRepoResponse {}

// RepoProfile and its four CRUD message pairs used to live here — the
// dashboard-editable environment recipe from docs/adr/0034, carrying a
// start_cmd, a set of tool_keys and service ingredients.
//
// Deleted in docs/adr/0048. The recipe stored, in Postgres, knowledge that
// lives in the working tree the agent is already sitting in: `cat
// package.json` answers "how do I start this app", and the agent starts its
// own server now. The three ingredient kinds each went somewhere different:
//
//   start_cmd            -> the agent runs it, and calls expose(port)
//   toolchain tool_keys  -> repos.image, one column instead of an init
//                           container copying a Go toolchain onto an emptyDir
//   service_ingredients  -> request_service(kind), which stays fleet-side
//                           because it needs cluster RBAC the agent has not
//
// The one tool_key that did NOT collapse is cluster-access, because it is a
// privilege grant rather than a toolchain — it is repos.cluster_access now,
// still data rather than code for docs/adr/0037's own reason: which sessions
// may reach the cluster is a human's decision, editable without a redeploy.

// PromptSnippet is dashboard-editable, reusable guidance text (same
// no-redeploy pattern as Repo above), backed by the `prompt_snippets`
// table (db/schema.sql). An operator optionally attaches a set of these to
// a task at creation time (CreateSessionRequest.snippet_ids) — replaces
// worker/src/session.ts's old unconditional, hardcoded workflow prompt. A
// task's base prompt is just its own description; anything more is one of
// these, picked per task, not forced on every task regardless of size.
message PromptSnippet {
  string id = 1;
  string name = 2;
  string text = 3;
  optional string suggested_permission_mode = 4;
}

message ListPromptSnippetsRequest {}

message ListPromptSnippetsResponse {
  repeated PromptSnippet snippets = 1;
}

message CreatePromptSnippetRequest {
  string name = 1;
  string text = 2;
}

message CreatePromptSnippetResponse {
  PromptSnippet snippet = 1;
}

message UpdatePromptSnippetRequest {
  string id = 1;
  string name = 2;
  string text = 3;
}

message UpdatePromptSnippetResponse {
  PromptSnippet snippet = 1;
}

message DeletePromptSnippetRequest {
  string id = 1;
}

message DeletePromptSnippetResponse {}

// --- shared file space, human-facing (docs/adr/0030) ---
// Reuses files.proto's message shapes verbatim — same reuse precedent
// ListWorktrees/DeleteWorktree already set with provisioner.proto.

service DashboardService {
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  // Reuses transcript.proto's ReadTranscriptSinceRequest/Response rather
  // than duplicating a byte-identical message pair.
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc GetTranscript(ReadTranscriptSinceRequest) returns (ReadTranscriptSinceResponse);
  // Streams transcript.proto's TranscriptEntry directly rather than
  // wrapping it in a redundant StreamTranscriptResponse.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc StreamTranscript(StreamTranscriptRequest) returns (stream TranscriptEntry);
  rpc StopSession(StopSessionRequest) returns (StopSessionResponse);
  rpc Interrupt(InterruptRequest) returns (InterruptResponse);
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc SetPermissionMode(SetPermissionModeRequest) returns (SetPermissionModeResponse);
  rpc WarmSession(WarmSessionRequest) returns (WarmSessionResponse);
  rpc MarkSeen(MarkSeenRequest) returns (MarkSeenResponse);
  rpc ArchiveSession(ArchiveSessionRequest) returns (ArchiveSessionResponse);
  rpc ListProposals(ListProposalsRequest) returns (ListProposalsResponse);
  rpc OpenFromProposal(OpenFromProposalRequest) returns (OpenFromProposalResponse);
  rpc DismissProposal(DismissProposalRequest) returns (DismissProposalResponse);
  // AnswerQuestion, RespondToPermission and PostMessage all mean "append an
  // entry to this session's transcript" — a human answer, a permission
  // decision, and a free-text message are the same row with different types.
  // All three returned a constant `status` string until docs/adr/0048; they
  // now return the seq, which is the one thing the caller cannot compute and
  // is the correlation key everything else keys off.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc AnswerQuestion(AnswerQuestionRequest) returns (AppendResponse);
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc RespondToPermission(RespondToPermissionRequest) returns (AppendResponse);
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc PostMessage(PostMessageRequest) returns (AppendResponse);
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);
  // Reuses provisioner.proto's ListWorktreesRequest (identical shape,
  // empty) and DeleteWorktreeRequest/Response (identical shape, no
  // dashboard-specific fields needed) — same passthrough-reuse pattern
  // core.proto's ListE2eTools/CallE2eTool already established. The
  // response is enriched with a left-join against `sessions`, so it can't
  // reuse provisioner's own WorktreeInfo/ListWorktreesResponse as-is.
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc GetJournal(GetJournalRequest) returns (GetJournalResponse);
  rpc ListRepos(ListReposRequest) returns (ListReposResponse);
  rpc CreateRepo(CreateRepoRequest) returns (CreateRepoResponse);
  rpc UpdateRepo(UpdateRepoRequest) returns (UpdateRepoResponse);
  rpc DeleteRepo(DeleteRepoRequest) returns (DeleteRepoResponse);
  rpc ListPromptSnippets(ListPromptSnippetsRequest) returns (ListPromptSnippetsResponse);
  rpc CreatePromptSnippet(CreatePromptSnippetRequest) returns (CreatePromptSnippetResponse);
  rpc UpdatePromptSnippet(UpdatePromptSnippetRequest) returns (UpdatePromptSnippetResponse);
  rpc DeletePromptSnippet(DeletePromptSnippetRequest) returns (DeletePromptSnippetResponse);

  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc GetFileUploadUrl(GetFileUploadUrlRequest) returns (GetFileUploadUrlResponse);
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc GetFileDownloadUrl(GetFileDownloadUrlRequest) returns (GetFileDownloadUrlResponse);
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
  // Reuses core.proto's QueryLogsRequest/QueryLogsResponse
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc QueryLogs(QueryLogsRequest) returns (QueryLogsResponse);

  // Observability page (docs/adr/0047). QueryMetrics is core proxying
  // PromQL — Prometheus has no IngressRoute in this cluster, so a browser
  // cannot reach it directly. GetFleetTopology is the live cell view, and
  // needs no cluster RBAC: core assembles it from the sessions table it
  // already owns plus its own metrics.
  rpc QueryMetrics(QueryMetricsRequest) returns (QueryMetricsResponse);
  rpc GetFleetTopology(GetFleetTopologyRequest) returns (GetFleetTopologyResponse);



  // Dashboard-editable schedules (docs/adr/0035) — same "edit it in the
  // UI, no redeploy" shape ListRepos/CreateRepo established. Renamed from
  // *ScheduledAudit* when the repo stopped being a hardcoded constant.
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse);
  rpc CreateSchedule(CreateScheduleRequest) returns (CreateScheduleResponse);
  rpc UpdateSchedule(UpdateScheduleRequest) returns (UpdateScheduleResponse);
  rpc DeleteSchedule(DeleteScheduleRequest) returns (DeleteScheduleResponse);
  rpc RunScheduleNow(RunScheduleNowRequest) returns (RunScheduleNowResponse);
}

// Fires a schedule out of band rather than adding a second dispatch path: it
// raises the run_now flag and nudges the existing loop, so the run itself goes
// through exactly the same claim → file-proposal path a scheduled one does
// (including the dedup that skips it while a previous run is still open).
//
// A flag, not `next_run_at = now()`: moving the cursor would swallow the next
// cron occurrence, so pressing this on a Sunday would cost the schedule its
// Monday run.
message RunScheduleNowRequest {
  string id = 1;
}

message RunScheduleNowResponse {
  Schedule schedule = 1;
}

// RetryTaskRequest/Response used to live here — the only path back from
// failed_permanently, which the automatic reclaim could drive a task into
// with no way out. Deleted in docs/adr/0048 along with the reclaim, the
// retry counter and the terminal status itself: there is no dead state to
// resurrect a session from, so retrying is just sending it another message.

// Exactly one of cron / interval_seconds is set, or neither — in which case
// the schedule is one-shot and fires once at run_at.
//
// Plain scalars rather than `optional`: proto3 optional moves a field into a
// synthetic oneof, which is its own wire break, and both fields already have
// an unambiguous unset value ("" and 0 — the column CHECK forbids an interval
// below 60).
message Schedule {
  string id = 1;
  string name = 2;
  // Which repo the proposal (and so the session a human opens from it) targets.
  // This was a Go constant until the schedules table existed.
  string repo = 3;
  string prompt = 4;
  // Standard 5-field cron, optionally prefixed `CRON_TZ=Europe/Paris ` — which
  // is why there is no separate timezone field.
  string cron = 5;
  int32 interval_seconds = 6;
  bool enabled = 7;
  string next_run_at = 8;
  string last_run_at = 9;
  string last_status = 10;
  // A human's pending "run now", cleared when the loop picks it up.
  bool run_now = 11;
}

message ListSchedulesRequest {}

message ListSchedulesResponse {
  repeated Schedule schedules = 1;
}

message CreateScheduleRequest {
  string name = 1;
  string repo = 2;
  string prompt = 3;
  string cron = 4;
  int32 interval_seconds = 5;
  // When both cron and interval_seconds are unset: the single moment this
  // schedule fires, RFC3339. Without it on the wire a one-shot would inherit
  // the column default and fire on the next tick regardless of what the human
  // typed.
  string run_at = 6;
}

message CreateScheduleResponse {
  Schedule schedule = 1;
}

message UpdateScheduleRequest {
  string id = 1;
  string name = 2;
  string repo = 3;
  string prompt = 4;
  string cron = 5;
  int32 interval_seconds = 6;
  bool enabled = 7;
  string run_at = 8;
}

message UpdateScheduleResponse {
  Schedule schedule = 1;
}

message DeleteScheduleRequest {
  string id = 1;
}

message DeleteScheduleResponse {}



// QueryMetrics proxies PromQL through core. Prometheus has no IngressRoute
// in this cluster (only Grafana and Alertmanager do), so the browser has no
// route to it — and giving it one would expose every cluster metric to
// anything that can reach the hostname. core is already behind
// basic-admin-auth and the dashboard CSRF header.
message QueryMetricsRequest {
  string query = 1;
  // RFC3339. Both empty means an instant query; both set means a range
  // query. `step` is a duration string ("30s", "5m") — empty defaults to 1m,
  // and is coarsened automatically if the range would exceed Prometheus'
  // 11k-point ceiling.
  string start_time = 2;
  string end_time = 3;
  string step = 4;
}

message QueryMetricsResponse {
  // Prometheus' own `data` envelope, verbatim. Not re-modelled as proto:
  // the frontend already has to handle vector/matrix/scalar result types,
  // and a parallel schema here would only be a second thing to keep in sync
  // with Prometheus' API.
  string result_json = 1;
}

message GetFleetTopologyRequest {}

// A cell in the fleet: one long-lived component, or one task's pod.
message CellNode {
  string id = 1;
  // core | provisioner | worker | e2e
  string type = 2;
  // healthy | degraded | failing | idle
  string status = 3;
  // Free-form so the view can gain a number without a schema change —
  // e.g. rps, live_pods, max_in_flight, or a task's pending count.
  map<string, double> metrics = 4;
  // Set on worker/e2e cells: which task this cell is running, so clicking
  // it can open that session. Empty on the two hub cells.
  string session_id = 5;
  string repo = 6;
  // Human-facing one-liner (a task's description, a hub's role).
  string label = 7;
  // What build this cell is running: a compiled-in version for the two hubs,
  // the worker image's tag for a session cell. Empty when unknown — the
  // provisioner being unreachable must degrade this cell, not the graph.
  string version = 8;
}

message TopologyEdge {
  string from = 1;
  string to = 2;
  // Requests/sec over the last 5m, 0 when there's no metric for this pair.
  double rate = 3;
}

message GetFleetTopologyResponse {
  repeated CellNode nodes = 1;
  repeated TopologyEdge edges = 2;
  // Non-fatal explanation when Prometheus was unreachable: the topology
  // still renders from Postgres, just without rates. Silently returning
  // zeros would read as "the fleet is idle".
  string metrics_error = 3;

  // What a *new* session would get, straight from the provisioner's config —
  // as opposed to CellNode.version on a worker cell, which is what that
  // already-running pod got. The two differ for the whole window between a
  // fleet upgrade and a session's next warm, which is exactly when someone is
  // asking.
  string worker_image = 4;
  string sidecar_image = 5;
}
