syntax = "proto3";
package agentfleet.v1;
option go_package = "github.com/MohammadBnei/agent-fleet/proto/gen/go/agentfleet/v1;agentfleetv1";

import "agentfleet/v1/provisioner.proto";
import "agentfleet/v1/transcript.proto";

// The web dashboard's API (see docs/adr/0015) — served over ConnectRPC by
// fleet-core, consumed by a generated connect-web client in dashboard/.
// Reuses transcript.proto's TranscriptEntry/ReadTranscriptSinceRequest/
// ReadTranscriptSinceResponse rather than redefining them: that message
// set was placed there anticipating exactly this "non-MCP client" (see
// transcript.proto's own comment, docs/adr/0013). Field names are
// snake_case here per proto convention; generated TS/JS renders them
// camelCase (e.g. thread_id -> threadId).

message Task {
  string id = 1;
  string repo = 2;
  string description = 3;
  string status = 4;
  optional string thread_id = 5;
  optional string pr_url = 6;
  // Worker-pod lifecycle state (PodPhase, set via ReportPodEvents) — distinct
  // from `status` (business state). Unset until the provisioner reports the
  // pod's first event.
  optional string pod_phase = 7;
  optional string pod_message = 8;
  // Reclaim-eligibility signal (ClaimNextTask reclaims a claimed/running
  // task once this is >10min stale — the exact staleness
  // threshold the dashboard's own "stuck" badge should match). Set once at
  // claim time, refreshed by the worker pod's own heartbeat loop; unset for
  // a still-pending task. RFC3339, matching JournalEntry.created_at.
  optional string heartbeat_at = 9;
  // How many times ClaimNextTask has reclaimed this task after a stale
  // heartbeat (capped at MAX_TASK_RETRIES before the task goes
  // failed_permanently instead of being reclaimed again).
  int32 retry_count = 10;
  optional string last_error = 11;
  // The Claude SDK's own session id (SaveSessionId) — resumable in a fresh
  // pod via `resume:` (sessions redesign, supersedes docs/adr/0021/0025's
  // phase-boundary framing). Unset until the worker's first streamed
  // message reports it.
  optional string session_id = 12;
  // Last time a transcript entry was appended for this task — substrate
  // for the idle-timeout backstop that tears down an unattended pod.
  // RFC3339, matching heartbeat_at. Unset for a task with no activity yet.
  optional string last_active_at = 13;
  // The session's current SDK permission mode ("default"|"plan"|
  // "acceptEdits"|"bypassPermissions"|...), so the dashboard's mode picker
  // can highlight the real active mode instead of guessing. Unset for an
  // idle/never-warmed session.
  optional string permission_mode = 14;
}

message ListTasksRequest {
  int32 limit = 1;
}

message ListTasksResponse {
  repeated Task tasks = 1;
}

message GetTaskRequest {
  string id = 1;
}

message GetTaskResponse {
  Task task = 1;
}

// Creates a task the same way a Discord /task command does, minus the
// Discord thread — repo must be a name in the repos table (docs/adr/0028,
// core/internal/repos), description must be non-empty. The created task has no
// discord_channel_id/discord_thread_id, which core/internal/discord/
// session.go's PostToThread already handles as a no-op relay target.
// snippet_ids optionally names rows from the prompt_snippets table — their
// text is resolved and joined once, at creation time, into the new task's
// own guidance column (see PromptSnippet below); empty means the task gets
// only its own description, no extra guidance.
message CreateTaskRequest {
  string repo = 1;
  string description = 2;
  repeated string snippet_ids = 3;
}

message CreateTaskResponse {
  Task task = 1;
}

// Streamed directly as `stream TranscriptEntry` on the RPC below — no
// wrapper response message, unlike the unary GetTranscript (which reuses
// transcript.proto's ReadTranscriptSinceResponse).
message StreamTranscriptRequest {
  string task_id = 1;
  int64 since_seq = 2;
}

message GetE2eStatusRequest {
  string task_id = 1;
}

message GetE2eStatusResponse {
  string status = 1;
  string preview_url = 2;
}

message StopRequest {
  string task_id = 1;
  optional string reason = 2;
}

message StopResponse {
  string status = 1;
}

// Sets an arbitrary SDK permission mode on a running task (docs/adr/0027,
// extended by the sessions redesign supersession of docs/adr/0021/0025 —
// Approve is gone, this is now the only mode lever). `mode` must be one of
// "default"|"plan"|"acceptEdits"|"bypassPermissions" (validated
// server-side); "bypassPermissions" deliberately disables the canUseTool
// prompt-and-wait gate for this task for the rest of the session — the
// dashboard must get explicit, typed confirmation from the human before
// sending that value.
message SetPermissionModeRequest {
  string task_id = 1;
  string mode = 2;
}

message SetPermissionModeResponse {
  string status = 1;
}

// Warm boots a pod for an idle session on demand — the sessions redesign's
// "bus" model (supersedes docs/adr/0021/0025's phase-boundary framing): a
// task's pod is ephemeral compute, not tied to the task's whole lifetime.
// Deliberately does not touch tasks.status (a loose UI-freshness signal
// now, not control flow) — session state is the worktree + saved
// session_id, both of which already survive teardown. Rejected with
// CodeFailedPrecondition if the task already has a live pod (idempotent
// double-click guard) or the fleet is already at MAX_IN_FLIGHT_TASKS.
message WarmRequest {
  string task_id = 1;
}

message WarmResponse {
  string status = 1;
  string pod_name = 2;
}

// Answers a pending PERMISSION_REQUEST-type transcript entry (posted by
// canUseTool for any tool call the SDK's current permission mode would
// prompt for — supersedes docs/adr/0021's Write/Edit-absent-from-
// allowedTools gate). `seq` is that entry's own seq, carried the same way
// AnswerQuestion's is — for the dashboard's own bookkeeping, not required
// for correlation server-side. A sibling RPC to AnswerQuestion rather than
// overloading it: the payload shape differs (allow/deny/updatedInput vs.
// free-form answers JSON) and there's no real code to share beyond one
// AppendReply call either way.
message RespondToPermissionRequest {
  string task_id = 1;
  int64 seq = 2;
  string decision_json = 3;
}

message RespondToPermissionResponse {
  string status = 1;
}

message KillE2eRequest {
  string task_id = 1;
}

message KillE2eResponse {
  bool killed = 1;
}

// Answers a pending QUESTION-type transcript entry (posted by the agent's
// AskUserQuestion MCP tool call, see docs/adr/0018). `seq` is that entry's
// own seq — carried for the dashboard's own bookkeeping/idempotency, not
// required for correlation server-side (only one question is ever pending
// per task at a time, since the agent's tool call blocks on it).
// `answers_json` is a JSON-encoded {"answers": {"<question>": "<label>"}}
// payload, opaque to fleet-core — it's appended verbatim as the answer
// entry's `text` and returned verbatim to the blocked MCP tool call.
message AnswerQuestionRequest {
  string task_id = 1;
  int64 seq = 2;
  string answers_json = 3;
}

message AnswerQuestionResponse {
  string status = 1;
}

// Discuss lets a human send an arbitrary free-text message from the
// dashboard, full parity with a Discord thread reply — appended as a
// "discussion" transcript entry, picked up by the worker's existing
// streamHumanMessages SSE the same way a Discord reply already is (no
// worker/sidecar changes needed, it's a plain cursor-based transcript
// stream, not Discord-specific). `from`/`type` are hardcoded server-side,
// same pattern as Stop hardcoding "human"/"abort" — the dashboard has no
// need to expose them.
message DiscussRequest {
  string task_id = 1;
  string text = 2;
}

message DiscussResponse {
  string status = 1;
}

// Soft-deletes the task (see db/schema.sql's tasks.deleted_at) after
// force-tearing down any live worker/e2e pod — unlike Stop, which only
// posts an "abort" transcript entry the worker pod must be alive and
// cooperative to react to, this calls ProvisionerService.TearDownSession
// directly so a wedged/crashed pod doesn't block removal. Doesn't touch
// `status` — a `done` task stays `done`, it just stops appearing in
// ListTasks.
message DeleteTaskRequest {
  string task_id = 1;
}

message DeleteTaskResponse {
  string status = 1;
}

// WorktreeView is provisioner.proto's WorktreeInfo left-joined against
// `tasks` (reliability-findings.md #2) — task_status/task_error/pr_url
// are unset, not omitted, when the task row itself no longer exists,
// which is exactly the orphaned-worktree case this view exists to
// surface (an inner join would hide it).
message WorktreeView {
  string task_id = 1;
  string repo = 2;
  string branch = 3;
  string upstream_track = 4;
  int64 mtime_unix = 5;
  optional string task_status = 6;
  optional string task_error = 7;
  optional string pr_url = 8;
}

message ListWorktreesViewResponse {
  repeated WorktreeView worktrees = 1;
}

// GetJournal is the read path reliability-findings.md #1/#7 both call out
// as missing — knowledge_journal had no Get/List RPC anywhere, so even a
// journaled crash event was invisible without direct Postgres access.
// Typed request/response, same pull/cursor shape as GetTranscript, not a
// generic Query(bytes) returns (bytes) dispatcher — two concrete gaps
// don't justify throwing away protobuf's type safety for a general one.
message JournalEntry {
  int64 id = 1;
  string repo = 2;
  string actor = 3;
  string event_type = 4;
  string payload_json = 5;
  string created_at = 6; // RFC3339
}

message GetJournalRequest {
  string repo = 1; // "" matches every repo
  int64 since_id = 2;
  int32 limit = 3;
}

message GetJournalResponse {
  repeated JournalEntry entries = 1;
  int64 next_id = 2;
}

// Repo is the dashboard-editable target-repo config (docs/adr/0028) —
// replaces the hardcoded tasks.KnownRepos Go map, backed by the `repos`
// table (db/schema.sql). No timestamps exposed: the dashboard's repo list
// is small and unordered, unlike Task/JournalEntry which need cursor state.
message Repo {
  string name = 1;
  string url = 2;
  string base_branch = 3; // "" means the provisioner defaults to "main"
}

message ListReposRequest {}

message ListReposResponse {
  repeated Repo repos = 1;
}

message CreateRepoRequest {
  string name = 1;
  string url = 2;
  string base_branch = 3;
}

message CreateRepoResponse {
  Repo repo = 1;
}

message UpdateRepoRequest {
  string name = 1;
  string url = 2;
  string base_branch = 3;
}

message UpdateRepoResponse {
  Repo repo = 1;
}

message DeleteRepoRequest {
  string name = 1;
}

message DeleteRepoResponse {
  string status = 1;
}

// PromptSnippet is dashboard-editable, reusable guidance text (same
// no-redeploy pattern as Repo above), backed by the `prompt_snippets`
// table (db/schema.sql). An operator optionally attaches a set of these to
// a task at creation time (CreateTaskRequest.snippet_ids) — replaces
// worker/src/session.ts's old unconditional, hardcoded workflow prompt. A
// task's base prompt is just its own description; anything more is one of
// these, picked per task, not forced on every task regardless of size.
message PromptSnippet {
  string id = 1;
  string name = 2;
  string text = 3;
}

message ListPromptSnippetsRequest {}

message ListPromptSnippetsResponse {
  repeated PromptSnippet snippets = 1;
}

message CreatePromptSnippetRequest {
  string name = 1;
  string text = 2;
}

message CreatePromptSnippetResponse {
  PromptSnippet snippet = 1;
}

message UpdatePromptSnippetRequest {
  string id = 1;
  string name = 2;
  string text = 3;
}

message UpdatePromptSnippetResponse {
  PromptSnippet snippet = 1;
}

message DeletePromptSnippetRequest {
  string id = 1;
}

message DeletePromptSnippetResponse {
  string status = 1;
}

service DashboardService {
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  // Reuses transcript.proto's ReadTranscriptSinceRequest/Response rather
  // than duplicating a byte-identical message pair.
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc GetTranscript(ReadTranscriptSinceRequest) returns (ReadTranscriptSinceResponse);
  // Streams transcript.proto's TranscriptEntry directly rather than
  // wrapping it in a redundant StreamTranscriptResponse.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc StreamTranscript(StreamTranscriptRequest) returns (stream TranscriptEntry);
  rpc GetE2eStatus(GetE2eStatusRequest) returns (GetE2eStatusResponse);
  rpc Stop(StopRequest) returns (StopResponse);
  rpc SetPermissionMode(SetPermissionModeRequest) returns (SetPermissionModeResponse);
  rpc Warm(WarmRequest) returns (WarmResponse);
  rpc KillE2e(KillE2eRequest) returns (KillE2eResponse);
  rpc AnswerQuestion(AnswerQuestionRequest) returns (AnswerQuestionResponse);
  rpc RespondToPermission(RespondToPermissionRequest) returns (RespondToPermissionResponse);
  rpc Discuss(DiscussRequest) returns (DiscussResponse);
  rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse);
  // Reuses provisioner.proto's ListWorktreesRequest (identical shape,
  // empty) and DeleteWorktreeRequest/Response (identical shape, no
  // dashboard-specific fields needed) — same passthrough-reuse pattern
  // core.proto's ListE2eTools/CallE2eTool already established. The
  // response is enriched with a left-join against `tasks`, so it can't
  // reuse provisioner's own WorktreeInfo/ListWorktreesResponse as-is.
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc ListWorktrees(ListWorktreesRequest) returns (ListWorktreesViewResponse);
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc DeleteWorktree(DeleteWorktreeRequest) returns (DeleteWorktreeResponse);
  rpc GetJournal(GetJournalRequest) returns (GetJournalResponse);
  rpc ListRepos(ListReposRequest) returns (ListReposResponse);
  rpc CreateRepo(CreateRepoRequest) returns (CreateRepoResponse);
  rpc UpdateRepo(UpdateRepoRequest) returns (UpdateRepoResponse);
  rpc DeleteRepo(DeleteRepoRequest) returns (DeleteRepoResponse);
  rpc ListPromptSnippets(ListPromptSnippetsRequest) returns (ListPromptSnippetsResponse);
  rpc CreatePromptSnippet(CreatePromptSnippetRequest) returns (CreatePromptSnippetResponse);
  rpc UpdatePromptSnippet(UpdatePromptSnippetRequest) returns (UpdatePromptSnippetResponse);
  rpc DeletePromptSnippet(DeletePromptSnippetRequest) returns (DeletePromptSnippetResponse);
}
