version: v2
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: gen/go
    opt: paths=source_relative
  # Connect-ES v2: protoc-gen-es alone generates both messages and service
  # descriptors (GenService, consumed directly by @connectrpc/connect's
  # createClient) — the separate protoc-gen-connect-es plugin is for the
  # older v1 API and produces an incompatible descriptor shape, so it's
  # deliberately not listed here.
  - local: ../dashboard/node_modules/.bin/protoc-gen-es
    out: ../dashboard/src/gen
    opt: target=ts
  - local: ../worker/node_modules/.bin/protoc-gen-ts_proto
    out: ../worker/src/gen
    opt:
      - esModuleInterop=true
      - outputJsonMethods=true
      - outputEncodeMethods=false
      - outputClientImpl=false
      - useOptionals=messages
      # worker/'s tsconfig uses moduleResolution: nodenext, which requires
      # explicit extensions on relative ESM imports — without this, ts-proto's
      # generated cross-file imports (e.g. dashboard.ts importing transcript.ts)
      # fail tsc with TS2835.
      - importSuffix=.js
  # thot/ is a second TS/Bun component (docs/adr/0035) that, unlike
  # worker/, hosts a gRPC *server* (ThotService) rather than only consuming
  # one — outputServices defaults to grpc-js, which is what's needed here
  # (a ThotServiceService definition + Server interface for @grpc/grpc-js's
  # own Server#addService, not just client stubs).
  - local: ../thot/node_modules/.bin/protoc-gen-ts_proto
    out: ../thot/src/gen
    opt:
      - esModuleInterop=true
      - outputJsonMethods=true
      - useOptionals=messages
      - importSuffix=.js
      # Explicit, not relying on ts-proto's own default: generates a real
      # @grpc/grpc-js service definition + *Server interface, not just a
      # generic client — without this, ts-proto emits client-only stubs
      # (a generic Rpc interface) with nothing addService() can bind to.
      # outputEncodeMethods is deliberately left at its default (true) here,
      # unlike worker/'s target — grpc-js's own generated serialize/
      # deserialize wiring calls Message.encode()/.decode() directly, so
      # turning those off (as worker/ does, since it never needs them with
      # outputClientImpl=false) breaks typecheck for every message in the
      # package, not just thot's own.
      - outputServices=grpc-js
