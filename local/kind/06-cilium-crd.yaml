# Only so the definition egress lock can exist (docs/adr/0080 §1): the
# provisioner refuses a definition warm while the CiliumNetworkPolicy
# definition-egress-lock is absent (k8s.EgressLockPresent), and kind has no
# Cilium. With this stub the real object from
# k8s/provisioner/definition-egress.yaml applies, and NOTHING ENFORCES IT:
# definition pods here have open egress.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ciliumnetworkpolicies.cilium.io
spec:
  group: cilium.io
  scope: Namespaced
  names:
    kind: CiliumNetworkPolicy
    listKind: CiliumNetworkPolicyList
    plural: ciliumnetworkpolicies
    singular: ciliumnetworkpolicy
  versions:
    - name: v2
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
