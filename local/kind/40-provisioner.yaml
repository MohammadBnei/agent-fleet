# Local variant of k8s/provisioner/deployment.yaml: local image tags,
# imagePullPolicy: Never, and agent-fleet-local-secrets in place of the
# InfisicalSecret-backed provisioner-infisical secretRef. RBAC/ServiceAccount/
# Service are reused verbatim from k8s/provisioner/ (see local/kind/README.md)
# — only this Deployment differs from prod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provisioner
  namespace: agent-fleet
  labels:
    app.kubernetes.io/part-of: agent-fleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: provisioner
  template:
    metadata:
      labels:
        app: provisioner
        app.kubernetes.io/part-of: agent-fleet
    spec:
      serviceAccountName: provisioner
      containers:
        - name: provisioner
          image: agent-fleet-provisioner:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: grpc
          env:
            - name: NAMESPACE
              value: agent-fleet
            - name: E2E_HOST
              value: e2e.bnei.dev # the wildcard base domain expose() builds a session's hostname from. Nothing serves it in kind (no Traefik), but the Service it creates is real and reachable by cluster DNS.
            - name: PORT
              value: "8080"
            - name: GRPC_PORT
              value: "9090"
            - name: WORKER_IMAGE
              value: agent-fleet-worker:local
            - name: SIDECAR_IMAGE
              value: agent-fleet-sidecar:local
            - name: WORKSPACE_PVC
              value: agent-fleet-workspace
            - name: WORKSPACE_ROOT
              value: /workspace
            # docs/adr/0080 §2, §5: definitions, packs and fleet-shared come from
            # a read-only bare mirror on the workspace volume, outside every
            # pod's mounts, that /kind-local writes: the branch under test with
            # definitions/ replaced by local/kind/definitions/, on its `game`
            # branch. No pod can push to the source of its own authority.
            - name: FLEET_SHARED_REPO_URL
              value: /workspace/local-mirror/agent-fleet.git
            - name: FLEET_DEFINITIONS_REF
              value: game
            - name: FLEET_SHARED_BRANCH
              value: game
            # docs/adr/0080 §1: the local Agent Vault (15-agent-vault.yaml),
            # never production's address, and the files vault-bootstrap.sh
            # writes. The owner vaults' GitHub token is one of those files.
            - name: AGENT_VAULT_API_ADDR
              value: http://agent-vault-local.agent-fleet.svc.cluster.local:14321
            - name: AGENT_VAULT_PROXY_ADDR
              value: agent-vault-local.agent-fleet.svc.cluster.local:14322
            - name: FLEET_OWNER_TOKEN_FILE
              value: /var/run/agent-vault/OWNER_GITHUB_TOKEN
            # docs/adr/0080 §2: the forge every https://github.com/ goes to
            # (ConfigMap local-forge, written by /kind-local for this host).
            # Workers get it with their session as the push user; the
            # provisioner's own git (the repo cache) gets it below.
            - name: FLEET_GIT_URL_REWRITE
              valueFrom: { configMapKeyRef: { name: local-forge, key: FLEET_GIT_URL_REWRITE } }
            - name: GIT_CONFIG_COUNT
              value: "2"
            - name: GIT_CONFIG_KEY_0
              value: safe.directory # the mirror is host-written; git's ownership guard would refuse it
            - name: GIT_CONFIG_VALUE_0
              value: /workspace/local-mirror/agent-fleet.git
            - name: GIT_CONFIG_KEY_1
              value: url.$(FLEET_GIT_URL_REWRITE).insteadOf
            - name: GIT_CONFIG_VALUE_1
              value: https://github.com/
            # core's code default is "agent-fleet-core.agent-fleet.svc.
            # cluster.local:9090" — correct for prod, where core goes
            # through common-app-chart and gets release-name-prefixed, but
            # 30-core.yaml's Service here is named plain "core" (a raw
            # Deployment+Service, not the chart). Override required, or the
            # provisioner's ReportPodEvents calls AND every sidecar's
            # CORE_GRPC_ADDR (forwarded from this same value, see
            # provisioner/internal/k8s/pod.go) resolve zero addresses and
            # every worker pod hangs forever at sidecar /readyz.
            - name: CORE_GRPC_ADDR
              value: core.agent-fleet.svc.cluster.local:9090
            # Must equal 30-core.yaml's (docs/adr/0057).
            - name: FLEET_PROVISIONER_TOKEN
              value: kind-local-provisioner-token
            # docs/adr/0069: what core must present to this provisioner. Without
            # it the provisioner refuses to start. Must equal 30-core.yaml's.
            - name: FLEET_CORE_PROVISIONER_TOKEN
              value: kind-local-core-provisioner-token
          envFrom:
            - secretRef:
                name: agent-fleet-local-secrets
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: agent-vault
              mountPath: /var/run/agent-vault
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: agent-fleet-workspace
        - name: agent-vault
          secret:
            secretName: provisioner-agent-vault
