# Local variant of k8s/provisioner/deployment.yaml: local image tags,
# imagePullPolicy: Never, and agent-fleet-local-secrets in place of the
# InfisicalSecret-backed provisioner-infisical secretRef. RBAC/ServiceAccount/
# Service are reused verbatim from k8s/provisioner/ (see local/kind/README.md)
# — only this Deployment differs from prod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provisioner
  namespace: agent-fleet
  labels:
    app.kubernetes.io/part-of: agent-fleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: provisioner
  template:
    metadata:
      labels:
        app: provisioner
        app.kubernetes.io/part-of: agent-fleet
    spec:
      serviceAccountName: provisioner
      containers:
        - name: provisioner
          image: agent-fleet-provisioner:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: grpc
          env:
            - name: NAMESPACE
              value: agent-fleet
            - name: E2E_HOST
              value: e2e.bnei.dev # unused locally — no e2e-preview flow exercised here
            - name: PORT
              value: "8080"
            - name: GRPC_PORT
              value: "9090"
            - name: WORKER_IMAGE
              value: agent-fleet-worker:local
            - name: SIDECAR_IMAGE
              value: agent-fleet-sidecar:local
            - name: WORKSPACE_PVC
              value: agent-fleet-workspace
            - name: WORKTREES_ROOT
              value: /workspace
            # core's code default is "agent-fleet-core.agent-fleet.svc.
            # cluster.local:9090" — correct for prod, where core goes
            # through common-app-chart and gets release-name-prefixed, but
            # 30-core.yaml's Service here is named plain "core" (a raw
            # Deployment+Service, not the chart). Override required, or the
            # provisioner's ReportPodEvents calls AND every sidecar's
            # CORE_GRPC_ADDR (forwarded from this same value, see
            # provisioner/internal/k8s/pod.go) resolve zero addresses and
            # every worker pod hangs forever at sidecar /readyz.
            - name: CORE_GRPC_ADDR
              value: core.agent-fleet.svc.cluster.local:9090
          envFrom:
            - secretRef:
                name: agent-fleet-local-secrets
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: agent-fleet-workspace
