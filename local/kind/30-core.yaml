# Local-only raw Deployment+Service for core. k8s/core.yaml is a Helm
# *values* file for ArgoCD's common-app-chart, not applicable to a plain
# `kubectl apply` — this is a hand-written equivalent for local testing.
# No ingress: reach core via `kubectl port-forward svc/core 8080:8080`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core
  namespace: agent-fleet
  labels:
    app.kubernetes.io/part-of: agent-fleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: core
  template:
    metadata:
      labels:
        app: core
        app.kubernetes.io/part-of: agent-fleet
    spec:
      containers:
        - name: core
          image: agent-fleet-core:local
          imagePullPolicy: Never # fails loudly (ErrImageNeverPull) instead of silently reusing a stale build
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: grpc
            # docs/adr/0066 §3: AgentService for registered clients (the game).
            - containerPort: 9091
              name: clients
          env:
            - name: CORE_PORT
              value: "8080"
            - name: CORE_GRPC_PORT
              value: "9090"
            # Default (provisioner.agent-fleet.svc.cluster.local:9090)
            # already matches 40-provisioner.yaml's Service name — no
            # override needed.
            - name: MAX_IN_FLIGHT_TASKS
              value: "5"
            # docs/adr/0062: the definition pool inside the cap above. Must be
            # < MAX_IN_FLIGHT_TASKS, or core warns and turns the inner pools off.
            - name: MAX_DEFINITION_SESSIONS
              value: "3"
            # docs/adr/0066 §8: member and client sessions, inside the pool
            # above (checkCapacity). At 0 no client session warms.
            - name: MAX_EXTERNAL_SESSIONS
              value: "2"
            # docs/adr/0080 §3: the game client's bearer, named by
            # clients/game.yaml's tokenRef; at least 32 bytes or core disables
            # the client. Its own Secret, so the provisioner never sees it.
            - name: FLEET_CLIENT_TOKEN_GAME
              valueFrom: { secretKeyRef: { name: core-local-clients, key: FLEET_CLIENT_TOKEN_GAME, optional: true } }
            # docs/adr/0056: core refuses to start without OIDC config, and
            # this cluster has no authentik.
            - name: FLEET_AUTH_DISABLED
              value: "1"
            # AgentService runs as the dev identity with the gate off; the
            # port-forwarded console's origin must be admitted to reach it.
            - name: FLEET_DEV_ORIGINS
              value: "http://localhost:8080"
            # docs/adr/0057: the provisioner authenticates to CoreService with
            # this shared value. Unset on both sides, core starts but rejects
            # every pod event. Must equal 40-provisioner.yaml's. A local-only
            # literal, not a credential: nothing outside this kind cluster
            # accepts it.
            - name: FLEET_PROVISIONER_TOKEN
              value: kind-local-provisioner-token
            # docs/adr/0069: the other direction, core -> ProvisionerService.
            # The provisioner refuses to start without its copy. Must equal
            # 40-provisioner.yaml's. Local-only literal, like the one above.
            - name: FLEET_CORE_PROVISIONER_TOKEN
              value: kind-local-core-provisioner-token
            # DISCORD_BOT_TOKEN deliberately omitted — core/cmd/core/run.go
            # falls back to a noopNotifier, same as dashboard-e2e.
            # LOKI_URL deliberately omitted — no Loki in this local ground;
            # log-query features degrade gracefully, everything else works.
          envFrom:
            - secretRef:
                name: agent-fleet-local-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: core
  namespace: agent-fleet
spec:
  selector:
    app: core
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 9090
      targetPort: 9090
    - name: clients
      port: 9091
      targetPort: 9091
