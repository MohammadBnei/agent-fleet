# Traefik's IngressRoute CRD, reduced to what the provisioner needs to exist.
#
# expose() creates one per published session. kind has no Traefik, so without
# this the call fails with "the server could not find the requested resource"
# and a session can never publish a URL locally.
#
# The Middleware CRD used to be here too, because the provisioner created a
# shared cluster-ip-whitelist Middleware at startup and treated failure as
# fatal. Both are gone (docs/adr/0048 §6) — nothing creates a Middleware, and
# expose()'s route references the shared basic-auth one that lives in the real
# cluster's `default` namespace and is not managed by this repo.
#
# Schema is `x-kubernetes-preserve-unknown-fields` rather than Traefik's real
# one on purpose. Nothing in kind reconciles these objects — the only thing
# under test is that the provisioner can create one — and vendoring a
# multi-thousand-line upstream CRD here would be a second copy to keep in sync
# with a Traefik version this cluster does not run.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ingressroutes.traefik.io
spec:
  group: traefik.io
  scope: Namespaced
  names:
    kind: IngressRoute
    listKind: IngressRouteList
    plural: ingressroutes
    singular: ingressroute
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
