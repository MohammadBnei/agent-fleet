# Traefik's Middleware CRD, reduced to what the provisioner needs to exist.
#
# provisioner/cmd/provisioner/main.go creates a shared cluster-ip-whitelist
# Middleware at startup and calls os.Exit(1) if it cannot — deliberately, since
# in the real cluster a missing CRD or missing RBAC means preview URLs would
# silently start prompting worker pods for basic auth. kind has no Traefik, so
# without this the provisioner CrashLoopBackOffs and nothing else can be
# tested: no pods, no sessions, no worktrees.
#
# Schema is `x-kubernetes-preserve-unknown-fields` rather than Traefik's real
# one on purpose. Nothing in kind reconciles these objects — the only thing
# under test is that the provisioner can create one — and vendoring a
# multi-thousand-line upstream CRD here would be a second copy to keep in sync
# with a Traefik version this cluster does not run.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: middlewares.traefik.io
spec:
  group: traefik.io
  scope: Namespaced
  names:
    kind: Middleware
    listKind: MiddlewareList
    plural: middlewares
    singular: middleware
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
# IngressRoute, for the same reason: the provisioner creates one per exposed
# session, and a missing CRD turns that into a runtime error rather than
# something the local harness can exercise.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ingressroutes.traefik.io
spec:
  group: traefik.io
  scope: Namespaced
  names:
    kind: IngressRoute
    listKind: IngressRouteList
    plural: ingressroutes
    singular: ingressroute
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
