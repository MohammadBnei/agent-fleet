# ukubi-game's resident of ukubi-meet (game-base.yaml): it reads the repo and answers
# the player. Only the api.anthropic.com service: pr mode holds no GitHub key.
apiVersion: fleet.bnei.dev/v1alpha1
kind: AgentDefinition
metadata: { name: game-ukubi-meet }
spec:
  extends: game-base
  invokers: [ukubi-game]
  credentials:
    vault: game-ukubi-meet
    services:
      - { host: api.anthropic.com, secret: CLAUDE_CODE_OAUTH_TOKEN }
  workspace: { kind: repo, repo: ukubi-meet }
  git: { mode: pr, identity: { name: game-ukubi-meet, email: game-ukubi-meet@bnei.dev } }
