# ukubi-game's resident of pi-lab (game-base.yaml): it reads the repo and answers
# the player. Only the api.anthropic.com service: pr mode holds no GitHub key.
apiVersion: fleet.bnei.dev/v1alpha1
kind: AgentDefinition
metadata: { name: game-pi-lab }
spec:
  extends: game-base
  invokers: [ukubi-game]
  credentials:
    vault: game-pi-lab
    services:
      - { host: api.anthropic.com, secret: CLAUDE_CODE_OAUTH_TOKEN }
  workspace: { kind: repo, repo: pi-lab }
  git: { mode: pr, identity: { name: game-pi-lab, email: game-pi-lab@bnei.dev } }
