# ukubi-game's resident of ukubi-game (game-base.yaml): it reads the repo and answers
# the player. Only the api.anthropic.com service: pr mode holds no GitHub key.
apiVersion: fleet.bnei.dev/v1alpha1
kind: AgentDefinition
metadata: { name: game-ukubi-game }
spec:
  extends: game-base
  invokers: [ukubi-game]
  credentials:
    vault: game-ukubi-game
    services:
      - { host: api.anthropic.com, secret: CLAUDE_CODE_OAUTH_TOKEN }
  workspace: { kind: repo, repo: ukubi-game }
  git: { mode: pr, identity: { name: game-ukubi-game, email: game-ukubi-game@bnei.dev } }
