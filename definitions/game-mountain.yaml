# ukubi-game's resident of mountain (game-base.yaml): it reads the repo and answers
# the player. Only the api.anthropic.com service: pr mode holds no GitHub key.
apiVersion: fleet.bnei.dev/v1alpha1
kind: AgentDefinition
metadata: { name: game-mountain }
spec:
  extends: game-base
  invokers: [ukubi-game]
  credentials:
    vault: game-mountain
    services:
      - { host: api.anthropic.com, secret: CLAUDE_CODE_OAUTH_TOKEN }
  workspace: { kind: repo, repo: mountain }
  git: { mode: pr, identity: { name: game-mountain, email: game-mountain@bnei.dev } }
