# QA definition for ADR-0070's headless Invoke (single-shot runs with a
# structured result). Read-only: it can read the agent-fleet repo and answer,
# never edit, run commands or push (pr mode holds no push credential). Its only
# invoker is the qa-invoke client, whose bearer token lives in Infisical
# (FLEET_CLIENT_TOKEN_QA_INVOKE). Remove both files, or empty `invokers`, once
# the ADR's live QA is done.
apiVersion: fleet.bnei.dev/v1alpha1
kind: AgentDefinition
metadata: { name: qa-invoke }
spec:
  extends: workspace-base
  audience: { group: platform-admins }
  invokers: [qa-invoke]
  credentials:
    vault: qa-invoke
    services:
      - { host: api.anthropic.com, secret: CLAUDE_CODE_OAUTH_TOKEN }
  workspace: { kind: repo, repo: agent-fleet }
  git: { mode: pr, identity: { name: fleet-qa-agent, email: fleet-qa-agent@bnei.dev } }
  sidecarTools: [AskUserQuestion]
  tools:
    allow: [Read, Glob, Grep]
    deny: [Edit, Write, Bash]
  lifecycle: { allow: [single-shot] }
  output:
    schema:
      type: object
      required: [answer]
      properties: { answer: { type: string } }
  limits: { maxTurns: 10, timeout: 10m, concurrency: 1, startupBudget: 3m, maxParks: 3, answerTimeout: 2h }
