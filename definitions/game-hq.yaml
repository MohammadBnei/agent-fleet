# ukubi-game's resident of hq (game-base.yaml): it reads the repo and answers
# the player. Only the api.anthropic.com service: pr mode holds no GitHub key.
apiVersion: fleet.bnei.dev/v1alpha1
kind: AgentDefinition
metadata: { name: game-hq }
spec:
  extends: game-base
  invokers: [ukubi-game]
  credentials:
    vault: game-hq
    services:
      - { host: api.anthropic.com, secret: CLAUDE_CODE_OAUTH_TOKEN }
  workspace: { kind: repo, repo: hq }
  git: { mode: pr, identity: { name: game-hq, email: game-hq@bnei.dev } }
