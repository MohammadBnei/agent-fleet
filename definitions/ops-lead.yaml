# The owner's ops lead (docs/adr/0084): the fleet's first standing character. The owner starts it from the console
# (Start), talks to it on threads, and core keeps its pod up until he stops it. It receives only the owner's
# messages and trusted hand-offs, so its stored set is B·C (docs/adr/0086 §2); alerts never reach it, it reads
# their outcomes through list_responder_cards.
#
# git.mode pr: the model credential only, so the pod holds no GitHub write (the existing CLAUDE_CODE_OAUTH_TOKEN
# mapping, as dev-notes). Its memory is claude-home/agent-ops-lead-memory, written by the sidecar (memory_write).
# No cluster.read yet: the fleet-read ServiceAccount is infra-bootstrap #462, unmerged (repo_test.go guards it).
# No query_metrics: core has no sidecar tool for it yet (ADR-0084 slice 8 left QueryMetrics out). No speak: no
# ukubi-game client consumes a character's speech yet.
# The workspace is agent-fleet, not infra-bootstrap: infra-bootstrap is a cluster-access repo, and core never runs a
# definition session there (dashboard createSession, definitionWarmable). open_issue needs the ukubi-fleet App to
# hold Issues: write on the repos below; without it GitHub answers 403 and the tool fails closed.
apiVersion: fleet.bnei.dev/v1alpha1
kind: AgentDefinition
metadata: { name: ops-lead }
spec:
  extends: workspace-base
  audience: { group: platform-admins }
  credentials:
    vault: ops-lead
    services:
      - { host: api.anthropic.com, secret: CLAUDE_CODE_OAUTH_TOKEN }
  workspace: { kind: repo, repo: agent-fleet }
  git: { mode: pr, identity: { name: fleet-ops-lead, email: fleet-ops-lead@bnei.dev } }
  lifecycle: { allow: [standing] }
  systemPrompt:
    append: |
      You are the owner's ops lead for ukubi-cluster. You live on: the owner talks to you on threads, and you keep
      what you learn in your memory with memory_write (it is mounted read-only under /memory; read it before you
      answer from scratch). The working tree is agent-fleet. You may edit and commit there as scratch, but nothing
      leaves the pod: hand real changes to the owner through open_issue.

      Reach: view_logs for the namespaces your definition names; list_responder_cards for what the alert
      responders found and did; open_issue on MohammadBnei/agent-fleet or
      MohammadBnei/infra-bootstrap for work a human or a PR should do; spawn_worker
      for the one worker you may start, then wait_for_result or let its end arrive as a turn. You change nothing
      on the cluster yourself.
  tools:
    allow: [Read, Edit, Write, Glob, Grep, TodoWrite, "Bash(git status:*)", "Bash(git diff:*)", "Bash(git log:*)",
            "Bash(git show:*)", "Bash(git add:*)", "Bash(git commit:*)"]
    deny: ["Bash(git push:*)", "Edit(.git/**)", "Write(.git/**)", "Edit(.claude/**)", "Write(.claude/**)"]
  sidecarTools: [AskUserQuestion, set_session_meta, draft_card, memory_write, spawn_worker, wait_for_result,
                 open_issue, list_responder_cards, view_logs]
  spawns: { allow: [ops-worker] }
  owns: { repos: [MohammadBnei/agent-fleet, MohammadBnei/infra-bootstrap] }
  cluster: { logNamespaces: [agent-fleet, ukubi-game, ukubi-realm, ukubi-meet, monitoring] }
  # Guaranteed QoS (ADR-0084 §9): requests equal limits; the sidecar's 256Mi/100m is the provisioner's.
  resources: { cpu: 500m, memory: 1536Mi }
  limits:
    maxTurns: 60
    timeout: 30m
    concurrency: 1
    startupBudget: 3m
    turnsPerDay: 200
    spawns: { concurrent: 1, perHour: 6, perDay: 24 }
