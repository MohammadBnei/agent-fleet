# ukubi-game's resident of vos-monolith (game-base.yaml): it reads the repo and answers
# the player. Only the api.anthropic.com service: pr mode holds no GitHub key.
apiVersion: fleet.bnei.dev/v1alpha1
kind: AgentDefinition
metadata: { name: game-vos-monolith }
spec:
  extends: game-base
  invokers: [ukubi-game]
  credentials:
    vault: game-vos-monolith
    services:
      - { host: api.anthropic.com, secret: CLAUDE_CODE_OAUTH_TOKEN }
  workspace: { kind: repo, repo: vos-monolith }
  git: { mode: pr, identity: { name: game-vos-monolith, email: game-vos-monolith@bnei.dev } }
