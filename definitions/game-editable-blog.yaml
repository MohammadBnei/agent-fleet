# ukubi-game's resident of editable-blog (game-base.yaml): it reads the repo and answers
# the player. Only the api.anthropic.com service: pr mode holds no GitHub key.
apiVersion: fleet.bnei.dev/v1alpha1
kind: AgentDefinition
metadata: { name: game-editable-blog }
spec:
  extends: game-base
  invokers: [ukubi-game]
  credentials:
    vault: game-editable-blog
    services:
      - { host: api.anthropic.com, secret: CLAUDE_CODE_OAUTH_TOKEN }
  workspace: { kind: repo, repo: editable-blog }
  git: { mode: pr, identity: { name: game-editable-blog, email: game-editable-blog@bnei.dev } }
