# The Opus Tech workspace co-editor (docs/adr/0062), behind the island on
# opus.bnei.dev (docs/adr/0068). The repo is a fleet member through the
# ukubi-fleet App's opus-tech-hq installation (docs/adr/0075), and GH_<VAULT>
# is the token the provisioner mints for it. `invokers` stays empty until an
# opus-ci client exists.
#
# The model credential is the fleet's own CLAUDE_CODE_OAUTH_TOKEN for now (the
# owner's call, 2026-10-21). It moves to a separate Anthropic account's
# `claude setup-token` value (e.g. ANTHROPIC_OPUS in Infisical /agent-vault)
# by changing the secret name below; until then Opus threads run on the same
# account as the owner's sessions.
apiVersion: fleet.bnei.dev/v1alpha1
kind: AgentDefinition
metadata: { name: opus-workspace }
spec:
  extends: workspace-base
  audience: { group: shared-notes }
  embed: { origins: ["https://opus.bnei.dev"] }
  credentials:
    vault: opus-workspace
    services:
      - { host: github.com, paths: ["/opus-tech-hq/workspace/*", "/opus-tech-hq/workspace.git/*"], secret: GH_OPUS_WORKSPACE }
      - { host: api.github.com, paths: ["/repos/opus-tech-hq/workspace/*"], secret: GH_OPUS_WORKSPACE }
      - { host: api.anthropic.com, secret: CLAUDE_CODE_OAUTH_TOKEN }
  workspace: { kind: repo, repo: opus-workspace }
  git: { mode: push, branch: main, identity: { name: opus-agent, email: opus-agent@bnei.dev } }
  systemPrompt: { append: "You co-edit the Opus Tech workspace (a SilverBullet space). Keep pages small and linked." }
  skills: [doubt-driven-development]
  tools:
    allow: [Read, Edit, Write, Glob, Grep, "Bash(git add:*)", "Bash(git commit:*)", "Bash(git pull --rebase:*)", "Bash(git push:*)"]
    deny: ["Edit(.git/**)", "Write(.git/**)", "Edit(.claude/**)", "Write(.claude/**)", "Write(_plug/**)"]
  interaction: { allow: [ask, deny] }
  lifecycle: { allow: [resident, single-shot] }
  owns: { repos: [opus-workspace], components: [], subjects: [], types: [] }
  limits: { maxTurns: 60, timeout: 30m, concurrency: 2, startupBudget: 3m }
