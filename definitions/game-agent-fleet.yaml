# ukubi-game's resident of agent-fleet (game-base.yaml): it reads the repo and answers
# the player. Only the api.anthropic.com service: pr mode holds no GitHub key.
apiVersion: fleet.bnei.dev/v1alpha1
kind: AgentDefinition
metadata: { name: game-agent-fleet }
spec:
  extends: game-base
  invokers: [ukubi-game]
  credentials:
    vault: game-agent-fleet
    services:
      - { host: api.anthropic.com, secret: CLAUDE_CODE_OAUTH_TOKEN }
  workspace: { kind: repo, repo: agent-fleet }
  git: { mode: pr, identity: { name: game-agent-fleet, email: game-agent-fleet@bnei.dev } }
